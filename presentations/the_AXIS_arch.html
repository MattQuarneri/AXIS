<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════════════════
   THE EDGES — Adapters (raw → Intent), Impacts (the only IO), Wrappers.
   There are exactly four event listeners in this entire file, and they are all
   below. Everything else that looks like an event handler is a data attribute.
   ══════════════════════════════════════════════════════════════════════════════ */

/* ── ADAPTERS (Bridging · Expression) ───────────────────────────────────────
   Convert edge noise into normalized Intents. They extract raw auth material
   and never mint a Token — the Manager does that, once, in one place.
   ──────────────────────────────────────────────────────────────────────────── */
const readEl = (el) => ({
  capability: el.getAttribute('data-i'),
  payload: el.hasAttribute('data-p') ? JSON.parse(el.getAttribute('data-p')) : {},
  rawAuth: el.hasAttribute('data-auth') ? JSON.parse(el.getAttribute('data-auth')) : null,
  ctx: el.closest('[data-wrapper]') ? el.closest('[data-wrapper]').getAttribute('data-wrapper') : 'document'
});

AX.adapter('adapter.dom.click', (ev) => {
  const el = ev.target && ev.target.closest ? ev.target.closest('[data-i]') : null;
  if (!el || el.matches('select,input')) return null;
  const r = readEl(el);
  return AX.intent(r.capability, r.capability, r.payload, { rawAuth: r.rawAuth, wrapperCtx: r.ctx, source: 'click' });
});

AX.adapter('adapter.dom.change', (ev) => {
  const el = ev.target && ev.target.closest ? ev.target.closest('[data-i]') : null;
  if (!el) return null;
  const r = readEl(el);
  const v = el.type === 'checkbox' ? el.checked : el.value;
  return AX.intent(r.capability, r.capability, Object.assign({ v }, r.payload), { rawAuth: r.rawAuth, wrapperCtx: r.ctx, source: 'change' });
});

AX.adapter('adapter.hash', (hash) => {
  const p = new URLSearchParams(String(hash || '').replace(/^#/, ''));
  if (!p.get('m')) return null;
  return AX.intent('tutorial.goto', 'tutorial.goto', { id: p.get('m') }, { wrapperCtx: 'location', source: 'url' });
});

AX.adapter('adapter.keyboard', (ev) => {
  if (ev.target && ev.target.matches && ev.target.matches('input,select,textarea')) return null;
  const state = (AX.managers && AX.managers.client && AX.managers.client.instance) ? AX.managers.client.instance.state : {};
  if (ev.key === 'Escape') {
    if (state.codeModal) {
      ev.preventDefault();
      return AX.intent('code.close', 'code.close', {}, { wrapperCtx: 'document', source: 'key' });
    }
    if (state.drawer) {
      ev.preventDefault();
      return AX.intent('grid.close', 'grid.close', {}, { wrapperCtx: 'document', source: 'key' });
    }
  }
  const map = { ' ': ['flow.play', {}], '.': ['flow.step', { dir: 'fwd' }], ',': ['flow.step', { dir: 'back' }],
                'k': ['keys.toggle', {}], 'c': ['code.toggle', {}], 'C': ['code.toggle', {}],
                'w': ['walk.toggle', {}], 'W': ['walk.toggle', {}] };
  const hit = map[ev.key];
  if (!hit) return null;
  ev.preventDefault();
  return AX.intent(hit[0], hit[0], hit[1], { wrapperCtx: 'document', source: 'key' });
});

AX.adapter('adapter.worker', (msg) => AX.intent('invoice.outcome', 'invoice.applyOutcome', msg, { wrapperCtx: 'worker', source: 'server' }));

/* ── IMPACTS (Changing · Expression) ────────────────────────────────────────
   The membrane. Every DOM write, every storage write, every timer, every
   message to the other context happens in one of these functions and nowhere
   else in this file. If that is ever untrue, movement 5.15's lint should say so.
   ──────────────────────────────────────────────────────────────────────────── */
const VIEW_CACHE = new Map();

AX.impact('RENDER', (eff, ctx) => {
  const M = ctx.manager, state = M.instance.state;
  const changed = (eff.payload && eff.payload.changed) || ['*'];
  let painted = 0;
  for (const key of M.wrappers) {
    const w = R.get(key);
    if (!w) continue;
    if (eff.target !== '*' && eff.target !== key) continue;
    const hit = changed.indexOf('*') >= 0 || w.watches.indexOf('*') >= 0 || w.watches.some(k => changed.indexOf(k) >= 0);
    if (!hit) continue;
    const el = document.querySelector(w.mount);
    if (!el) continue;
    let html;
    try { html = w.render(state, IX, MODEL); }
    catch (err) { html = '<div class="panel"><b style="color:var(--bad)">' + key + ' failed to render</b><pre>' + String(err && err.stack || err) + '</pre></div>'; }
    if (VIEW_CACHE.get(key) === html) continue;
    VIEW_CACHE.set(key, html);
    // A Wrapper that renders nothing is not on screen. One rule, so no view
    // needs to know how to hide itself.
    el.toggleAttribute('hidden', html.trim() === '');
    // Transplant live nodes marked data-keep (sliders mid-drag, open <details>)
    const keep = [...el.querySelectorAll('[data-keep]')];
    el.innerHTML = html;
    for (const node of keep) {
      const slot = el.querySelector('[data-keep="' + node.getAttribute('data-keep') + '"]');
      if (slot) { if (document.activeElement !== node && slot.value !== undefined) node.value = slot.value; slot.replaceWith(node); }
    }
    painted++;
  }
  return { ok: true, painted };
}, { io: 'DOM' });

AX.impact('FACET_SWAP', (eff) => {
  // Composing one layout facet with one look facet. The stylesheets are
  // separate files-in-spirit ({component}.{name}.look.css); swapping them is
  // Facet selection, not a colour change.
  const fam = eff.target, name = eff.payload.name;
  if (fam === 'look') {
    document.documentElement.setAttribute('data-look', name);
    document.querySelectorAll('style[data-look-family="look"]').forEach(s => { s.disabled = s.getAttribute('data-facet') !== 'app.' + name + '.look.css'; });
  } else {
    document.documentElement.setAttribute('data-layout', name);
    document.querySelectorAll('style[data-facet="app.dense.layout.css"]').forEach(s => { s.disabled = name !== 'dense'; });
  }
  return { ok: true };
}, { io: 'DOM' });

AX.impact('PERSIST', (eff) => {
  try { localStorage.setItem(eff.target, JSON.stringify(eff.payload)); return { ok: true }; }
  catch (e) { return { ok: false, error: 'storage unavailable' }; }
}, { io: 'storage' });

AX.impact('URL_SET', (eff) => {
  const p = eff.payload, q = new URLSearchParams();
  q.set('m', p.m); q.set('flow', p.flow); q.set('step', String(p.step)); q.set('profile', p.profile);
  if (p.role) q.set('role', p.role);
  const next = '#' + q.toString();
  if (location.hash !== next) history.replaceState(null, '', next);
  return { ok: true };
}, { io: 'history' });

AX.impact('FOCUS', (eff) => {
  const el = document.getElementById(eff.target);
  if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  return { ok: true };
}, { io: 'DOM' });

AX.impact('TICK', (eff, ctx) => new Promise(res => {
  setTimeout(() => res({ ok: true, followUp: AX.intent(eff.payload.capability, eff.payload.capability,
    { dir: eff.payload.dir }, { wrapperCtx: 'timer', source: 'clock' }) }), eff.payload.ms);
}), { io: 'timer' });

AX.impact('TOAST', (eff, ctx) => ({ ok: true, followUp: AX.intent('toast.set', 'toast.set', { text: eff.payload.text }, { wrapperCtx: 'system', source: 'system', silent: false }) }));

AX.impact('CLIPBOARD_COPY', (eff) => {
  const text = (eff.payload && eff.payload.text) || '';
  let copied = false;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(() => {});
    copied = true;
  }
  if (!copied) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      copied = true;
    } catch (e) {}
  }
  return { ok: true, followUp: AX.intent('toast.set', 'toast.set', { text: 'Code snippet copied to clipboard' }, { wrapperCtx: 'system', source: 'system', silent: false }) };
}, { io: 'clipboard' });


AX.impact('REJECTED', (eff) => {
  const p = eff.payload || {};
  const msg = p.violations ? p.violations.map(v => v.from + ' — ' + v.msg).join(' · ') : (p.reason || 'rejected');
  return { ok: true, followUp: AX.intent('toast.set', 'toast.set', { text: 'Commit rejected · ' + msg }, { wrapperCtx: 'system', source: 'system' }) };
});

/* The composition studio's effect: it edits the key space of a LIVE system. */
AX.impact('COMPOSE', (eff, ctx) => {
  const s = eff.payload, SM = AX.managers.server;
  if (eff.target === 'wire') {
    const facet = R.get(s.facet);
    AX.facet(s.facet, Object.assign({}, facet, { delegates: Object.assign({}, facet.delegates, { [s.capability]: s.action }) }));
  } else if (eff.target === 'unwire') {
    const facet = R.get(s.facet), d = Object.assign({}, facet.delegates);
    delete d[s.capability];
    AX.facet(s.facet, Object.assign({}, facet, { delegates: d }));
  } else if (eff.target === 'unbindHandler') { SM.impacts.delete(s.effect); }
  else if (eff.target === 'bindHandler') { SM.impacts.set(s.effect, 'impact.' + s.effect); }
  // Composition is data, so it travels: the same edit is applied to the far
  // side's key space as an ordinary message.
  AX.workerCompose(eff.target, s);
  return { ok: true };
}, { io: 'registry' });

/* Two-pass reads over the page's own runtime: declare, execute, re-enter. */
AX.impact('AUDIT', (eff) => {
  const rep = AX.managers.server.composer.audition();
  const clientRep = AX.managers.client.composer.audition();
  const model = { bonds: [] };
  for (const k of ['bond.axis.components', 'bond.component.zone']) {
    const b = R.get(k);
    if (b && b.checkModel) model.bonds.push({ key: k, describe: b.describe, problems: b.checkModel() });
  }
  model.drift = AX.modelDrift();
  return { ok: true, followUp: AX.intent('audit.result', 'audit.apply', { server: rep, client: clientRep, model }, { wrapperCtx: 'runtime', source: 'system' }) };
}, { io: 'reflection' });

AX.impact('LINT', () => ({ ok: true, followUp: AX.intent('lint.result', 'lint.apply', AX.lint(), { wrapperCtx: 'runtime', source: 'system' }) }), { io: 'reflection' });

AX.impact('REPLAY', async (eff, ctx) => {
  const live = AX.managers.client;
  const volatile = ['audit', 'lint', 'replay', 'toast', 'serverLog', 'invoice', 'linked'];
  const strip = (st) => { const o = {}; for (const k of Object.keys(st).sort()) if (volatile.indexOf(k) < 0) o[k] = st[k]; return JSON.stringify(o); };
  const recorded = live.recording.filter(i => i.capability !== 'replay.run' && i.capability !== 'replay.apply');
  const harness = AX.createManager({
    id: 'manager.replay', context: 'client', formKey: 'form.tutorial', identityKey: 'identity.reader',
    quiet: true, flags: { fastRetry: true }, policy: AX.clientPolicy
  });
  harness.composer.registerBond('bond.movement.act');
  ['facet.tutorial.reading', 'facet.tutorial.technical', 'facet.tutorial.gentle'].forEach(f => harness.composer.registerFacet(f));
  // Same Actions, same Facets, same commit path — but every Impact is a recorder.
  for (const kind of ['RENDER', 'PERSIST', 'URL_SET', 'FOCUS', 'TICK', 'TOAST', 'REJECTED', 'COMPOSE', 'AUDIT', 'LINT', 'REPLAY', 'SEND_TO_SERVER', 'SERVER_RESET', 'FACET_SWAP', 'CLIPBOARD_COPY']) {
    const key = 'impact.replay.' + kind;
    if (!R.has(key)) R.define(key, () => ({ ok: true }), { kind: 'impact', effectKind: kind, stub: true });
    harness.composer.registerImpact(kind, key);
  }
  harness.composer.bind(live.initial);   // same starting point, or the comparison means nothing
  const t0 = performance.now();
  for (const i of recorded) { try { await harness.dispatch(i); } catch (e) { /* recorded below */ } }
  const ms = Math.round(performance.now() - t0);
  const a = strip(live.instance.state), b = strip(harness.instance.state);
  const diffs = [];
  const la = JSON.parse(a), lb = JSON.parse(b);
  for (const k of Object.keys(la)) if (JSON.stringify(la[k]) !== JSON.stringify(lb[k])) diffs.push(k);
  return { ok: true, followUp: AX.intent('replay.result', 'replay.apply', {
    intents: recorded.length, ms, match: a === b, hashLive: AX.hash(a), hashReplay: AX.hash(b),
    diffs, revLive: live.instance.revisionId, revReplay: harness.instance.revisionId
  }, { wrapperCtx: 'runtime', source: 'system' }) };
}, { io: 'reflection' });

AX.impact('SERVER_RESET', () => {
  AX.buildServerManager();
  if (AX.worker.instance && AX.worker.ready) AX.worker.instance.postMessage({ kind: 'reset', id: AX.uid('rst') });
  return { ok: true };
}, { io: 'fixture' });

/* The transport. This is the ONLY thing that differs between "the server is a
   Worker", "the server is in this process", and "the server is behind HTTPS".
   Nothing above the membrane knows which one is selected. */
AX.impact('SEND_TO_SERVER', (eff, ctx) => {
  const mode = ctx.manager.instance.state.transport;
  const msg = { kind: 'server.request', payload: eff.payload, rawAuth: eff.rawAuth, id: eff.payload.correlationId };
  const reply = (res) => ({ ok: !!res.ok, followUp: AX.intent('invoice.outcome', 'invoice.applyOutcome', res, { wrapperCtx: 'transport:' + mode, source: 'server' }) });
  if (mode === 'inpage') return Promise.resolve(AX.serverHandle(msg)).then(reply);
  if (mode === 'http') return Promise.resolve({ ok: false, error: 'no endpoint configured' })
    .then(() => ({ ok: true, followUp: AX.intent('toast.set', 'toast.set', { text: 'real HTTP is disabled: this file ships with no endpoint. Saying otherwise would be the kind of claim this page is trying not to make.' }, { wrapperCtx: 'transport', source: 'system' }) }));
  return AX.workerSend(msg).then(reply);
}, { io: 'transport' });

/* ── WRAPPERS (Bridging · Essence) ──────────────────────────────────────────
   Each declares where it mounts and which slice of state it watches. None of
   them contains a rule; they are hosts. `watches` is what makes a 60-node page
   repaint three nodes.
   ──────────────────────────────────────────────────────────────────────────── */
AX.defineWrapper = (key, mount, watches, render) => AX.wrapper(key, { mount, watches, render });

/* ── the client Manager's policy ────────────────────────────────────────────
   Token minting and Facet selection, in one place, for the whole page.
   ──────────────────────────────────────────────────────────────────────────── */
AX.clientPolicy = (M) => ({
  covers: () => ['facet.tutorial.reading', 'facet.tutorial.technical', 'facet.tutorial.gentle'],
  token(intent) {
    if (intent.rawAuth && Object.prototype.hasOwnProperty.call(intent.rawAuth, 'role')) {
      const r = intent.rawAuth.role;
      if (!r) { M.tokens.delete('reader'); return null; }
      return M.issueToken('reader', intent.rawAuth, { role: r, depth: (IX.role[r] || {}).depth || 'plain' });
    }
    const t = M.tokenFor('reader');
    if (t && t.expiry < Date.now()) { M.tokens.delete('reader'); return null; }
    return t || null;
  },
  select(intent, token) {
    const depth = token && token.claims ? token.claims.depth : null;
    return depth === 'technical' ? 'facet.tutorial.technical'
         : depth === 'gentle' ? 'facet.tutorial.gentle'
         : 'facet.tutorial.reading';
  }
});

/* Does the model's claim about this page match the running page? */
AX.modelDrift = function () {
  const drift = [];
  for (const c of MODEL.components) {
    for (const k of (c.keys || [])) {
      if (k.endsWith('*')) { const pre = k.slice(0, -1); if (!R.keys().some(x => x.indexOf(pre) === 0)) drift.push(c.id + ': model claims ' + k + ', runtime has none'); continue; }
      if (!R.has(k)) drift.push(c.id + ': model claims ' + k + ', runtime has no such key');
    }
  }
  const counts = { model: MODEL.components.length, axes: MODEL.axes.length };
  if (counts.model !== 14) drift.push('the model has ' + counts.model + ' components; every document says fourteen');
  if (counts.axes !== 7) drift.push('the model has ' + counts.axes + ' axes; every document says seven');
  return drift;
};
</script>

<script id="axis-server-domain">
'use strict';
/* ══════════════════════════════════════════════════════════════════════════════
   THE SERVER CONTEXT — the invoice domain.
   ------------------------------------------------------------------------------
   THIS SCRIPT RUNS IN TWO HOSTS. The page executes it directly (that is the
   "in-page" transport), and the Worker is built from this element's own
   textContent plus the kernel's (that is the "worker" transport). Same
   characters, two runtimes — and 5.7 hashes what each host actually loaded and
   compares them in front of you, because a claim you can check beats a claim
   you have to believe.

   Therefore: no DOM, no window, no page globals. Only the kernel.
   ══════════════════════════════════════════════════════════════════════════════ */

AX.form('form.invoice', {
  shape: { id: 'string', status: 'string', customerRef: 'string', lineItems: 'object[]',
           total: 'number', discount: 'number', mailAttempts: 'number', lastError: 'string|null',
           history: 'string[]' },
  defaults: { id: 'inv-4471', status: 'draft', customerRef: 'cust-19',
              lineItems: [{ id: 'li-1', label: 'Design sprint', amount: 900 },
                          { id: 'li-2', label: 'Revisions', amount: 350 }],
              total: 1250, discount: 0, mailAttempts: 0, lastError: null, history: [] },
  invariants: [
    (s) => ['draft', 'sent', 'paid', 'void'].indexOf(s.status) >= 0 ? null : 'unknown invoice status: ' + s.status,
    (s) => s.total >= 0 ? null : 'total may not be negative'
  ]
});

AX.identity('identity.invoice', { entityId: 'inv-4471', formRef: 'form.invoice', versioningPolicy: 'revision-counter' });

/* The aggregate rule. One place. Checked by the Committer on every commit,
   on every path, including paths nobody has written yet. */
AX.bond('bond.invoice.lineItems', {
  ownerRef: 'form.invoice', targetRef: 'form.lineItem', cardinality: 'one-to-many',
  describe: 'invoice.total must equal the sum of its line items, less any discount',
  invariants: [
    (s) => {
      const sum = s.lineItems.reduce((a, li) => a + li.amount, 0) - s.discount;
      return s.total === sum ? null : 'total ' + s.total + ' ≠ Σ line items (' + sum + ')';
    }
  ]
});

/* Hydration happens here, before dispatch — never inside an Action. */
AX.link('link.invoice.customer', {
  bondRef: 'bond.invoice.customer', scope: 'request',
  resolve(state) {
    const dir = { 'cust-19': { id: 'cust-19', name: 'Halberd Studio', email: 'ap@halberd.example', terms: 'net-30' } };
    return { customer: dir[state.customerRef] || null };
  }
});

/* ── FACETS: the lifecycle capability surfaces ──────────────────────────────
   Three surfaces for one entity, selected by state, not by conditionals. Note
   that 'invoice.discount' is deliberately NOT wired here — movement 5.9 asks
   you to wire it into a running system, by key.
   ──────────────────────────────────────────────────────────────────────────── */
AX.facet('facet.invoice.draft', { describe: 'a draft may be sent, discounted (if wired) or voided',
  delegates: { 'invoice.send': 'action.invoice.send', 'invoice.void': 'action.invoice.void' } });
AX.facet('facet.invoice.sent', { describe: 'a sent invoice may be paid, voided, or reverted by a compensating effect',
  delegates: { 'invoice.pay': 'action.invoice.pay', 'invoice.void': 'action.invoice.void', 'invoice.revert': 'action.invoice.revert' } });
AX.facet('facet.invoice.paid', { describe: 'a paid invoice has no remaining capabilities — the empty map IS the policy',
  delegates: {} });
AX.facet('facet.invoice.void', { describe: 'terminal', delegates: {} });

/* ── ACTIONS: identical in shape to the client's. Pure, synchronous. ─────── */
AX.action('action.invoice.send', (s, i) => {
  if (s.status !== 'draft') {
    return { delta: {}, effects: [{ kind: 'REJECTED', target: i.meta.correlationId, payload: { reason: 'a ' + s.status + ' invoice cannot be sent' } }] };
  }
  return {
    delta: { status: 'sent', history: s.history.concat(['sent']) },
    effects: [
      { kind: 'DB_WRITE', target: 'invoices', payload: { id: s.id, status: 'sent' } },
      { kind: 'EMAIL_SEND', target: (s.$linked && s.$linked.customer ? s.$linked.customer.email : 'unknown'),
        payload: { subject: 'Invoice ' + s.id, total: s.total, fail: !!i.payload.failMail },
        retryPolicy: { maxRetries: 2, backoff: 'exponential' },
        compensatingEffect: { kind: 'REVERT_STATUS', target: s.id, payload: { to: 'draft', correlationId: i.meta.correlationId } } }
    ]
  };
}, { declares: ['DB_WRITE', 'EMAIL_SEND', 'REJECTED'], needs: ['link.invoice.customer'] });

AX.action('action.invoice.pay', (s, i) => {
  if (s.status !== 'sent') return { delta: {}, effects: [{ kind: 'REJECTED', target: i.meta.correlationId, payload: { reason: 'only a sent invoice can be paid' } }] };
  return { delta: { status: 'paid', history: s.history.concat(['paid']) },
           effects: [{ kind: 'DB_WRITE', target: 'invoices', payload: { id: s.id, status: 'paid' } }] };
}, { declares: ['DB_WRITE', 'REJECTED'] });

AX.action('action.invoice.void', (s, i) => ({
  delta: { status: 'void', history: s.history.concat(['void']) },
  effects: [{ kind: 'DB_WRITE', target: 'invoices', payload: { id: s.id, status: 'void' } }]
}), { declares: ['DB_WRITE'] });

/* The compensation re-enters through the front door as an ordinary Intent and
   is routed by whichever Facet the lifecycle currently selects. */
AX.action('action.invoice.revert', (s, i) => ({
  delta: { status: i.payload.to || 'draft', lastError: i.payload.reason || 'compensated',
           history: s.history.concat(['reverted:' + (i.payload.to || 'draft')]) },
  effects: [{ kind: 'DB_WRITE', target: 'invoices', payload: { id: s.id, status: i.payload.to || 'draft' } }]
}), { declares: ['DB_WRITE'] });

/* The capability movement 5.9 wires by hand. It exists; nothing routes to it
   until a Facet delegate names it. `breakBond` deliberately updates the
   discount without updating the total, so the Bond can refuse the commit. */
AX.action('action.invoice.discount', (s, i) => {
  const amt = Number(i.payload.amount || 100);
  const sum = s.lineItems.reduce((a, li) => a + li.amount, 0);
  const delta = i.payload.breakBond
    ? { discount: amt, history: s.history.concat(['discount:' + amt + ' (bond-breaking)']) }
    : { discount: amt, total: sum - amt, history: s.history.concat(['discount:' + amt]) };
  return { delta, effects: [{ kind: 'DB_WRITE', target: 'invoices', payload: { id: s.id, discount: amt } }] };
}, { declares: ['DB_WRITE'] });

/* ── SERVER IMPACTS: SQL, mail. The only IO on this side. ───────────────── */
AX.impact('DB_WRITE', (eff) => ({ ok: true, wrote: eff.target, row: eff.payload }), { io: 'sql' });

AX.impact('EMAIL_SEND', (eff) => {
  // Simulated, deterministically: a demo that failed at random would be
  // untestable, which would be an odd thing for this page to ship.
  if (eff.payload && eff.payload.fail) throw new Error('SMTP 421 — service not available');
  return { ok: true, sent: eff.target };
}, { io: 'mail' });

AX.impact('REVERT_STATUS', (eff) => ({
  ok: true, reverted: true,
  followUp: AX.intent('invoice.revert', 'invoice.revert',
    { to: eff.payload.to, reason: 'mail delivery exhausted its retries' },
    { wrapperCtx: 'compensation', correlationId: eff.payload.correlationId, source: 'system' })
}), { io: 'sql' });

/* ── SERVER WRAPPER + ADAPTER ───────────────────────────────────────────────
   The wrapper is a message port (or an HTTP listener — same role, different
   flesh). The adapter normalizes the arriving message into the SERVER's own
   Intent vocabulary. This is the second normalization of the same semantic
   operation, and it is the single best justification for the Bridging axis.
   ──────────────────────────────────────────────────────────────────────────── */
AX.wrapper('wrapper.server.port', { mount: '(message port)', watches: [], describe: 'hosts arriving messages; decides nothing', render: () => '' });

AX.adapter('adapter.server.request', (msg) => AX.intent(
  'server.' + msg.payload.capability, msg.payload.capability,
  { amount: msg.payload.amount, failMail: msg.payload.failMail, breakBond: msg.payload.breakBond, to: msg.payload.to },
  { rawAuth: msg.rawAuth, wrapperCtx: 'wrapper.server.port', correlationId: msg.id, source: 'wire' }
));

/* ── THE SERVER MANAGER ─────────────────────────────────────────────────────
   A second Manager. Not a new mechanism — the same one, further away. It never
   calls the client Manager and the client Manager never calls it; they exchange
   Effects and Intents, which is exactly why the transport is swappable.
   ──────────────────────────────────────────────────────────────────────────── */
AX.serverPolicy = (M) => ({
  covers: () => ['facet.invoice.draft', 'facet.invoice.sent', 'facet.invoice.paid', 'facet.invoice.void'],
  token(intent) {
    // Minted HERE, from raw material the Adapter merely carried.
    const raw = (intent.rawAuth && intent.rawAuth.authHeader) || '';
    const who = raw.replace(/^Bearer demo\./, '') || 'anon';
    return M.issueToken('request', intent.rawAuth, { subject: who, owner: who !== 'anon', scope: 'invoice:' + M.identityKey });
  },
  select(intent, token, instance) {
    // Claims × lifecycle select the surface. No conditional decides capability.
    return 'facet.invoice.' + instance.state.status;
  }
});

AX.buildServerManager = function () {
  const M = AX.createManager({
    id: 'manager.server', context: 'server', formKey: 'form.invoice', identityKey: 'identity.invoice',
    policy: AX.serverPolicy, tokenTtl: 5 * 60000,
    boundary: {
      ownedState: 'form.invoice + its line items — one aggregate, one commit path',
      acceptedIntents: 'invoice.send · invoice.pay · invoice.void · invoice.revert (+ whatever 5.9 wires)',
      emittedEffects: 'DB_WRITE · EMAIL_SEND · REVERT_STATUS · REJECTED',
      returnedOutcomes: 'a summary and a trace, re-entering the client as a follow-up Intent',
      policyScope: 'claims minted from the Authorization header; scope invoice:identity.invoice'
    }
  });
  M.composer.registerBond('bond.invoice.lineItems');
  ['facet.invoice.draft', 'facet.invoice.sent', 'facet.invoice.paid', 'facet.invoice.void'].forEach(f => M.composer.registerFacet(f));
  ['DB_WRITE', 'EMAIL_SEND', 'REVERT_STATUS', 'REJECTED'].forEach(k => M.composer.registerImpact(k));
  const report = M.composer.bind();
  AX.managers = AX.managers || {};
  AX.managers.server = M;
  AX.serverAudition = report;
  return M;
};

/* One request, end to end, on the far side of the boundary. */
AX.serverHandle = async function (msg) {
  if (msg.kind === 'reset') { const m = AX.buildServerManager(); return { ok: true, id: msg.id, reset: true, rev: m.instance.revisionId }; }
  const M = AX.managers.server;
  if (msg.kind === 'compose') {
    // Composition is data, so it travels. The studio's edit crosses the wire
    // as an ordinary message and is applied to the far side's key space.
    const s = msg.payload;
    if (msg.op === 'wire' || msg.op === 'unwire') {
      const f = R.get(s.facet), d = Object.assign({}, f.delegates);
      if (msg.op === 'wire') d[s.capability] = s.action; else delete d[s.capability];
      AX.facet(s.facet, Object.assign({}, f, { delegates: d }));
    } else if (msg.op === 'unbindHandler') M.impacts.delete(s.effect);
    else if (msg.op === 'bindHandler') M.impacts.set(s.effect, 'impact.' + s.effect);
    return { ok: true, id: msg.id, audition: M.composer.audition() };
  }
  const intent = R.get('adapter.server.request')(msg);
  const before = M.trace.length;
  let res;
  try { res = await M.dispatch(intent); }
  catch (err) { res = { ok: false, reason: String(err && err.message || err) }; }
  const trace = M.trace.slice(before).map(t => ({
    seq: t.seq, kind: t.kind, facet: t.facet, action: t.action, token: t.token,
    effects: t.effects || [], rev: t.rev, rejected: t.rejected || null, violations: t.violations || null
  }));
  const st = M.instance.state;
  const summary = res.ok
    ? (trace[0] ? trace[0].facet + ' → ' + (trace[0].action || '—') + ' → [' + (trace[0].effects || []).join(', ') + ']' : 'ok')
    : ('refused: ' + (res.reason || (trace[0] && trace[0].rejected) || 'see trace'));
  return {
    ok: !!res.ok, id: msg.id, summary, trace,
    invoice: { status: st.status, total: st.total, discount: st.discount, history: st.history, lastError: st.lastError },
    rev: M.instance.revisionId,
    outcomes: (res.outcomes || []).map(o => ({ kind: o.kind, ok: o.ok, attempts: o.attempts, error: o.error || null, compensated: !!o.compensated }))
  };
};

/* What each host actually loaded, hashed. 5.7 compares these two numbers. */
AX.srcOf = (v) => (typeof v === 'function' ? String(v) : JSON.stringify(v, (k, val) => (typeof val === 'function' ? String(val) : val)));
AX.serverCodeHash = () => AX.hash(['action.invoice.send', 'action.invoice.pay', 'action.invoice.void', 'action.invoice.revert',
  'action.invoice.discount', 'bond.invoice.lineItems', 'form.invoice', 'facet.invoice.draft', 'facet.invoice.sent']
  .map(k => k + ':' + AX.srcOf(R.get(k))).join('|'));

/* Worker entry point. Only this function knows it is in a Worker; nothing
   above it does, which is the entire claim of movement 5.7. */
AX.serverWorkerBoot = function () {
  AX.buildServerManager();
  self.onmessage = async (e) => {
    const m = e.data;
    if (m && m.kind === 'hash') { self.postMessage({ kind: 'hash', id: m.id, hash: AX.serverCodeHash(), keys: R.keys().length }); return; }
    const res = await AX.serverHandle(m);
    self.postMessage(Object.assign({ kind: 'server.reply' }, res));
  };
  self.postMessage({ kind: 'ready', hash: AX.serverCodeHash(), keys: R.keys().length });
};
</script>

<script>
'use strict';
/* ── The transport plumbing (client side of the wire) ──────────────────────
   The only code in this file that knows whether the server is a Worker.
   If Worker construction fails — a file:// origin, a strict CSP — the page
   degrades to the in-page transport with an honest label rather than breaking.
   ──────────────────────────────────────────────────────────────────────────── */
AX.worker = { instance: null, ready: false, hash: null, keys: 0, error: null, pending: new Map() };

AX.startWorker = function () {
  try {
    const src = document.getElementById('axis-kernel').textContent + '\n'
              + document.getElementById('axis-server-domain').textContent + '\n'
              + 'AX.serverWorkerBoot();\n';
    AX.worker.srcHash = AX.hash(src);
    AX.worker.srcChars = src.length;
    const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    const w = new Worker(url);
    w.onmessage = (e) => {
      const m = e.data;
      if (m.kind === 'ready' || m.kind === 'hash') {
        AX.worker.ready = true; AX.worker.hash = m.hash; AX.worker.keys = m.keys;
        AX.managers.client.dispatch(AX.intent('worker.ready', 'toast.set',
          { text: 'Worker context up · ' + m.keys + ' keys registered · shared-module hash ' + m.hash }, { source: 'system' }));
        return;
      }
      const p = AX.worker.pending.get(m.id);
      if (p) { AX.worker.pending.delete(m.id); p(m); }
    };
    w.onerror = (err) => { AX.worker.error = String(err.message || err); AX.worker.ready = false; };
    AX.worker.instance = w;
  } catch (err) {
    AX.worker.error = String(err && err.message || err);
  }
};

AX.workerSend = function (msg) {
  if (!AX.worker.instance || !AX.worker.ready) return Promise.resolve(AX.serverHandle(msg));
  return new Promise((res) => {
    AX.worker.pending.set(msg.id, res);
    AX.worker.instance.postMessage(msg);
    setTimeout(() => { if (AX.worker.pending.has(msg.id)) { AX.worker.pending.delete(msg.id); res({ ok: false, summary: 'worker timeout', id: msg.id }); } }, 4000);
  });
};

AX.workerCompose = function (op, payload) {
  if (AX.worker.instance && AX.worker.ready) AX.worker.instance.postMessage({ kind: 'compose', op, payload, id: AX.uid('cmp') });
};
</script>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════════════════
   RENDER HELPERS + THE FLOW ENGINE
   Renderers are pure functions of (state) → HTML string. They are executed by
   impact.RENDER and by nothing else. The flow engine is generic: it draws
   whatever is in model.flows, so adding the saga flow was a JSON edit.
   ══════════════════════════════════════════════════════════════════════════════ */

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const P = (o) => "data-p='" + JSON.stringify(o).replace(/'/g, '&#39;') + "'";
const AUTH = (o) => "data-auth='" + JSON.stringify(o).replace(/'/g, '&#39;') + "'";
const hue = (c) => (IX.axis[c.axis] || { hue: 0 }).hue;
const hstyle = (c) => 'style="--h:' + hue(c) + '"';
const col = (c) => 'hsl(' + hue(c) + ' var(--sat) var(--lum))';
const softCol = (c) => 'hsl(' + hue(c) + ' var(--sat-soft) var(--lum-soft))';
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

const btn = (cap, payload, label, opts) => {
  const o = opts || {};
  return '<button class="btn ' + (o.cls || '') + '" data-i="' + cap + '" ' + P(payload || {}) +
    (o.auth ? ' ' + AUTH(o.auth) : '') + (o.pressed !== undefined ? ' aria-pressed="' + !!o.pressed + '"' : '') +
    (o.disabled ? ' disabled' : '') + (o.title ? ' title="' + esc(o.title) + '"' : '') + '>' + label + '</button>';
};
const seg = (cap, items, current, extra) => '<div class="seg">' + items.map(([v, label, dis]) =>
  '<button data-i="' + cap + '" ' + P(Object.assign({ id: v }, extra || {})) + ' aria-pressed="' + (v === current) +
  '"' + (dis ? ' disabled title="' + esc(dis) + '"' : '') + '>' + label + '</button>').join('') + '</div>';
const code = (src, cls) => '<pre class="' + (cls || '') + '"><code>' + esc(src) + '</code></pre>';
const panel = (title, body, extra) => '<div class="panel" ' + (extra || '') + '>' + (title ? '<h4>' + title + '</h4>' : '') + body + '</div>';
const keyline = (c, key, note) => '<div class="keyline" ' + (c ? hstyle(c) : '') + '><b>' + esc(key) + '</b>' + (note ? '<span style="color:var(--ink-3)">' + esc(note) + '</span>' : '') + '</div>';
const chip = (t, tone) => '<span class="chip"' + (tone ? ' data-tone="' + tone + '"' : '') + '>' + t + '</span>';

/* the three-part footer every movement carries, rendered from model.baselines */
function baselineHTML(id) {
  const b = IX.baseline[id];
  if (!b) return '';
  return '<div class="baseline">' +
    '<div class="conv"><div class="bl-h">Conventionally</div><div style="margin-bottom:8px">' + esc(b.typical.label) + '</div>' + code(b.typical.code, 'code-bad') + '</div>' +
    '<div style="padding:0"><div style="padding:13px 16px"><div class="bl-h">The cost</div><ul>' + b.cost.map(c => '<li>' + esc(c) + '</li>').join('') + '</ul></div></div>' +
    '<div class="ax"><div class="bl-h">In AXIS</div><div style="margin-bottom:8px">' + esc(b.axis.label) + '</div>' + code(b.axis.code, 'code-good') + '</div>' +
    '<div class="pay"><div class="bl-h">The payoff</div><ul>' + b.payoff.map(c => '<li>' + esc(c) + '</li>').join('') + '</ul></div>' +
    '<div class="not"><div class="bl-h">And when it isn\'t worth it</div><div style="font-size:14px">' + esc(b.notWorthItWhen) + '</div></div>' +
    '</div>';
}

/* a grid cell — the shape language, straight out of encoding */
function cellHTML(c, state, opts) {
  const o = opts || {};
  const lit = !o.profileSet || o.profileSet.has(c.id);
  return '<button class="cell" ' + hstyle(c) + ' data-pole="' + c.pole + '" data-dim="' + (!lit) + '" ' +
    'data-i="grid.select" ' + P({ id: c.id }) + ' title="' + esc(c.says) + '">' +
    '<span class="cname">' + esc(c.name) + '</span>' +
    '<span class="cone">' + esc(o.line === 'zone' ? c.zone + ' · altitude ' + c.altitude : c.oneLiner) + '</span>' +
    (state && state.showKeys ? '<span class="cone u-mono" style="opacity:.75">' + esc((c.keys || [])[0] || '') + '</span>' : '') +
    '</button>';
}

/* ── THE FLOW ENGINE ───────────────────────────────────────────────────────
   Data in: a flow from model.flows and a step index. Pixels out. It knows
   nothing about any particular flow — zones come from encoding.zones, node
   positions from component.pos, the membrane from encoding.membrane.
   ──────────────────────────────────────────────────────────────────────────── */
const PSEUDO = { world: { pos: { x: 0.015 }, altitude: 0.06, name: 'world', axis: null, pole: 'essence', zone: 'edge' } };
const W = 1000, H = 520, TOP = 26, BOT = 60;

function nodeOf(id) { return IX.comp[id] || PSEUDO[id]; }
function nodePos(id, ctx, two) {
  // Horizontal position is the component's ZONE. Vertical position is its
  // ALTITUDE. Neither is a layout choice — both are read from the model, which
  // is why bond.component.zone can check the drawing against its own rules.
  const n = nodeOf(id); if (!n) return null;
  const x = n.pos.x, y = TOP + n.altitude * (H - TOP - BOT);
  if (!two) return { x: x * W, y };
  return { x: (ctx === 'server' ? 545 + x * 440 : 15 + x * 440), y };
}
function nodeColor(id) { const n = IX.comp[id]; return n ? 'hsl(' + hue(n) + ' var(--sat) var(--lum))' : 'var(--ink-3)'; }

function edgePath(a, b, opts) {
  const o = opts || {};
  if (o.self) return 'M' + a.x + ',' + (a.y - 14) + ' a 26,20 0 1,1 14,4';
  if (o.arc === 'outer') {
    const midY = H - 8;
    return 'M' + a.x + ',' + a.y + ' C' + a.x + ',' + midY + ' ' + b.x + ',' + midY + ' ' + b.x + ',' + b.y;
  }
  const dx = (b.x - a.x) * 0.42;
  return 'M' + a.x + ',' + a.y + ' C' + (a.x + dx) + ',' + a.y + ' ' + (b.x - dx) + ',' + b.y + ' ' + b.x + ',' + b.y;
}

function flowSVG(state, opts) {
  const o = opts || {};
  const flow = IX.flow[o.flowId || state.flow];
  const two = flow.context === 'both';
  const stepIdx = o.step != null ? o.step : state.step;      // 0 = before the first step
  const mistakes = (o.mistakes !== undefined ? o.mistakes : state.mistakes) || [];
  const diffs = mistakes.map(m => IX.mistake[m]).filter(Boolean).map(m => m.flowDiff || {});
  const parts = [];
  const vb = two ? '0 0 1000 ' + H : '0 0 ' + W + ' ' + H;

  /* zones */
  const zoneBand = (z, off, scale) => '<rect x="' + (off + z.x0 * scale) + '" y="0" width="' + ((z.x1 - z.x0) * scale) + '" height="' + H + '" fill="var(' + z.wash + ')"/>' +
    '<text class="zone-label" x="' + (off + z.x0 * scale + 6) + '" y="14" fill="var(--ink-3)">' + z.name + '</text>';
  const membrane = (off, scale) => {
    const mx = off + MODEL.encoding.membrane.x * scale;
    return '<line x1="' + mx + '" y1="0" x2="' + mx + '" y2="' + H + '" stroke="hsl(25 var(--sat) var(--lum))" stroke-width="2" stroke-dasharray="3 5" opacity=".8"/>' +
      '<text class="zone-label" x="' + (mx + 5) + '" y="' + (H - 6) + '" fill="hsl(25 var(--sat) var(--lum))">membrane</text>';
  };
  if (two) {
    for (const z of MODEL.encoding.zones) { parts.push(zoneBand(z, 15, 440)); parts.push(zoneBand(z, 545, 440)); }
    parts.push(membrane(15, 440), membrane(545, 440));
    parts.push('<line x1="505" y1="0" x2="505" y2="' + H + '" stroke="var(--ink-3)" stroke-width="3" stroke-dasharray="10 6" opacity=".9"/>');
    parts.push('<text class="zone-label" x="510" y="' + (H / 2) + '" fill="var(--ink-2)" transform="rotate(90,510,' + (H / 2) + ')">context boundary</text>');
    parts.push('<text class="zone-label" x="15" y="' + (H - 24) + '" fill="var(--ink-2)">client context · manager.client</text>');
    parts.push('<text class="zone-label" x="545" y="' + (H - 24) + '" fill="var(--ink-2)">server context · manager.server</text>');
  } else {
    for (const z of MODEL.encoding.zones) parts.push(zoneBand(z, 0, W));
    parts.push(membrane(0, W));
  }

  /* which nodes take part */
  const involved = new Set(), ctxOf = {};
  flow.steps.forEach(s => {
    const list = [].concat(s.from, s.to);
    list.forEach(id => { involved.add(id); if (two) ctxOf[id + '|' + (s.ctx === 'cross' ? (id === s.from ? 'client' : 'server') : (s.ctx || 'client'))] = true; });
  });

  /* edges */
  const drawEdge = (s, idx) => {
    const cur = idx === stepIdx - 1;
    const done = idx < stepIdx - 1;
    const froms = [].concat(s.from), tos = [].concat(s.to);
    const out = [];
    tos.forEach((toId, k) => {
      const fctx = two ? (s.ctx === 'cross' ? 'client' : (s.ctx || 'client')) : null;
      const tctx = two ? (s.ctx === 'cross' ? 'server' : (s.ctx || 'client')) : null;
      const a = nodePos(froms[0], fctx, two), b = nodePos(toId, tctx, two);
      if (!a || !b) return;
      const self = froms[0] === toId;
      const d = edgePath(a, b, { arc: s.arc, self });
      const id = 'e' + idx + '_' + k;
      const color = s.violation ? 'var(--bad)' : cur ? nodeColor(toId) : 'var(--rule-2)';
      out.push('<path id="' + id + '" d="' + d + '" fill="none" stroke="' + color + '" stroke-width="' + (cur ? 2.4 : 1.2) + '"' +
        (s.async ? ' stroke-dasharray="7 5"' : '') + ' opacity="' + (cur ? 1 : done ? .5 : .22) + '" marker-end="url(#ah' + (cur ? '-on' : '') + ')"/>');
      if (cur) {
        const dur = reduced() ? 0.001 : (s.async ? 1.1 : 0.75);
        const filled = s.fills || s.carries === 'delta' || s.carries === 'state';
        const shape = filled
          ? '<rect x="-9" y="-7" width="18" height="14" rx="7" fill="' + nodeColor(toId) + '"/>'
          : '<rect x="-9" y="-7" width="18" height="14" rx="1.5" fill="none" stroke="' + nodeColor(froms[0]) + '" stroke-width="2"/>';
        out.push('<g>' + shape + '<animateMotion dur="' + dur + 's" fill="freeze" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#' + id + '"/></animateMotion></g>');
      }
    });
    return out.join('');
  };
  flow.steps.forEach((s, i) => parts.push(drawEdge(s, i)));

  /* mistake patches: an extra edge that punches the wall, a swollen node, … */
  diffs.forEach(d => {
    if (d.addEdge) {
      const a = nodePos(d.addEdge.from, 'client', two), b = { x: two ? 470 : W - 12, y: TOP + 0.92 * (H - TOP - BOT) };
      parts.push('<path d="' + edgePath(a, b, {}) + '" fill="none" stroke="var(--bad)" stroke-width="3" stroke-dasharray="2 4" marker-end="url(#ah-bad)"/>');
      parts.push('<text x="' + ((a.x + b.x) / 2) + '" y="' + (b.y - 12) + '" fill="var(--bad)" font-size="11" text-anchor="middle">membrane breached here</text>');
    }
  });

  /* nodes */
  const nodeSet = MODEL.components.concat([Object.assign({ id: 'world', name: 'world', oneLiner: '' }, PSEUDO.world)]);
  const drawNode = (c, ctx) => {
    const p = nodePos(c.id, ctx, two); if (!p) return '';
    const on = involved.has(c.id);
    const isCur = (() => { const s = flow.steps[stepIdx - 1]; if (!s) return false; return [].concat(s.from, s.to).indexOf(c.id) >= 0; })();
    const w = two ? 78 : 104, hh = two ? 26 : 32;
    const opacity = on ? (isCur ? 1 : .72) : .12;
    const swell = diffs.some(d => d.swell === c.id) ? 1.5 : 1;
    const corrupt = diffs.some(d => d.corrupt === c.id);
    const fillEarly = diffs.some(d => d.fillEarly === c.id);
    const isEss = c.pole === 'essence';
    const stroke = c.axis ? 'hsl(' + hue(c) + ' var(--sat) var(--lum))' : 'var(--ink-3)';
    const body = isEss
      ? '<rect x="' + (-w / 2 * swell) + '" y="' + (-hh / 2 * swell) + '" width="' + (w * swell) + '" height="' + (hh * swell) + '" rx="2" fill="' + (fillEarly ? stroke : 'none') + '" stroke="' + (corrupt ? 'var(--bad)' : stroke) + '" stroke-width="' + (isCur ? 2.4 : 1.4) + '"/>'
      : '<rect x="' + (-w / 2 * swell) + '" y="' + (-hh / 2 * swell) + '" width="' + (w * swell) + '" height="' + (hh * swell) + '" rx="' + (hh / 2) + '" fill="' + (corrupt ? 'color-mix(in oklab,var(--bad) 40%,transparent)' : 'hsl(' + hue(c) + ' var(--sat-soft) var(--lum-soft))') + '" stroke="' + (corrupt ? 'var(--bad)' : 'none') + '" stroke-width="1.5"/>';
    const notch = (c.id === 'token') ? '<path d="M' + (w / 2 - 7) + ',' + (-hh / 2) + ' l0,' + hh + '" stroke="var(--bg-2)" stroke-width="3"/>' : '';
    return '<g transform="translate(' + p.x + ',' + p.y + ')" opacity="' + opacity + '">' + body + notch +
      '<text class="node-label" x="0" y="4" text-anchor="middle" fill="' + (isEss ? stroke : 'hsl(' + hue(c) + ' var(--sat) var(--lum))') + '">' + esc(c.name.toLowerCase()) + '</text>' +
      (isCur ? '<circle cx="' + (-w / 2 - 8) + '" cy="0" r="3" fill="' + stroke + '"/>' : '') + '</g>';
  };
  if (two) { nodeSet.forEach(c => { parts.push(drawNode(c, 'client')); parts.push(drawNode(c, 'server')); }); }
  else nodeSet.forEach(c => parts.push(drawNode(c, null)));

  const defs = '<defs>' +
    '<marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--rule-2)"/></marker>' +
    '<marker id="ah-on" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--ink-2)"/></marker>' +
    '<marker id="ah-bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--bad)"/></marker>' +
    '</defs>';
  return '<svg viewBox="' + vb + '" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;max-height:62vh">' + defs + parts.join('') + '</svg>';
}

/* controls + caption + step list, shared by every flow-bearing movement */
function flowControls(state, opts) {
  const o = opts || {};
  const flow = IX.flow[o.flowId || state.flow];
  const len = flow.steps.length;
  const st = state.step;
  return '<div class="canvas-bar">' +
    btn('flow.play', {}, state.playing ? '❚❚ pause' : '▶ play', { pressed: state.playing }) +
    btn('flow.step', { dir: 'back' }, '‹ back') + btn('flow.step', { dir: 'fwd' }, 'step ›') +
    '<span class="fine stat">' + (st === 0 ? 'idle' : st + ' / ' + len) + '</span>' +
    '<input type="range" min="0" max="' + len + '" value="' + st + '" data-i="flow.scrub" data-keep="scrub-' + flow.id + '" style="flex:1;min-width:120px" aria-label="scrub the flow">' +
    (o.hideSelect ? '' : '<span class="fine">flow:</span>' + seg('flow.select', MODEL.flows.filter(f => f.context !== 'both').map(f => [f.id, f.title.split(' — ')[0]]), state.flow)) +
    '</div>';
}
function flowCaption(state, opts) {
  const o = opts || {};
  const flow = IX.flow[o.flowId || state.flow];
  const s = flow.steps[state.step - 1];
  if (!s) return '<div class="caption"><b>' + esc(flow.title) + '</b> — ' + esc(flow.blurb) + '</div>';
  const from = [].concat(s.from).map(x => (nodeOf(x) || { name: x }).name).join(' + ');
  const to = [].concat(s.to).map(x => (nodeOf(x) || { name: x }).name).join(' + ');
  return '<div class="caption"><b>' + esc(from) + ' → ' + esc(to) + '</b>' +
    (s.carries ? ' <span class="chip">carries ' + esc([].concat(s.carries).join(' + ')) + '</span>' : '') +
    (s.gate ? ' <span class="chip">gate ' + esc(s.gate) + '</span>' : '') +
    (s.crossesMembrane ? ' <span class="chip" data-tone="bad">crosses the membrane</span>' : '') +
    (s.fork ? ' <span class="chip" data-tone="warn">the fork</span>' : '') +
    (s.async ? ' <span class="chip">async</span>' : '') +
    '<div style="margin-top:5px">' + esc(s.note || '') + '</div></div>';
}
function stepList(state, opts) {
  const o = opts || {};
  const flow = IX.flow[o.flowId || state.flow];
  return '<ol class="steplist">' + flow.steps.map((s, i) =>
    '<li data-i="flow.scrub" ' + P({ v: i + 1 }) + ' aria-current="' + (state.step === i + 1) + '">' +
    '<span class="u-mono" style="color:var(--ink-3)">' + String(i + 1).padStart(2, '0') + '</span> ' +
    esc([].concat(s.from).map(x => (nodeOf(x) || { name: x }).name).join('+')) + ' → ' +
    esc([].concat(s.to).map(x => (nodeOf(x) || { name: x }).name).join('+')) +
    (s.fork ? ' <span class="chip" data-tone="warn">fork</span>' : '') +
    (s.crossesMembrane ? ' <span class="chip" data-tone="bad">IO</span>' : '') + '</li>').join('') + '</ol>';
}

/* ── RAIL · DRAWER · FOOTER ─────────────────────────────────────────────── */
AX.defineWrapper('wrapper.rail', 'axis-rail', ['movement', 'role', 'profile', 'look', 'layout', 'walk'], (s) => {
  const byAct = {};
  MODEL.movements.forEach(m => (byAct[m.act] = byAct[m.act] || []).push(m));
  const rel = s.role ? new Set(IX.role[s.role].path) : null;
  return '<div data-wrapper="rail">' +
    '<div class="brand"><svg width="22" height="22" viewBox="0 0 32 32"><rect x="3" y="7" width="11" height="18" rx="1" fill="none" stroke="hsl(25 var(--sat) var(--lum))" stroke-width="2.5"/><rect x="18" y="7" width="11" height="18" rx="5.5" fill="hsl(240 var(--sat) var(--lum))"/></svg>' +
    '<span>AXIS</span></div>' +
    '<div class="fine">An architecture, running. Every pixel below is rendered from one model by an AXIS composition.</div>' +
    '<div class="rail-only">' + btn('walk.toggle', {}, (s.walk ? '✕ ' : '▸ ') + 'Guided walk · MVC → AXIS',
      { cls: 'btn-sm', pressed: s.walk, title: 'How AXIS got here, in the right-hand panel (w)' }) + '</div>' +
    '<nav>' + IX.acts.map(([act, name]) => '<div class="act">' + act + ' · ' + name + '</div>' +
      (byAct[act] || []).map(m => '<a class="mv" href="#m=' + m.id + '" data-i="tutorial.goto" ' + P({ id: m.id }) +
        ' aria-current="' + (s.movement === m.id) + '"' + (rel ? ' data-relevant="' + rel.has(m.id) + '" data-dim="' + (!rel.has(m.id)) + '"' : '') + '>' +
        '<span class="num">' + m.id + '</span><span>' + esc(m.title) + (m.star ? ' ★' : '') + '</span></a>').join('')).join('') + '</nav>' +
    '<div class="rail-only stack" style="margin-top:auto;padding-top:10px;border-top:1px solid var(--rule)">' +
    '<div class="fine">look · layout facets</div>' +
    seg('look.set', [['dark', 'dark'], ['light', 'light'], ['blueprint', 'blue']], s.look) +
    seg('layout.set', [['columnar', 'roomy'], ['dense', 'dense']], s.layout) +
    '<div class="spread"><div class="fine">' + btn('keys.toggle', {}, s.showKeys ? 'hide keys' : 'show keys', { cls: 'btn-sm', pressed: s.showKeys }) + ' <span class="kbd">k</span></div>' +
    '<div class="fine">' + btn('code.open', { topic: s.selected || 'action' }, '⟨/⟩ code', { cls: 'btn-sm' }) + ' <span class="kbd">c</span></div></div>' +
    '</div></div>';
});

/* ══════════════════════════════════════════════════════════════════════════════
   THE GUIDED WALK — wrapper.walk  (the right-hand panel)
   ------------------------------------------------------------------------------
   MVC → WHAM → AXIS, one stage at a time. Every stage, note, date and commit
   is in model.evolution; this function draws whatever is there and knows none
   of it. Four things it is NOT told, and derives instead:

     · which cells are new at a stage  — diffed against the previous stage
     · which cells nothing has named yet — the fourteen minus this stage's set
     · which rows are about to split   — a row whose two halves ended up on
                                         different axes is the split, visible
                                         before anyone decided to make it
     · which MVC part a cell descends from — IX.mvcOf, read from lineage.mvc

   So the panel cannot drift from the grid in 5.1 or the lineage table in 5.10:
   the last two stages take their rows straight from model.axes.
   ══════════════════════════════════════════════════════════════════════════════ */
const EVO = () => MODEL.evolution;
const walkRows = (st) => st.deriveRows === 'axes'
  ? MODEL.axes.map(a => ({ name: a.name, e: a.essence, x: a.expression, note: (st.notes || {})[a.id], card: a.cardinality }))
  : (st.rows || []);
const walkCells = (st) => {
  const set = new Set();
  walkRows(st).forEach(r => {
    const m = r.theirs ? IX.mvcRow[r.theirs] : null;
    if (m) { if (m.essence) set.add(m.essence); if (m.expression) set.add(m.expression); }
    if (r.e) set.add(r.e);
    if (r.x) set.add(r.x);
  });
  return set;
};
/* the lens: '' = everything, 'none' = the cells MVC never had, otherwise an
   MVC row name. A cell is dimmed when it did not descend from the selection. */
const walkDim = (id, lens) => !!lens && (lens === 'none' ? IX.mvcOf[id] !== '' : IX.mvcOf[id] !== lens);

const wkCell = (id, label, pole, isNew, lens) => {
  const c = IX.comp[id];
  if (!c) return '<span class="wk-cell" data-none="true">' + esc(label || '—') + '</span>';
  return '<button class="wk-cell" ' + hstyle(c) + ' data-pole="' + pole + '" data-new="' + (!!isNew) +
    '" data-dim="' + walkDim(id, lens) + '" data-i="grid.select" ' + P({ id: id }) +
    ' title="' + esc(c.name + ' — ' + c.oneLiner) + '">' + esc(label || c.name.toUpperCase()) + '</button>';
};

AX.defineWrapper('wrapper.walk', 'axis-walk', ['walk', 'walkStep', 'walkLens', 'showKeys'], (s) => {
  const EV = EVO(), stages = EV.stages;
  const i = Math.max(0, Math.min(stages.length - 1, s.walkStep | 0));
  const st = stages[i], prev = i > 0 ? stages[i - 1] : null;

  if (!s.walk) {
    return '<div data-wrapper="walk" data-open="false">' +
      '<button class="wk-tab" data-i="walk.toggle" ' + P({}) + ' title="Open the guided walk — how AXIS got here (w)">' +
      '<span>‹ ' + esc(EV.title) + '</span><b>MVC → AXIS</b></button></div>';
  }

  const cells = walkCells(st), before = prev ? walkCells(prev) : new Set();
  const isNew = (id) => cells.has(id) && !before.has(id);
  const dropped = prev ? MODEL.components.filter(c => before.has(c.id) && !cells.has(c.id)) : [];
  const missing = MODEL.components.filter(c => !cells.has(c.id) && dropped.indexOf(c) < 0);
  const lens = s.walkLens || '';
  const rows = walkRows(st);

  /* a row is "about to split" when its two halves ended up on different axes */
  const splits = (r) => !!(r.e && r.x && IX.comp[r.e] && IX.comp[r.x] && IX.comp[r.e].axis !== IX.comp[r.x].axis);

  const rowHTML = (r) => {
    if (r.theirs) {                                   // an undivided MVC box
      const m = IX.mvcRow[r.theirs] || {};
      const covers = [m.essence, m.expression].filter(Boolean).map(id => IX.comp[id]).filter(Boolean);
      const dim = !!lens && lens !== r.theirs;
      return '<div class="wk-row">' +
        '<div class="wk-rname">one name</div>' +
        '<div class="wk-whole" data-dim="' + dim + '">' + esc(r.theirs.toUpperCase()) + '</div>' +
        '<div class="wk-covers"><span class="wk-note" style="grid-column:auto">two jobs →</span>' +
        covers.map(c => '<button class="wk-cell" ' + hstyle(c) + ' data-pole="' + c.pole + '" data-dim="' + dim +
          '" data-i="grid.select" ' + P({ id: c.id }) + ' title="' + esc(c.name + ' — ' + c.oneLiner) + '">' +
          esc(c.name.toUpperCase()) + '</button>').join('') + '</div>' +
        (r.note ? '<div class="wk-note">' + esc(r.note) + '</div>' : '') + '</div>';
    }
    const tell = splits(r);
    return '<div class="wk-row" data-tell="' + tell + '">' +
      '<div class="wk-rname">' + esc(r.name) + '</div>' +
      '<div class="wk-pair">' +
        wkCell(r.e, r.eAs, 'essence', isNew(r.e), lens) +
        wkCell(r.x, r.xAs, 'expression', isNew(r.x), lens) +
      '</div>' +
      (st.showCardinality && r.card ? '<div class="wk-card">' + esc(r.card) + '</div>' : '') +
      (r.note ? '<div class="wk-note">' + esc(r.note) + '</div>' : '') +
      (tell ? '<div class="wk-note" style="color:var(--warn)">Two colours in one row: these halves belong to different concerns. This is the next split, before anyone has decided to make it.</div>' : '') +
      '</div>';
  };

  const named = rows.reduce((n, r) => n + (r.theirs ? 1 : (r.e ? 1 : 0) + (r.x ? 1 : 0)), 0);
  const pct = Math.round(cells.size / MODEL.components.length * 100);
  const newOnes = prev ? MODEL.components.filter(c => isNew(c.id)) : [];  // nothing is 'new' at the starting point

  const lensOpts = [['', 'all']]
    .concat(Object.keys(IX.mvcRow).map(k => [k, k]))
    .concat([['none', 'neither']]);

  return '<div data-wrapper="walk" data-open="true">' +

    '<div class="wk-head">' +
      '<div class="spread"><div class="eyebrow">' + esc(EV.title) + ' · ' + (i + 1) + ' / ' + stages.length + '</div>' +
      btn('walk.toggle', {}, '✕', { cls: 'btn-sm', title: 'collapse the walk (w)' }) + '</div>' +
      '<div class="wk-title">' + esc(st.title) + '</div>' +
      '<div class="wk-claim">' + esc(st.claim) + '</div>' +
      '<div class="wk-when" style="margin-top:7px">' + esc(st.when) + ' · ' + esc(st.source) + '</div>' +
      '<div class="wk-meter"><span>' + named + ' name' + (named === 1 ? '' : 's') + '</span>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<span>' + cells.size + ' ' + esc(EV.cellsNote) + '</span></div>' +
    '</div>' +

    '<div class="wk-body">' +
      (i === 0 ? '<p class="wk-p">' + EV.lede + '</p>' : '') +

      '<div>' +
        '<div class="wk-h">Follow one MVC part</div>' +
        seg('walk.lens', lensOpts, lens) +
        (lens ? '<div class="wk-note" style="grid-column:auto;margin-top:6px">' + EV.lensNote + '</div>' : '') +
      '</div>' +

      st.body.map(pgraph => '<p class="wk-p">' + pgraph + '</p>').join('') +

      '<div>' +
        '<div class="wk-h">' + esc(st.name) +
          (st.poleNames ? ' · ' + esc(st.poleNames[0]) + ' | ' + esc(st.poleNames[1]) : '') + '</div>' +
        '<div class="wk-grid">' + rows.map(rowHTML).join('') + '</div>' +
        (newOnes.length ? '<div class="wk-note" style="grid-column:auto;margin-top:8px">' +
          esc(EV.newNote) + ' — ' + newOnes.map(c => esc(c.name)).join(' · ') + '</div>' : '') +
        (dropped.length ? '<div class="wk-note" style="grid-column:auto;margin-top:5px">' +
          esc(EV.droppedNote) + ' — ' + dropped.map(c => esc(c.name)).join(' · ') + '</div>' : '') +
        (missing.length ? '<div class="wk-note" style="grid-column:auto;margin-top:5px">not named yet — ' +
          missing.map(c => esc(c.name)).join(' · ') + '</div>' : '') +
      '</div>' +

      (st.won ? '<div><div class="wk-h">What the move bought</div><ul class="wk-list">' +
        st.won.map(w => '<li>' + w + '</li>').join('') + '</ul></div>' : '') +

      (st.left ? '<div><div class="wk-h">What it still got wrong</div><ul class="wk-list">' +
        st.left.map(w => '<li>' + w + '</li>').join('') + '</ul></div>' : '') +

      (st.question ? '<div class="wk-q">' + esc(st.question) + '</div>' : '') +

      (st.goto && IX.mv[st.goto] ? '<div>' + btn('tutorial.goto', { id: st.goto },
        'see it running · ' + esc(st.goto) + ' ' + esc(IX.mv[st.goto].title), { cls: 'btn-sm' }) + '</div>' : '') +

      (s.showKeys ? '<div class="stack" style="margin-top:4px">' +
        ['wrapper.walk', 'action.walk.step', 'action.walk.lens'].map(k =>
          keyline(null, k, R.has(k) ? 'live' : 'not registered')).join('') + '</div>' : '') +
    '</div>' +

    '<div class="wk-foot">' +
      btn('walk.step', { dir: 'back' }, '‹', { cls: 'btn-sm', disabled: i === 0, title: 'previous stage' }) +
      '<div class="wk-dots">' + stages.map((x, k) =>
        '<button class="wk-dot" data-i="walk.goto" ' + P({ i: k }) + ' data-past="' + (k < i) +
        '" aria-current="' + (k === i) + '" title="' + esc(x.name + ' — ' + x.title) + '"></button>').join('') + '</div>' +
      btn('walk.step', { dir: 'fwd' }, '›', { cls: 'btn-sm', disabled: i === stages.length - 1, title: 'next stage' }) +
    '</div>' +

    '</div>';
});

AX.defineWrapper('wrapper.drawer', 'axis-drawer', ['drawer', 'selected', 'linked'], (s) => {
  if (!s.drawer || !s.selected) return '';
  const c = IX.comp[s.selected], a = IX.axis[c.axis];
  const L = s.linked || {};
  return '<div data-wrapper="drawer" ' + hstyle(c) + '>' +
    '<div class="spread"><div class="eyebrow">' + esc(a.name) + ' · ' + c.pole + '</div>' + btn('grid.close', {}, '✕ close <span class="kbd">esc</span>', { cls: 'btn-sm' }) + '</div>' +

    '<div class="stack">' +
    panel('Contract', code(c.contract)) +
    panel('Code Examples', '<div class="spread"><span class="fine">TypeScript · Python · Rust · C</span>' + btn('code.open', { topic: c.id }, '⟨/⟩ Show Code Examples', { cls: 'btn-sm on' }) + '</div>') +
    panel('In conventional terms', '<div style="font-size:14px"><b>' + esc(c.familiarTerm) + '</b><div class="note" style="margin-top:4px">What AXIS adds: ' + esc(c.whatAxisAdds) + '</div></div>') +
    panel('Same name, two hosts', '<table><tr><th>browser</th><td>' + esc(c.browser) + '</td></tr><tr><th>server</th><td>' + esc(c.server) + '</td></tr></table>') +
    panel('Feel the absence', '<div style="font-size:14px">' + esc(c.feelTheAbsence) + '</div>') +
    panel('In this page', '<div style="font-size:14px">' + esc(c.pageRole) + '</div>' +
      '<div class="stack" style="margin-top:9px">' + (c.keys || []).map(k => keyline(c, k, R.has(k) ? 'live' : (k.indexOf('*') > 0 ? 'prefix' : 'not registered'))).join('') + '</div>') +
    (L.rules && L.rules.length ? panel('Rules it must keep', L.rules.map(r => '<div style="margin-bottom:7px;font-size:14px">' + esc(r.text) + '<div class="fine">' + esc(r.source) + '</div></div>').join('')) : '') +
    (L.pair && L.pair.length ? panel('Its axis · ' + esc(a.name), '<div class="fine" style="margin-bottom:8px">' + esc(a.question) + ' · pairing ' + esc(a.cardinality) + '</div><div class="grid-14" style="grid-template-columns:1fr 1fr">' + L.pair.map(p => cellHTML(p, s)).join('') + '</div><div class="note" style="margin-top:8px">' + esc(a.cardinalityNote) + '</div>') : '') +
    (L.mistakes && L.mistakes.length ? panel('What breaks it', L.mistakes.map(m => '<div style="font-size:14px;margin-bottom:6px"><b>' + esc(m.title) + '</b> — ' + esc(m.consequence) + '</div>').join('')) : '') +
    panel('Profile', '<div style="font-size:14px">' + (c.profile.lite === 'core' ? chip('in Lite', 'ok') : chip('escalate to')) + ' <span style="margin-left:6px">' + esc(c.profile.introduceWhen) + '</span></div>') +
    '</div></div>';
});


AX.defineWrapper('wrapper.codeModal', 'axis-code-modal', ['codeModal', 'codeLang', 'codeTopic', 'codeCopied'], (s) => {
  if (!s.codeModal) return '';
  const lang = s.codeLang || 'typescript';
  const topicId = s.codeTopic || 'action';
  const sample = (IX.codeSample && IX.codeSample[topicId]) || (IX.comp[topicId] ? {
    title: IX.comp[topicId].name + ' · ' + (IX.axis[IX.comp[topicId].axis] || {}).name + ' · ' + IX.comp[topicId].pole,
    component: topicId,
    summary: IX.comp[topicId].oneLiner,
    samples: {}
  } : {
    title: 'AXIS Code Reference',
    component: 'action',
    summary: 'Pure state transitions and boundary orchestration',
    samples: {}
  });

  const c = IX.comp[sample.component] || { axis: 'doing', pole: 'essence', name: sample.title };
  const currentLangData = (sample.samples && sample.samples[lang]) || { file: 'example', code: '// No snippet available', notes: '' };

  const langs = [
    ['typescript', 'TypeScript / JS'],
    ['python', 'Python'],
    ['rust', 'Rust'],
    ['c', 'C (C99)']
  ];

  const patternTopics = [
    { id: 'two_pass_read', name: 'Two-Pass Read', pole: 'pattern', axis: 'changing' },
    { id: 'full_pipeline', name: 'Full Pipeline', pole: 'pattern', axis: 'doing' }
  ];

  const topicStrip = '<div class="code-nav-strip">' +
    '<span class="fine" style="align-self:center;margin-right:2px">Components:</span>' +
    MODEL.components.map(comp => {
      const active = comp.id === topicId;
      return '<button data-i="code.setTopic" ' + P({ topic: comp.id }) + ' aria-pressed="' + active + '" ' +
        hstyle(comp) + ' data-pole="' + comp.pole + '">' + esc(comp.name) + '</button>';
    }).join('') +
    '<span class="fine" style="align-self:center;margin:0 2px 0 6px">Patterns:</span>' +
    patternTopics.map(pt => {
      const active = pt.id === topicId;
      return '<button data-i="code.setTopic" ' + P({ topic: pt.id }) + ' aria-pressed="' + active + '" ' +
        'style="--h:40">' + esc(pt.name) + '</button>';
    }).join('') +
    '</div>';

  return '<div class="code-modal-backdrop" data-wrapper="codeModal">' +
    '<div class="code-modal" ' + hstyle(c) + '>' +
      '<div class="code-modal-header">' +
        '<div class="row" style="gap:10px;align-items:center">' +
          '<span class="chip" data-pole="' + (c.pole || 'essence') + '" style="border-color:' + col(c) + ';color:' + col(c) + ';font-weight:600">' + esc(sample.title) + '</span>' +
          '<span class="fine">' + esc(sample.summary) + '</span>' +
        '</div>' +
        '<div class="row" style="gap:8px">' +
          btn('code.copy', { text: currentLangData.code }, s.codeCopied ? '✓ Copied!' : '⎘ Copy Code', { cls: 'btn-sm' + (s.codeCopied ? ' on' : '') }) +
          btn('code.close', {}, '✕ close <span class="kbd">esc</span>', { cls: 'btn-sm' }) +
        '</div>' +
      '</div>' +
      topicStrip +
      '<div class="code-modal-body">' +
        '<div class="spread">' +
          seg('code.setLang', langs, lang) +
          '<span class="fine u-mono">' + esc(currentLangData.file) + '</span>' +
        '</div>' +
        '<div>' +
          '<div class="code-file-bar">' +
            '<span>' + esc(currentLangData.file) + '</span>' +
            '<span class="fine">' + (lang === 'rust' ? 'Rust 2021+' : lang === 'python' ? 'Python 3.10+' : lang === 'c' ? 'C99' : 'TypeScript 5.x') + '</span>' +
          '</div>' +
          '<pre class="code-box"><code>' + esc(currentLangData.code) + '</code></pre>' +
        '</div>' +
        (currentLangData.notes ? '<div class="code-idiom-box"><b style="color:' + col(c) + '">Language Idiom & Invariants:</b> ' + esc(currentLangData.notes) + '</div>' : '') +
      '</div>' +
    '</div></div>';
});

AX.defineWrapper('wrapper.footer', 'axis-footer', ['gravatar', 'toast'], (s) => {
  return '<div data-wrapper="footer">' +
    (s.toast ? '<div class="panel flash" style="margin-bottom:14px;border-color:hsl(var(--h-doing) var(--sat) var(--lum))"><div class="spread"><div style="font-size:13.5px">' + esc(s.toast) + '</div>' + btn('toast.set', { text: '' }, '✕', { cls: 'btn-sm' }) + '</div></div>' : '') +
