<!doctype html>
<html lang="en" data-look="dark" data-layout="columnar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AXIS — the architecture, running</title>
<meta name="description" content="AXIS explained by an application built from AXIS. One model, rendered as a grid, a running pipeline, a cross-context system, and its own cross-examination.">
<meta property="og:title" content="AXIS — Agentically eXtensible Instruction Structures">
<meta property="og:description" content="A tutorial that is also a working AXIS application. It renders itself from one machine-readable model, and shows you the model.">
<meta property="og:type" content="article">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='3' y='7' width='11' height='18' rx='1' fill='none' stroke='%23ff7a45' stroke-width='2.5'/><rect x='18' y='7' width='11' height='18' rx='5.5' fill='%236f8cff'/></svg>">

<!-- ══════════════════════════════════════════════════════════════════════════
     CSS FACET FAMILIES  (AXIS-FrontEnd-Web.md §5)
       {component}.{layoutKind}.layout.css   — structure only
       {component}.{lookName}.look.css       — colour and texture only
     These are separate <style> facets, not one bundle. The theme switcher
     composes one layout facet with one look facet; that is Facet composition,
     not "changing colours".
     ══════════════════════════════════════════════════════════════════════════ -->

<style data-facet="app.base.css">
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font:16px/1.62 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
       font-synthesis-weight:none;text-rendering:optimizeLegibility}
  h1,h2,h3,h4{line-height:1.18;margin:0;font-weight:640;letter-spacing:-.015em}
  p{margin:0 0 .9em}
  code,pre,kbd{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace}
  code{font-size:.88em}
  pre{margin:0;overflow:auto;font-size:12.5px;line-height:1.62;tab-size:2}
  a{color:inherit}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  table{border-collapse:collapse;width:100%;font-size:14px}
  svg{display:block;overflow:visible}
  ::selection{background:hsl(var(--h-doing) 90% 55% / .3)}
  [hidden]{display:none !important}
  .u-mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.86em}
  .u-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  :focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:3px}
</style>

<style data-facet="app.columnar.layout.css">
  body{display:grid;grid-template-columns:var(--rail) minmax(0,1fr) auto;min-height:100vh}
  .rail{position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;
        padding:18px 14px 28px;display:flex;flex-direction:column;gap:16px}
  .stage{min-width:0;padding:0 clamp(16px,3.4vw,54px) 120px}
  .movement{padding:clamp(34px,5vw,68px) 0;max-width:1180px}
  .movement + .movement{border-top:1px solid var(--rule)}
  .m-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .m-body{display:grid;gap:22px;margin-top:22px}
  .cols{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
  .cols-2{display:grid;gap:22px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
  @media (max-width:900px){
    :root{--rail:0px}
    body{grid-template-columns:100%}
    .rail{position:fixed;inset:auto 0 0 0;height:auto;z-index:60;
          flex-direction:column;gap:6px;padding:8px 10px 10px;overflow:hidden}
    body .rail .brand,body .rail [data-wrapper] > .fine,body .rail .rail-only,body .rail .act{display:none}
    body .rail nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
    body .rail a.mv{white-space:nowrap;border-color:var(--rule)}
    body .rail a.mv .num{min-width:auto}
    .cols-2{grid-template-columns:100%}
    .grid-14{grid-template-columns:1fr 1fr}
    .axis-label{grid-column:1/-1;padding-top:10px}
    .stage{padding-bottom:110px}
  }
  .panel{border:1px solid var(--rule);border-radius:12px;padding:16px 18px;min-width:0}
  .panel > h4{font-size:12px;letter-spacing:.09em;text-transform:uppercase;margin-bottom:10px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .stack{display:grid;gap:10px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .grid-14{display:grid;gap:10px;grid-template-columns:130px 1fr 1fr;align-items:stretch}
  .scroll-x{overflow-x:auto;max-width:100%}
</style>

<style data-facet="app.dense.layout.css" data-look-family="layout" disabled>
  .movement{padding:22px 0}
  .m-body{gap:14px}
  .cols,.cols-2{gap:14px}
  .panel{padding:11px 13px;border-radius:9px}
  body{font-size:15px}
  pre{font-size:12px}
</style>

<style data-facet="app.dark.look.css" data-look-family="look">
  :root{
    --rail:236px;
    --bg:#0c0e13; --bg-2:#12151d; --bg-3:#171b25; --ink:#e9ecf4; --ink-2:#a6adbf; --ink-3:#727a8d;
    --rule:#242a37; --rule-2:#333b4d; --focus:#7aa2ff;
    --pure:#0f1a16; --orch:#141827; --eff:#1e1414; --edge:#101620;
    --sat:74%; --lum:64%; --sat-soft:60%; --lum-soft:22%; --wash:.13;
    --ok:#4ec9a0; --warn:#f2c14e; --bad:#ff6b5e;
    --shadow:0 10px 34px -18px #000;
  }
  body{background:var(--bg);color:var(--ink)}
  .rail{background:var(--bg-2);border-right:1px solid var(--rule)}
  .panel{background:var(--bg-2)}
  pre{background:var(--bg-3);border:1px solid var(--rule);border-radius:9px;padding:11px 13px}
  .code-bad{border-color:hsl(8 70% 40%);background:#1c1214}
  .code-good{border-color:hsl(160 45% 32%);background:#0e1a17}
</style>

<style data-facet="app.light.look.css" data-look-family="look" disabled>
  :root{
    --rail:236px;
    --bg:#fbfbfd; --bg-2:#ffffff; --bg-3:#f2f4f9; --ink:#151824; --ink-2:#4d5568; --ink-3:#7c8496;
    --rule:#e2e6ef; --rule-2:#cdd3e0; --focus:#2b5cd9;
    --pure:#eef7f2; --orch:#eef1fb; --eff:#fdf0ee; --edge:#eef4fa;
    --sat:66%; --lum:38%; --sat-soft:70%; --lum-soft:92%; --wash:.09;
    --ok:#12855f; --warn:#9a6b00; --bad:#c8352a;
    --shadow:0 10px 30px -20px #6b7590;
  }
  body{background:var(--bg);color:var(--ink)}
  .rail{background:var(--bg-2);border-right:1px solid var(--rule)}
  .panel{background:var(--bg-2)}
  pre{background:var(--bg-3);border:1px solid var(--rule);border-radius:9px;padding:11px 13px}
  .code-bad{border-color:#e8b4ae;background:#fff5f4}
  .code-good{border-color:#a9dcc6;background:#f1fbf6}
</style>

<style data-facet="app.blueprint.look.css" data-look-family="look" disabled>
  :root{
    --rail:236px;
    --bg:#071427; --bg-2:#0a1b31; --bg-3:#0d2039; --ink:#dcecff; --ink-2:#8fb3d9; --ink-3:#5d7fa6;
    --rule:#17395e; --rule-2:#245282; --focus:#7fd4ff;
    --pure:#0a2030; --orch:#0b1c34; --eff:#241626; --edge:#0a1a2c;
    --sat:80%; --lum:70%; --sat-soft:70%; --lum-soft:26%; --wash:.14;
    --ok:#5ce0b0; --warn:#ffd166; --bad:#ff8873;
    --shadow:0 10px 34px -18px #000;
  }
  body{background:var(--bg);color:var(--ink);
       background-image:linear-gradient(#12304e 1px,transparent 1px),linear-gradient(90deg,#12304e 1px,transparent 1px);
       background-size:28px 28px}
  .rail{background:#081a2fdd;border-right:1px solid var(--rule);backdrop-filter:blur(3px)}
  .panel{background:#0a1b31cc}
  pre{background:#08182b;border:1px solid var(--rule);border-radius:9px;padding:11px 13px}
  .code-bad{border-color:#7a2b2b;background:#1e1220}
  .code-good{border-color:#1f6f57;background:#08221d}
</style>

<style data-facet="app.components.css">
  /* — rail — */
  .brand{display:flex;gap:9px;align-items:center;font-weight:680;letter-spacing:-.02em}
  .brand svg{flex:none}
  .rail nav{display:grid;gap:2px}
  .rail .act{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
             margin:11px 0 3px;padding-left:8px}
  .rail a.mv{display:flex;gap:8px;padding:5px 8px;border-radius:7px;text-decoration:none;
             font-size:13px;color:var(--ink-2);border:1px solid transparent}
  .rail a.mv:hover{background:var(--bg-3);color:var(--ink)}
  .rail a.mv[aria-current="true"]{background:var(--bg-3);color:var(--ink);border-color:var(--rule-2)}
  .rail a.mv .num{color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:12px;min-width:26px}
  .rail a.mv[data-relevant="true"] .num{color:hsl(var(--h-doing) var(--sat) var(--lum))}
  .rail a.mv[data-dim="true"]{opacity:.42}

  /* — controls — */
  .btn{border:1px solid var(--rule-2);border-radius:8px;padding:5px 11px;font-size:13px;
       background:var(--bg-3);color:var(--ink);white-space:nowrap;transition:border-color .12s,background .12s}
  .btn:hover{border-color:var(--ink-3)}
  .btn[aria-pressed="true"],.btn.on{background:hsl(var(--h-doing) var(--sat-soft) var(--lum-soft));
       border-color:hsl(var(--h-doing) var(--sat) var(--lum));color:var(--ink)}
  .btn[disabled]{opacity:.42;cursor:not-allowed}
  .btn-sm{padding:3px 8px;font-size:12px;border-radius:6px}
  .seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:8px;overflow:hidden}
  .seg button{padding:5px 11px;font-size:12.5px;border-right:1px solid var(--rule-2);color:var(--ink-2)}
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--bg-3);color:var(--ink);font-weight:600}
  input[type=range]{accent-color:hsl(var(--h-doing) var(--sat) var(--lum));width:100%}
  select,input[type=text]{background:var(--bg-3);color:var(--ink);border:1px solid var(--rule-2);
       border-radius:7px;padding:5px 8px;font:inherit;font-size:13px;max-width:100%}
  label.ck{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);cursor:pointer}
  label.ck input{margin-top:3px;accent-color:hsl(var(--h-changing) var(--sat) var(--lum))}

  /* — type — */
  .eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
  .m-num{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--ink-3);
         font-variant-numeric:tabular-nums}
  .m-title{font-size:clamp(23px,3.1vw,33px)}
  .takeaway{font-size:15px;color:var(--ink-2);max-width:74ch;margin-top:4px}
  .takeaway b{color:var(--ink);font-weight:600}
  .lede{font-size:16.5px;color:var(--ink-2);max-width:74ch}
  .note{font-size:13px;color:var(--ink-3);max-width:80ch}
  .fine{font-size:12.5px;color:var(--ink-3)}
  .h-sm{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}

  /* — chips — */
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:999px;
        border:1px solid var(--rule-2);color:var(--ink-2);white-space:nowrap}
  .chip[data-tone="ok"]{border-color:var(--ok);color:var(--ok)}
  .chip[data-tone="bad"]{border-color:var(--bad);color:var(--bad)}
  .chip[data-tone="warn"]{border-color:var(--warn);color:var(--warn)}
  .chip[data-pole="essence"]{border-style:solid;background:none}
  .chip[data-pole="expression"]{border-style:none;background:var(--bg-3)}
  .kbd{border:1px solid var(--rule-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;
       font-size:11.5px;font-family:ui-monospace,Menlo,monospace;color:var(--ink-2)}

  /* — tables — */
  th,td{text-align:left;padding:7px 11px;border-bottom:1px solid var(--rule);vertical-align:top}
  th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
     position:sticky;top:0;background:var(--bg-2)}
  tr:last-child td{border-bottom:0}
  td.k{white-space:nowrap;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}

  /* — the three-part footer (baselines) — */
  .baseline{border:1px solid var(--rule);border-radius:12px;overflow:hidden}
  .baseline > div{padding:13px 16px;border-bottom:1px solid var(--rule)}
  .baseline > div:last-child{border-bottom:0}
  .baseline .bl-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
  .baseline .conv{background:color-mix(in oklab,var(--bad) 7%,transparent)}
  .baseline .ax{background:color-mix(in oklab,var(--ok) 7%,transparent)}
  .baseline .pay .bl-h{color:var(--ok)}
  .baseline .not{background:var(--bg-3)}
  .baseline .not .bl-h{color:var(--warn)}
  .baseline ul{margin:0;padding-left:18px}
  .baseline li{margin:3px 0;font-size:14px;color:var(--ink-2)}

  /* — canvas — */
  .canvas-wrap{border:1px solid var(--rule);border-radius:12px;background:var(--bg-2);overflow:hidden}
  .canvas-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 12px;
              border-bottom:1px solid var(--rule);background:var(--bg-3)}
  .node-label{font-size:9.5px;font-family:ui-monospace,Menlo,monospace;letter-spacing:.02em;pointer-events:none}
  .zone-label{font-size:9px;letter-spacing:.18em;text-transform:uppercase;pointer-events:none}
  .caption{padding:10px 14px;border-top:1px solid var(--rule);font-size:13.5px;color:var(--ink-2);min-height:44px}
  .caption b{color:var(--ink)}
  .steplist{max-height:330px;overflow-y:auto;font-size:13px}
  .steplist li{padding:5px 9px;border-radius:6px;cursor:pointer;list-style:none;color:var(--ink-2)}
  .steplist li[aria-current="true"]{background:var(--bg-3);color:var(--ink)}
  .steplist{margin:0;padding:0}

  /* — grid — */
  .axis-row{display:contents}
  .cell{border-radius:10px;padding:9px 11px;cursor:pointer;text-align:left;width:100%;min-height:74px;
        display:flex;flex-direction:column;gap:3px;transition:transform .12s,opacity .16s}
  .cell:hover{transform:translateY(-2px)}
  .cell[data-dim="true"]{opacity:.22}
  .cell .cname{font-weight:640;font-size:14.5px;letter-spacing:-.01em}
  .cell .cone{font-size:11.5px;color:var(--ink-2);line-height:1.42}
  .cell[data-pole="essence"]{border:1.5px solid hsl(var(--h) var(--sat) var(--lum));background:none;border-radius:3px}
  .cell[data-pole="expression"]{border:1.5px solid transparent;border-radius:999px 999px 999px 999px;
        background:hsl(var(--h) var(--sat-soft) var(--lum-soft));border-radius:22px}
  .cell[data-pole="expression"] .cname{color:hsl(var(--h) var(--sat) var(--lum))}
  .cell[data-pole="essence"] .cname{color:hsl(var(--h) var(--sat) var(--lum))}
  .axis-label{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 4px}
  .axis-label b{font-size:14px;color:hsl(var(--h) var(--sat) var(--lum))}
  .axis-label span{font-size:11.5px;color:var(--ink-3)}


  /* — code modal — */
  .code-modal-backdrop{position:fixed;inset:0;background:#0009;z-index:95;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,28px);backdrop-filter:blur(4px);overscroll-behavior:contain}
  .code-modal-backdrop[hidden]{display:none}
  .code-modal{background:var(--bg-2);border:1px solid var(--rule-2);border-radius:14px;box-shadow:var(--shadow);
              width:min(1040px,100%);max-height:min(90vh,860px);display:flex;flex-direction:column;overflow:hidden;animation:modalIn .15s ease-out}
  @keyframes modalIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
  .code-modal-header{padding:12px 18px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--bg-3)}
  .code-nav-strip{display:flex;gap:5px;overflow-x:auto;padding:8px 14px;border-bottom:1px solid var(--rule);background:var(--bg-2);scrollbar-width:thin;align-items:center}
  .code-nav-strip button{padding:3px 9px;border-radius:6px;font-size:12px;white-space:nowrap;border:1px solid var(--rule);color:var(--ink-2);transition:background .1s,border-color .1s}
  .code-nav-strip button:hover{background:var(--bg-3);color:var(--ink)}
  .code-nav-strip button[aria-pressed="true"]{background:hsl(var(--h) var(--sat-soft) var(--lum-soft));border-color:hsl(var(--h) var(--sat) var(--lum));color:var(--ink);font-weight:600}
  .code-nav-strip button[data-pole="essence"][aria-pressed="true"]{border-style:solid}
  .code-nav-strip button[data-pole="expression"][aria-pressed="true"]{border-radius:999px}
  .code-modal-body{padding:16px 18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
  .code-file-bar{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:var(--bg-3);border:1px solid var(--rule);border-radius:8px 8px 0 0;border-bottom:0;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink-2)}
  .code-box{margin:0;border-radius:0 0 8px 8px;max-height:450px;overflow:auto;background:var(--bg-3);border:1px solid var(--rule);padding:13px 15px;font-size:12.5px;line-height:1.65}
  .code-box code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .code-idiom-box{border:1px solid var(--rule);border-left:3px solid hsl(var(--h) var(--sat) var(--lum));background:var(--bg-3);border-radius:8px;padding:10px 14px;font-size:13px}

  /* — drawer — */
  .drawer{position:fixed;inset:0 0 0 auto;width:min(520px,100%);z-index:80;background:var(--bg-2);
          border-left:1px solid var(--rule-2);box-shadow:var(--shadow);overflow-y:auto;padding:20px 22px 60px}
  .drawer[hidden]{display:none}
  .scrim{position:fixed;inset:0;background:#0008;z-index:70}

  /* — misc — */
  .stat{font-variant-numeric:tabular-nums}
  .sev{font-size:10.5px;padding:1px 7px;border-radius:999px;letter-spacing:.06em;text-transform:uppercase}
  .sev[data-s="High"]{background:color-mix(in oklab,var(--bad) 22%,transparent);color:var(--bad)}
  .sev[data-s="Medium"]{background:color-mix(in oklab,var(--warn) 20%,transparent);color:var(--warn)}
  .sev[data-s="Low"]{background:var(--bg-3);color:var(--ink-3)}
  .verdict{font-size:11.5px;font-weight:640;letter-spacing:.03em}
  .verdict[data-v="Concede"]{color:var(--warn)}
  .verdict[data-v="Reject"]{color:var(--ok)}
  .verdict[data-v="Partly concede"]{color:var(--warn)}
  .verdict[data-v="Gap"]{color:var(--bad)}
  details{border:1px solid var(--rule);border-radius:10px;padding:10px 13px;background:var(--bg-2)}
  details[open]{background:var(--bg-2)}
  summary{cursor:pointer;font-size:14px;font-weight:600;list-style:none;display:flex;gap:9px;align-items:center}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸";color:var(--ink-3);font-size:11px;transition:transform .12s}
  details[open] summary::before{transform:rotate(90deg)}
  .trace{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;max-height:280px;overflow:auto;
         border:1px solid var(--rule);border-radius:9px;background:var(--bg-3)}
  .trace div{padding:2px 9px;border-bottom:1px solid var(--rule);white-space:pre;display:flex;gap:10px}
  .trace div:last-child{border-bottom:0}
  .trace .t-k{color:hsl(var(--h-meaning) var(--sat) var(--lum))}
  .trace .t-a{color:hsl(var(--h-doing) var(--sat) var(--lum))}
  .trace .t-e{color:hsl(var(--h-changing) var(--sat) var(--lum))}
  .trace .t-t{color:var(--ink-3)}
  .keyline{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink-2);
           display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;word-break:break-word}
  .keyline b{color:hsl(var(--h) var(--sat) var(--lum));font-weight:600}
  .bar{height:6px;border-radius:3px;background:var(--bg-3);overflow:hidden}
  .bar > i{display:block;height:100%;background:hsl(var(--h-doing) var(--sat) var(--lum))}
  footer.page{border-top:1px solid var(--rule);padding:26px 0 60px;color:var(--ink-3);font-size:13px}
  .gv{position:fixed;z-index:90;border:1px solid var(--rule-2);border-radius:12px;background:var(--bg-2);
      padding:16px;box-shadow:var(--shadow);max-width:300px}

<style data-facet="app.walk.css">
  /* — the guided walk (wrapper.walk) —
     Its own facet, not a section of app.components.css, because the panel is a
     component. Colour comes entirely from the look facets' custom properties,
     so all three looks get it for free and none of them mention it. The panel
     owns exactly one structural thing — its width — and it reads that from its
     own rendered markup via :has(), so nothing outside impact.RENDER writes to
     the DOM to open or close it. */
  .walk{position:sticky;top:0;height:100vh;z-index:55;display:flex;flex-direction:column;
        width:min(430px,32vw);background:var(--bg-2);border-left:1px solid var(--rule)}
  .walk:has([data-open="false"]){width:44px}
  .walk > div{display:flex;flex-direction:column;min-height:0;flex:1}

  .wk-tab{flex:1;display:flex;align-items:center;justify-content:center;gap:14px;width:100%;
          writing-mode:vertical-rl;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;
          color:var(--ink-2);padding:18px 0}
  .wk-tab:hover{color:var(--ink);background:var(--bg-3)}
  .wk-tab b{font-weight:660;color:hsl(var(--h-doing) var(--sat) var(--lum));letter-spacing:.14em}

  .wk-head{flex:none;padding:12px 15px 11px;border-bottom:1px solid var(--rule);background:var(--bg-3)}
  .wk-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
           padding:14px 15px 26px;display:grid;gap:13px;align-content:start}
  .wk-foot{flex:none;border-top:1px solid var(--rule);background:var(--bg-3);
           padding:8px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between}

  .wk-when{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--ink-3);
           letter-spacing:.02em;word-break:break-word}
  .wk-title{font-size:19px;letter-spacing:-.022em;margin:4px 0 3px}
  .wk-claim{font-size:13px;color:var(--ink-2);line-height:1.5}
  .wk-p{font-size:13.5px;line-height:1.6;color:var(--ink-2);margin:0}
  .wk-p b{color:var(--ink);font-weight:600}
  .wk-p code{font-size:.9em;color:var(--ink)}
  .wk-h{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}

  .wk-meter{display:flex;gap:9px;align-items:center;font-size:11px;color:var(--ink-3);
            font-variant-numeric:tabular-nums;margin-top:9px}

  .wk-grid{display:grid;gap:5px}
  .wk-row{display:grid;grid-template-columns:66px minmax(0,1fr);gap:8px;align-items:center;
          padding:5px 6px;border-radius:8px;border:1px solid transparent;row-gap:3px}
  .wk-row[data-tell="true"]{border-color:color-mix(in oklab,var(--warn) 55%,transparent);

            text-align:right;line-height:1.25}
  .wk-pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:0}
  .wk-cell{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;padding:4px 5px;text-align:center;
           color:hsl(var(--h) var(--sat) var(--lum));white-space:nowrap;overflow:hidden;
           text-overflow:ellipsis;min-width:0;transition:opacity .16s}
  .wk-cell[data-pole="essence"]{border:1.4px solid hsl(var(--h) var(--sat) var(--lum));border-radius:3px;background:none}
  .wk-cell[data-pole="expression"]{border:1.4px solid transparent;border-radius:999px;
                                   background:hsl(var(--h) var(--sat-soft) var(--lum-soft))}
  .wk-cell[data-none="true"]{border:1.4px dashed var(--rule-2);border-radius:3px;background:none;
                             color:var(--ink-3);cursor:default}
  .wk-cell[data-new="true"]{box-shadow:0 0 0 2px var(--bg-2),0 0 0 3.5px hsl(var(--h) var(--sat) var(--lum))}
  .wk-cell[data-dim="true"]{opacity:.16}
  .wk-whole{grid-column:2;border:1.4px dashed var(--rule-2);border-radius:3px;padding:4px 8px;

  .wk-whole[data-dim="true"]{opacity:.16}
  .wk-covers{grid-column:2;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .wk-note{grid-column:2;font-size:11.5px;color:var(--ink-3);line-height:1.48}
  .wk-card{grid-column:2;font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--ink-3);text-align:right}

  .wk-list{margin:0;padding-left:16px;font-size:12.5px;color:var(--ink-2);line-height:1.5}

        font-size:13.5px;line-height:1.5;color:var(--ink);font-style:italic}

  .wk-dots{display:flex;gap:3px;flex-wrap:wrap;min-width:0}
  .wk-dot{width:16px;height:5px;border-radius:3px;background:var(--rule-2);padding:0;border:0;flex:none}
  .wk-dot:hover{background:var(--ink-3)}
  .wk-dot[data-past="true"]{background:var(--ink-3)}
  .wk-dot[aria-current="true"]{background:hsl(var(--h-doing) var(--sat) var(--lum));width:22px}

  /* Under 1200px the panel leaves the grid and floats, so the third track
     collapses to zero and the stage keeps its full width. */
  @media (max-width:1200px){
    .walk,.walk:has([data-open="true"]),.walk:has([data-open="false"]){
      position:fixed;right:0;top:0;height:100dvh;box-shadow:var(--shadow)}
    .walk:has([data-open="true"]){width:min(430px,94vw)}
    .walk:has([data-open="false"]){width:36px;height:auto;top:14px;bottom:auto;
      border:1px solid var(--rule-2);border-right:0;border-radius:11px 0 0 11px}
  }
  @media (max-width:900px){
    /* full-bleed rather than a vw width: on a phone the visual and layout
       viewports do not always agree, and left:0;right:0 cannot overflow. */
    .walk:has([data-open="true"]){left:0;right:0;width:auto}
    .wk-body{padding-bottom:104px}   /* clear the rail, which is a bottom bar here */
  }
</style>

  "flows": [
    { "id":"canonical","title":"One event, end to end","context":"client",
      "blurb":"The centrepiece. A click becomes meaning, meaning selects a capability, a pure function forks it into a delta and effects, and exactly one of those crossings touches the world.",
      "steps":[
        {"from":"world","to":"wrapper","carries":"raw","note":"A click. A request. A message. Untyped, untrusted, unnormalized."},
        {"from":"wrapper","to":"adapter","carries":"raw","note":"The Wrapper hosts the surface. It does not decide anything."},
        {"from":"adapter","to":"intent","carries":"intent","transform":"normalize","note":"Grey becomes violet. That colour change IS the normalization — and it is the only place raw shape is allowed to matter."},
        {"from":"intent","to":"manager","carries":"intent","note":"A stable description of what was meant, with raw auth material attached but not yet resolved."},
        {"from":"manager","to":"token","carries":"identity","note":"The Manager mints the Token from raw auth. The Adapter was never allowed to."},
        {"from":"manager","to":"facet","carries":"intent","gate":"token.claims","note":"The Token's claims select the Facet. Authorization without a conditional."},
        {"from":"facet","to":"action","carries":"delegate","note":"The Facet resolves capability → Action. A lookup, not a branch."},
        {"from":"action","to":["instance","effect"],"carries":["delta","effects"],"fork":true,"hold":900,
         "note":"The fork. Left: what changed. Right: what should happen. Neither has happened yet — and that is the whole architecture in one frame."},
        {"from":"instance","to":"manager","carries":"delta","note":"Only the Manager commits. Form and Bond invariants are checked here; a bad delta is rejected, not applied."},
        {"from":"effect","to":"impact","carries":"effects","crossesMembrane":true,"async":true,"fills":true,
         "note":"Data becomes execution. The only crossing of the membrane in the entire system."},
        {"from":"impact","to":"wrapper","carries":"outcome","async":true,"arc":"outer","note":"The world changed. The Wrapper renders the new Instance."}
      ]},

    { "id":"composition","title":"Composition time — binding by key","context":"client",
      "blurb":"Before any Intent flows, the Composer wires the system by name. Every arrow here is a string key resolved in a registry — which is why adding a capability is an entry, not a refactor.",
      "steps":[
        {"from":"wrapper","to":"adapter","carries":"bind","note":"Wrapper.eventSlot → Adapter. The boundary declares where events may enter."},
        {"from":"intent","to":"facet","carries":"bind","note":"Intent kind → Facet, via Manager routing. A route table, not a switch statement."},
        {"from":"facet","to":"action","carries":"bind","note":"Facet delegate → Action. capability key → 'action.name'."},
        {"from":"bond","to":"manager","carries":"bind","note":"Bond → Manager. Relationship rules registered so the Committer can enforce them."},
        {"from":"effect","to":"impact","carries":"bind","note":"Effect kind → Impact handler. This is the binding whose absence AXIS currently discovers at runtime — see the audition."},
        {"from":"manager","to":"manager","carries":"audition","hold":700,
         "note":"Composer.audition(): every declared Effect kind has a handler, every referenced capability resolves, no Facet is orphaned. Fails at bind(), not at dispatch()."}
      ]},

    { "id":"twopass","title":"The two-pass read","context":"client",
      "blurb":"Actions are pure, so they cannot fetch. A read is 'ask to know, tell to show' — two trips through the same pipeline, which is why retry, batching and audit are properties of the pipeline instead of per-call-site code.",
      "steps":[
        {"from":"adapter","to":"manager","carries":"intent","note":"Pass 1. 'Show me the invoice.'"},
        {"from":"manager","to":"action","carries":"intent","note":"Routed as usual. No special read path."},
        {"from":"action","to":"effect","carries":"effects","note":"delta: {} — nothing is known yet. effects: [FETCH]. The Action declares the question."},
        {"from":"effect","to":"impact","carries":"effects","crossesMembrane":true,"async":true,"fills":true,"note":"Impact performs the read. Retry and backoff live here, once, for every read in the system."},
        {"from":"impact","to":"intent","carries":"follow-up-intent","async":true,"arc":"outer","note":"The result re-enters as meaning, not as a callback. Pass 2 begins."},
        {"from":"intent","to":"action","carries":"intent","note":"Pass 2. A different Action: 'apply what we now know.'"},
        {"from":"action","to":"instance","carries":"delta","note":"delta: the fetched data. effects: []. The read committed through the same door as every write."},
        {"from":"instance","to":"wrapper","carries":"state","note":"Render. Two passes, one pipeline, one audit trail."}
      ]},

    { "id":"failure","title":"Failure and compensation","context":"client",
      "blurb":"The same pipes, never a new colour of exception. A rejection is an Effect on the ordinary path — which is why you can assert a failure without causing one.",
      "steps":[
        {"from":"adapter","to":"manager","carries":"intent","note":"'Send the invoice.'"},
        {"from":"manager","to":"action","carries":"intent","note":"Routed to the draft Facet's send delegate."},
        {"from":"action","to":"effect","carries":"effects","note":"EMAIL_SEND, carrying retryPolicy and compensatingEffect. Both are fields on the Effect, not code at the call site."},
        {"from":"effect","to":"impact","carries":"effects","crossesMembrane":true,"async":true,"fills":true,"note":"Attempt 1 fails. Attempt 2 fails. Attempt 3 fails. Backoff was declared, not written."},
        {"from":"impact","to":"impact","carries":"compensate","hold":600,"note":"Retries exhausted → execute the compensatingEffect. REVERT_STATUS back to draft."},
        {"from":"impact","to":"intent","carries":"follow-up-intent","async":true,"arc":"outer","note":"The outcome re-enters as an Intent describing what happened. Not a thrown object — a routed fact."},
        {"from":"intent","to":"facet","carries":"intent","gate":"outcome","note":"Routed to an error-handling Facet. Failure is a capability surface like any other."},
        {"from":"facet","to":"action","carries":"delegate","note":"A pure Action decides what the failure means for state. Testable with two plain objects."}
      ]},

    { "id":"crosswire","title":"Across the wire — two contexts","context":"both",
      "blurb":"The second Manager is not a new mechanism. It is the same one, further away. Watch the same semantic operation get normalized by an Adapter twice, at two different edges — the clearest justification Adapters will ever get.",
      "steps":[
        {"from":"action","to":"effect","carries":"effects","ctx":"client","note":"The client Action returns an Effect. Nothing has happened yet."},
        {"from":"effect","to":"impact","carries":"effects","ctx":"client","crossesMembrane":true,"fills":true,"note":"Client Impact executes it — the only crossing on this side."},
        {"from":"impact","to":"wrapper","carries":"message","ctx":"cross","async":true,"crossesBoundary":true,"note":"Across the context boundary: postMessage, or fetch, or a queue. The diagram does not care, and neither does anything above Impact."},
        {"from":"wrapper","to":"adapter","carries":"raw","ctx":"server","note":"It lands on a server Wrapper. An HTTP listener, a Worker port. It hosts; it does not decide."},
        {"from":"adapter","to":"intent","carries":"intent","ctx":"server","transform":"normalize","note":"A server Adapter normalizes it into a DIFFERENT Intent, in the server's own vocabulary. This is the payoff frame."},
        {"from":"intent","to":"manager","carries":"intent","ctx":"server","note":"The server Manager mints a Token from the raw Authorization header. The Adapter did not."},
        {"from":"manager","to":"link","carries":"hydrate","ctx":"server","note":"A Link hydrates the invoice aggregate — customer and line items — before dispatch, so the Action never traverses."},
        {"from":"manager","to":"facet","carries":"intent","ctx":"server","gate":"token.claims","note":"Claims + lifecycle select the Facet. draft, sent and paid are different capability surfaces."},
        {"from":"facet","to":"action","carries":"delegate","ctx":"server","note":"The same Action shape as the client. Identical signature, identical purity rule."},
        {"from":"action","to":["instance","effect"],"carries":["delta","effects"],"fork":true,"hold":800,"ctx":"server","note":"The fork again, on the far side. The Committer validates the Bond — total must equal the sum of line items — before the delta lands."},
        {"from":"effect","to":"impact","carries":"effects","ctx":"server","crossesMembrane":true,"fills":true,"note":"Server Impact writes the row and sends the mail. Two crossings of the server's membrane."},
        {"from":"impact","to":"wrapper","carries":"outcome","ctx":"cross","async":true,"crossesBoundary":true,"arc":"outer","note":"The outcome travels back and re-enters the client as a follow-up Intent. Pass 2, across a boundary."}
      ]}
  ],

  "mistakes": [
    { "id":"io-in-action","title":"fetch() in an Action","violates":"actions-pure","corrupts":"action",
      "flowDiff":{"addEdge":{"from":"action","to":"world","crossesMembrane":true,"violation":true}},
      "consequence":"The Action can no longer be tested without mocking fetch, the network and the clock. The membrane is breached at a point where nothing marks the breach.",
      "testBefore":"call it with a state and an intent","testAfter":"mock fetch · mock the network · mock the clock · make the test async",
      "wrong":"export async function loadUser(state, intent) {\n  const data = await fetch(`/api/users/${intent.identityRef}`);\n  return { delta: await data.json(), effects: [] };\n}",
      "right":"export function loadUser(state, intent) {\n  return {\n    delta: {},\n    effects: [{ kind: 'FETCH_USER', target: `/api/users/${intent.identityRef}` }]\n  };\n}" },

    { "id":"magic-delta-keys","title":"A magic delta key","violates":"no-magic-deltas","corrupts":"instance",
      "flowDiff":{"corrupt":"instance"},
      "consequence":"The delta channel is now carrying control instructions. applyDelta spread-merges `_resetToCommitted` straight into Instance state, and the Form's invariants never saw it coming.",
      "testBefore":"assert on the committed state","testAfter":"assert on the committed state, then explain the underscore",
      "wrong":"export function cancelEdit(state, intent) {\n  return { delta: { _resetToCommitted: true }, effects: [] };\n}",
      "right":"export function cancelEdit(state, intent) {\n  return {\n    delta: {},\n    effects: [{ kind: 'RESTORE_COMMITTED', target: intent.identityRef }]\n  };\n}" },

    { "id":"adapter-mints-token","title":"The Adapter mints the Token","violates":"adapters-never-mint","corrupts":"adapter",
      "flowDiff":{"multiply":"adapter","moveGate":"adapter"},
      "consequence":"The security boundary just slid to the edge. Every Wrapper now needs its own claim logic, and there is no single place to answer 'who is allowed to do this?'",
      "testBefore":"one Manager test covers identity resolution","testAfter":"one test per edge, forever, and they will drift",
      "wrong":"export function bindHttpAdapter(wrapper, dispatch) {\n  wrapper.onRequest((req, res) => {\n    const token = issueRequestToken(req);   // identity resolution at the edge\n    dispatch(intent, { res, token });\n  });\n}",
      "right":"export function bindHttpAdapter(wrapper, dispatch) {\n  wrapper.onRequest((req, res) => {\n    const rawAuth = { authHeader: req.headers['authorization'] || '' };\n    dispatch(requestIntent(req, rawAuth), { res });\n  });\n}" },

    { "id":"manager-two-domains","title":"One Manager, two domains","violates":"managers-dont-call-managers","corrupts":"manager",
      "flowDiff":{"swell":"manager"},
      "consequence":"Two consistency boundaries in one commit path. A change to billing can now corrupt orders, and neither can be deployed, tested, or reasoned about alone.",
      "testBefore":"a Manager test covers one boundary's invariants","testAfter":"every Manager test is an integration test across two domains",
      "wrong":"class AppManager {\n  commitOrder(delta) { … }\n  commitInvoice(delta) { … }   // different consistency boundary\n  chargeCard(intent) { … }     // and a third\n}",
      "right":"// orders/manager.js  and  billing/manager.js\n// Orders emits: { kind: 'BILLING_CHARGE', payload: { … } }\n// Billing's Adapter normalizes it into Billing's own Intent." },

    { "id":"self-executing-effect","title":"An Effect that executes itself","violates":"effects-are-data","corrupts":"effect",
      "flowDiff":{"fillEarly":"effect"},
      "consequence":"The Effect fills before it reaches Impact — it fires from inside the pure zone. It cannot be retried, batched, logged, replayed, or asserted on, because by the time anything sees it, it has already happened.",
      "testBefore":"assert the Action declared EMAIL_SEND","testAfter":"receive an actual email during your unit test",
      "wrong":"const emailEffect = {\n  kind: 'EMAIL_SEND',\n  run: () => mailer.send(to, body)   // it knows how to happen\n};",
      "right":"const emailEffect = {\n  kind: 'EMAIL_SEND',\n  target: to,\n  payload: { body },\n  retryPolicy: { maxRetries: 3, backoff: 'exponential' }\n};" },

    { "id":"fat-controller","title":"The fat controller","violates":"adapters-produce-intents","corrupts":"wrapper",
      "flowDiff":{"collapse":["wrapper","adapter","manager","action"]},
      "consequence":"Parse, authorize, validate, compute, persist and render in one method. Five responsibilities, one seam — so every test is an integration test, because there is no smaller unit to call.",
      "testBefore":"five units, five tests, no HTTP","testAfter":"one test, one HTTP server, one database",
      "wrong":"app.post('/invoice/:id/send', async (req, res) => {\n  if (req.user.role !== 'owner') return res.status(403).end();\n  const inv = await db.get(req.params.id);\n  if (inv.status !== 'draft') return res.status(409).end();\n  await mailer.send(inv.email, render(inv));\n  await db.save({ ...inv, status: 'sent' });\n  res.json(inv);\n});",
      "right":"// wrapper: the route exists\n// adapter: req → Intent{ capability:'invoice.send', rawAuth }\n// manager: mint Token → select Facet by claims + lifecycle\n// action:  (state, intent) → { delta, effects }\n// impact:  EMAIL_SEND, DB_WRITE" }
  ]

      "lede":"Seven small animations, one sentence each. Each Essence rectangle emits its Expression capsule and the shape morphs on screen: sharp becomes round, hollow becomes filled. After this the legend is redundant, which is the point.",
      "close":"That single rule — hollow and sharp is a definition, filled and round is a live thing — does more teaching than any paragraph, and it survives greyscale." },

    { "id":"5.3","act":"II","title":"The Flow","view":"flow","star":true,
      "takeaway":"You can hold the whole pipeline in your head.",
      "lede":"One runtime, made completely legible before a second one is allowed on screen. Play it, step it, scrub it. The zones are the model's <code>zone</code> field; the heights are its <code>altitude</code> field; the membrane is the rule <i>only Impact does IO</i>, drawn as geometry.",
      "baseline":"io-in-business-logic",
      "close":"Watch for one frame in particular: the fork at the Action. One packet becomes two — a delta going left and effects going right — and neither has happened yet. No existing AXIS diagram draws it." },

    { "id":"5.4","act":"II","title":"Break It","view":"break","star":true,
      "takeaway":"The rules exist because of what happens without them.",
      "lede":"Each toggle is a patch on the flow you just learned — a <code>flowDiff</code> in the model, not a second diagram. The pipeline stays; one edge changes. Then look at what happened to the test.",
      "baseline":"errors",
      "close":"This is the most persuasive panel on the page for a skeptical reader, because it argues from consequence instead of from authority. If a rule's violation costs nothing here, the rule is not earning its place." },

    { "id":"5.5","act":"II","title":"Start Small","view":"profiles","star":true,
      "takeaway":"You start with five components, not fourteen.",
      "lede":"Ceremony shock is the most common way AXIS loses a reader, and it strikes about ninety seconds after the grid. So: one slider. At <b>Lite</b> only five components are lit, and every hard rule is still intact — the rules never relax, because they are what makes the shape worth anything.",
      "baseline":"wiring-by-import",
      "close":"Escalation is a decision with a stated cause. Each component carries the trigger that introduces it: not 'best practice', but 'you felt this absence'." },

    { "id":"5.6","act":"III","title":"Cross the Wire","view":"crosswire","star":true,
      "takeaway":"The second Manager is not a new mechanism. It is the same one, further away.",
      "lede":"Five of the fourteen components cannot be honestly demonstrated in a browser-only page. Bond and Link look like ceremony in a single-runtime toy. Token's scope and claims only bite at a real auth edge. And <i>one Manager per bounded context, Effects as the only bridge</i> is a distributed-systems claim that cannot be shown inside one runtime at all. So there are two runtimes here, and the second one is real.",
      "baseline":"cross-service-calls",
      "close":"The payoff frame is the server Adapter: the same semantic operation is normalized twice, at two different edges, into two different vocabularies. That is the clearest justification Adapters will ever get, and it is invisible in any single-runtime example." },

    { "id":"5.7","act":"III","title":"The Server's Own Grid","view":"servergrid","star":true,
      "takeaway":"Same fourteen names, different flesh. That is what meta-architecture means.",
      "lede":"Two grids, identical structure, identical colours, identical shapes — different bindings. Then the part that proves it is not a diagram trick: the transport toggle. Flip it and the same operation runs over a different transport. The diagram does not change. Not one node, not one edge.",
      "baseline":"cross-service-calls",
      "close":"Look at the Action row. It is the same code in both columns — not similar, the same source text, hashed and compared live on this page. Business logic that changed runtimes without changing a character is the strongest single argument here." },

    { "id":"5.8","act":"III","title":"When It Fails At Distance","view":"saga","star":true,
      "takeaway":"Failure across a boundary is the same pipeline, not a second control-flow system.",
      "lede":"Act II showed rule violations. This is the honest hard case: the network. Send an invoice, charge a payment, fulfil — then fail step two after step one has already committed, and watch retry, exhaustion, compensation, and a follow-up Intent routed to an error-handling Facet. Every packet uses pipes already on screen.",
      "baseline":"errors",
      "close":"The uncomfortable frames are included on purpose: the compensating Effect can itself fail, follow-up Intents can arrive twice, and client and server Instances can disagree. AXIS does not remove idempotency as a design obligation; it just gives it somewhere to live." },

    { "id":"5.9","act":"IV","title":"Composition by Key","view":"studio","star":true,
      "takeaway":"If composition is a key space, then adding a capability is an entry — and a model can write it.",
      "lede":"This is the movement the whole architecture is for. Every arrow in the composition-time flow is a <b>string key resolved in a registry</b>: <code>facet.invoice.draft</code> delegates <code>invoice.discount</code> to <code>action.invoice.discount</code>, which declares <code>EMAIL_SEND</code>, which resolves to <code>impact.EMAIL_SEND</code>. Nothing imports anything. Wire a real capability below and watch it appear in a running system.",
      "baseline":"wiring-by-import",
      "close":"Because the wiring is data, three things follow that are hard to get any other way: a model can generate it, a validator can check it before the first Intent flows, and an agent can be handed the exact contract for one keyed unit instead of a codebase." },

    { "id":"5.10","act":"IV","title":"You Already Do This","view":"lineage",
      "takeaway":"AXIS names seams you have been managing informally.",
      "lede":"Pick a pattern you already use. Its boxes shatter into AXIS cells, the split is labelled, and the cells that pattern never had light up as the gaps. The most useful one is last and lands hardest: the generic event→handler pattern gives you one seam; AXIS gives you five.",
      "close":"And the false friends table, which is not a footnote: a React developer will map AXIS <code>Action</code> onto Redux <code>action</code> — and Redux's action is AXIS's <i>Intent</i>. That single collision is enough to make the whole model read as incoherent. Renaming is not on the table this late, so disambiguating loudly is the entire mitigation." },

    { "id":"5.11","act":"IV","title":"Your Code","view":"rolemap",
      "takeaway":"The tutorial becomes a tool.",
      "lede":"Paste an AXIS role map — the schema is already defined in <code>AXIS-Code.md</code> and produced by the <code>CodeMaps</code> agent pipeline — and this page positions your components on the grid. Mixed-role components draw as split cells; low-confidence ones draw hatched.",
      "close":"This is the same model doing a fourth job. It renders a tutorial, drives a runtime, validates a composition, and now classifies a foreign codebase — from one document." },

    { "id":"5.12","act":"V","title":"The Cross-Examination","view":"critique","star":true,
      "takeaway":"Publishing the strongest attack is more persuasive than waiting to be handed it.",
      "lede":"Twelve critiques of AXIS and six objections to this page, in the skeptic's own words, each with a verdict — <b>concede</b>, <b>partly concede</b>, <b>reject</b>, or <b>genuine gap</b> — and, where one exists, a demonstration you can run. Of the twelve, two are genuine gaps, three are conceded costs with stated thresholds, and one is a framing error that should simply be corrected.",
      "close":"Every concession here is real. The ones marked <i>reject</i> are rejected with an argument, not a dismissal; the ones marked <i>gap</i> have no defence and are named as roadmap items with names, because a named gap is a commitment and an unnamed one is a hole." },

    { "id":"5.13","act":"V","title":"What AXIS Says Is Wrong","view":"forbids","star":true,
      "takeaway":"A theory that explains every existing pattern predicts nothing. Here is what this one excludes.",
      "lede":"A pattern earns a place on this list only if it is genuinely popular and actively recommended, it violates a <i>named</i> AXIS rule, and it has a stated failure threshold. That third test is what makes the list debatable in good faith: you can attack the threshold instead of the doctrine.",
      "close":"The last entry indicts AXIS itself. A list of other people's mistakes that omits your own is read as marketing; one that includes your own is read as engineering." },

    { "id":"5.14","act":"V","title":"When AXIS Is Too Much","view":"ensemble","star":true,
      "takeaway":"You don't need an orchestra to play a tune.",
      "lede":"AXIS's own vocabulary reaches for music — the Manager decomposes into a Composer and a Conductor, and Facets are described as sections. Carried through honestly, the metaphor answers the adoption question better than any component table, because ensemble size is the real variable.",
      "close":"The conductor does not exist because the music is difficult. The conductor exists because the ensemble grew large enough that no player can hear everyone else. Below that line, a Manager is a person waving a stick at four people who were doing fine." },

    { "id":"5.15","act":"V","title":"This Page's Own AXIS","view":"selfview","star":true,
      "takeaway":"The thing explaining the architecture was built from the architecture, and it is small enough to show you all of it.",
      "lede":"Everything below is read from the live runtime, not written down: the registry keyed by <code>component.name</code>, the composition audit, a lint over this page's own Actions, the Intent log, and a replay that re-runs your session from the log and compares the result. If any of it disagrees with the model, this panel says so rather than hiding it.",
      "close":"The evidence AXIS has to offer is structural, not empirical — nobody runs this in production, and this page will not pretend otherwise. So the structural evidence is made as checkable as possible. Check it." }
  ],

  "baselines": [
    { "id":"io-in-business-logic","appliesTo":["action","effect","impact"],
      "typical":{"label":"Call the database and the mailer from inside the service method",
        "code":"async function sendInvoice(id) {\n  const inv = await db.get(id);\n  await mailer.send(inv.customerEmail, render(inv));\n  await db.save({ ...inv, status: 'sent' });\n}"},
      "cost":["To test one business rule — 'a sent invoice cannot be sent twice' — you must stand up a database and a mail server, or mock three collaborators. The setup is larger than the logic under test.",
              "Retry and rollback are written per call site, so they drift.",
              "The failure mode 'email sent but status never saved' is invisible in the code shape."],
      "axis":{"label":"The Action declares; Impact executes",
        "code":"function sendInvoice(state, intent) {\n  if (state.status !== 'draft')\n    return { delta: {}, effects: [REJECTED('not-draft')] };\n  return {\n    delta: { status: 'sent' },\n    effects: [{ kind: 'EMAIL_SEND', target: intent.payload.recipientEmail,\n                retryPolicy: { maxRetries: 3, backoff: 'exponential' },\n                compensatingEffect: { kind: 'REVERT_STATUS', payload: { to: 'draft' } } }]\n  };\n}"},
      "payoff":["The rule is testable with two plain objects and zero mocks.",
                "Retry and compensation are declared as data, once, uniformly across every effect in the system.",
                "'Email sent but status not saved' is a named, handled path instead of an emergent bug."],
      "notWorthItWhen":"The handler has no branching. A thin passthrough CRUD endpoint has no rule to keep pure, and the indirection buys nothing." },

    { "id":"permission-checks","appliesTo":["facet","token","manager"],
      "typical":{"label":"if (user.role !== 'admin') throw Forbidden — at the top of each handler",
        "code":"function sendInvoice(req) {\n  if (req.user.role !== 'owner') throw new Forbidden();\n  if (inv.status !== 'draft')   throw new Conflict();\n  …\n}"},
      "cost":["The check is readable but the policy is not. Nobody can answer 'what can an editor do?' without a grep, and without trusting the grep was complete.",
              "Adding a fourth role means finding and correctly modifying every site, and the compiler will not help.",
              "Roles × lifecycle states is the number of combinations you now maintain by hand. Three of each is nine, and nobody has enumerated them."],
      "axis":{"label":"Token claims select a Facet",
        "code":"const facets = {\n  'invoice.draft': { delegates: { 'invoice.send': 'action.invoice.send',\n                                 'invoice.discount': 'action.invoice.discount' } },\n  'invoice.sent':  { delegates: { 'invoice.pay': 'action.invoice.pay' } },\n  'invoice.paid':  { delegates: {} }\n};\n// Manager: facets[`invoice.${instance.status}`] — selected, not branched"},
      "payoff":["'What can this role do at this stage?' becomes an enumerable map you can print, diff and test.",
                "Adding a role adds a Facet; it does not edit every handler.",
                "Authorization stops being control flow and becomes a lookup."],
      "notWorthItWhen":"One role, no lifecycle states. A single conditional is not a policy surface, and pretending otherwise is pure ceremony." },

    { "id":"cross-service-calls","appliesTo":["manager","effect","adapter"],
      "typical":{"label":"OrderService imports BillingService and calls .charge()",
        "code":"class OrderService {\n  constructor(billing) { this.billing = billing; }\n  async place(order) {\n    await this.repo.save(order);\n    await this.billing.charge(order.total);   // another consistency boundary\n  }\n}"},
      "cost":["A synchronous, invisible coupling across two consistency boundaries.",
              "A failure in billing corrupts order state, and neither can be deployed or tested alone.",
              "This is the standard path by which a modular monolith becomes a distributed ball of mud."],
      "axis":{"label":"Order emits an Effect; Billing's Adapter normalizes it into Billing's own Intent",
        "code":"// orders/actions/place.js  — pure\nreturn { delta: { status: 'placed' },\n         effects: [{ kind: 'BILLING_CHARGE', target: 'billing',\n                     payload: { amount: order.total, ref: order.id } }] };\n\n// billing/adapters/fromEffect.js\nexport const toIntent = (msg) => ({ kind: 'charge.requested',\n  capability: 'billing.charge', payload: msg.payload, meta: { correlationId: msg.id } });"},
      "payoff":["The coupling is now data you can log, replay and assert on.",
                "The boundary is explicit, so ownership is answerable.",
                "Extracting Billing to its own service is a transport change, not a rewrite — which is precisely what the transport toggle in 5.7 demonstrates."],
      "notWorthItWhen":"The two 'contexts' are genuinely one consistency boundary. Then you are paying async costs for an ownership benefit you do not have." },

    { "id":"reads","appliesTo":["action","effect","impact","intent"],
      "typical":{"label":"const d = await fetch(); setState(d) — in the handler",
        "code":"async function onOpen(id) {\n  setLoading(true);\n  const d = await fetch(`/invoice/${id}`).then(r => r.json());\n  setInvoice(d); setLoading(false);\n}"},
      "cost":["Retry, backoff, caching and audit are re-implemented per call site, or omitted per call site.",
              "The loading state machine is hand-written every time and gets one case wrong every time.",
              "Nothing records that the read happened, so it cannot be replayed."],
      "axis":{"label":"Two passes: declare the read, then apply the result",
        "code":"// pass 1 — pure\nreturn { delta: { loading: true }, effects: [{ kind: 'FETCH', target: `/invoice/${id}`,\n                                             retryPolicy: { maxRetries: 2 } }] };\n// pass 2 — pure, reached by a follow-up Intent\nreturn { delta: { loading: false, invoice: intent.payload }, effects: [] };"},
      "payoff":["Retry, batching and audit become properties of the pipeline instead of per-call-site code.",
                "Both halves are pure functions with no async in the test.",
                "The read is in the Intent log, so a session replays."],
      "notWorthItWhen":"A page that fetches once, never retries and never audits. Two passes are pure overhead, and composition-time hydration during bind() is the sanctioned shortcut." },

    { "id":"relationships","appliesTo":["bond","link","action"],
      "typical":{"label":"ORM relation decorators plus lazy loading; invariants wherever someone remembered",
        "code":"@OneToMany(() => LineItem, li => li.invoice)\nlineItems: LineItem[];\n\n// …and, four files away:\nif (invoice.total !== sum(invoice.lineItems)) throw new Error('mismatch');"},
      "cost":["The aggregate invariant lives wherever someone remembered to write it, so it is enforced on three paths out of five.",
              "order.customer.address.country inside a rule silently issues queries — the N+1 appears in production, in a function whose text contains no query.",
              "The business rule became asynchronous and non-deterministic, so it can no longer be evaluated against a plain snapshot."],
      "axis":{"label":"A Bond declares the rule; a Link hydrates before dispatch",
        "code":"const invoiceLineItems = {\n  ownerRef: 'form.invoice', targetRef: 'form.lineItem',\n  cardinality: 'one-to-many',\n  invariants: [ (inv, items) => inv.total === items.reduce((s,i) => s + i.amount, 0) ]\n};\n// Manager.resolveLink() hydrates, then dispatches. The Action never traverses."},
      "payoff":["Aggregate invariants are enforced once, at commit, on every path.",
                "N+1 becomes structurally impossible inside Actions, because Actions cannot traverse.",
                "The relationship is a printable rule instead of a decorator plus a convention."],
      "notWorthItWhen":"One entity, no cross-entity invariant. A Bond over a relationship nothing depends on is a form you fill in for nobody." },

    { "id":"errors","appliesTo":["effect","impact","facet"],
      "typical":{"label":"throw, try/catch, a retry decorator, and framework error middleware",
        "code":"try {\n  await charge(order);\n} catch (e) {\n  if (e instanceof NetworkError) return retry(charge, order);\n  throw new PaymentFailed(e);\n}"},
      "cost":["Three separate mechanisms, none of which appear in the happy-path diagram anyone drew.",
              "An exception is invisible in the signature: nothing about transferFunds(state, intent) tells you it can fail or how.",
              "You cannot assert a failure without triggering it, and the failure does not survive a process boundary — it has to be re-encoded as data anyway."],
      "axis":{"label":"Failures are Effects on the ordinary path",
        "code":"if (state.balance < intent.payload.amount)\n  return { delta: {}, effects: [{ kind: 'REJECTED', target: intent.meta.correlationId,\n                                  payload: { reason: 'insufficient-funds' } }] };"},
      "payoff":["Failures are as loggable, replayable and testable as successes.",
                "Retry and compensation are fields on the Effect, declared once.",
                "The rejection is in the Intent stream, so the permanent record has the failures as well as the successes."],
      "notWorthItWhen":"Programming errors. Null dereferences and violated internal invariants are defects, not outcomes — throw those, loudly. Swallowing a bug into the Effect stream hides it behind a data structure." },

    { "id":"wiring-by-import","appliesTo":["facet","manager","effect","impact"],
      "typical":{"label":"Import the thing you need, or ask a container for it at call time",
        "code":"import { sendInvoice } from '../actions/sendInvoice';\nimport { mailer }     from '../infra/mailer';\n\nrouter.post('/send', (req, res) => sendInvoice(req, mailer));\n// or: container.get('Mailer').send(…)"},
      "cost":["The dependency graph is the import graph, so 'what would adding a capability touch?' has no answer short of reading the files.",
              "A missing collaborator is discovered when the code path runs — in production, on the unlucky branch.",
              "Nothing can generate this. A model can describe a capability, but the wiring is hand-written prose in six files."],
      "axis":{"label":"Compose by key, validate the key space before the first Intent",
        "code":"facet('facet.invoice.draft', { delegates: {\n  'invoice.send':     'action.invoice.send',\n  'invoice.discount': 'action.invoice.discount'\n}});\naction('action.invoice.discount', (state, intent) => ({ … }));\nimpact('EMAIL_SEND', (effect) => mailer.send(effect.target, effect.payload));\n\nComposer.audition();  // → { missingHandlers: [], unresolvedCapabilities: [], orphanedFacets: [] }"},
      "payoff":["Adding a capability is one Facet entry plus one Action — a diff a model can produce and a human can read in ten seconds.",
                "The composition is checkable as data: every declared Effect kind must have a handler, every capability must resolve. A missing binding fails at bind(), not at dispatch().",
                "An agent can be handed one keyed generation unit — 'implement action.invoice.discount, signature (state,intent) → {delta,effects}, may declare only these Effect kinds' — instead of a codebase."],
      "notWorthItWhen":"A module with three functions and one caller. A registry over a key space nobody composes is an indirection tax with no payer." }
  ],

  "evolution": {
    "title": "How AXIS got here",
    "lede": "AXIS did not start with seven axes. It started with MVC and one question asked of every box — <b>which half of this am I writing?</b> — and then kept asking it until the boxes stopped dividing. Seven stages, each with the date and the commit it happened in, because a claim you can check beats a claim you have to believe.",
    "lensNote": "Descent is read from the same lineage table movement 5.10 renders, so this panel and that table cannot disagree. Eight of the fourteen cells descend from none of the three — that is what <b>neither</b> selects, and it is the whole argument in one control.",
    "droppedNote": "covered by the stage before this one, and without a cell here",
    "cellsNote": "of the fourteen cells AXIS now names",
    "newNote": "ringed = named for the first time at this stage",
    "tellNote": "A row whose two halves are different colours is a row whose halves belong to different concerns. That is the next split, announcing itself before anyone has decided to make it.",
    "stages": [

      { "id":"mvc", "name":"MVC", "when":"the starting point", "source":"Model · View · Controller",
        "title":"Three boxes",
        "claim":"Three names doing six jobs, and nothing that makes you say which one.",
        "body":[
          "MVC gives you three places to put code. Each of them is two things wearing one name.",
          "A <b>Model</b> is a schema <i>and</i> the live record. A <b>View</b> is what may be shown <i>and</i> what the user just meant. A <b>Controller</b> is the decision, the wiring that dispatched it, and the IO it performed on the way out.",
          "Nothing in the pattern asks which half you are writing, so both halves land in the same file. The fat controller is not a discipline failure. It is a missing seam."
        ],
        "mode":"whole",
        "rows":[
          { "theirs":"Model", "note":"The definition and the values it holds. One word, two lifetimes." },
          { "theirs":"View", "note":"What may be seen and what was meant travel together, so meaning is only ever a side effect of a widget." },
          { "theirs":"Controller", "note":"Route, decide, mutate, send mail, render. Five jobs, one seat, and the seat has no contract." }
        ],
        "left":[
          "The three boxes cover six of the fourteen cells AXIS now names. The other eight have no seat at all — no stable identity, no relationships, no declared effects, no boundary.",
          "Because there is no pole distinction, there is no question the pattern can ask you at review time."
        ],
        "question":"Which half of this box am I writing right now?",
        "goto":"5.10" },

      { "id":"wham-1", "name":"WHAM", "when":"2026-01-22", "source":"The WHAM Architecture.md · commit bcc42bc",
        "title":"Cut every box in half",
        "claim":"One distinction — static versus dynamic — applied to all of MVC.",
        "poleNames":["Static","Dynamic"],
        "body":[
          "The first move is the only move: separate <b>Static Instructions</b> — contracts, policies, protocols, code — from <b>Dynamic Instances</b>, the active compositions of those at runtime. Then apply it to every part of MVC and keep whatever falls out.",
          "Models became <b>WINDOW</b> (declared frames: screens, panels, routes, DOM roots) and <b>ADAPTER</b> (raw events plus runtime context, normalized into Intent). Views became <b>INTERFACE</b>, a capability map, and <b>INTENT</b>, a normalized description of what someone meant. Control became <b>ACTION</b>, a pure function, and <b>MANAGER</b>, the runtime that binds, routes, commits and runs effects.",
          "One row would not divide. State was filed as <b>IDENTITY — Dynamic State</b>, and its static half was listed, in the table itself, as “Instructions (this guide &amp; contracts)”. The document was standing in for the missing component."
        ],
        "mode":"poles",
        "rows":[
          { "name":"Models", "e":"wrapper", "eAs":"WINDOW", "x":"adapter", "xAs":"ADAPTER",

      { "id":"wham-2", "name":"WHAM, refined", "when":"2026-03-17", "source":"commits 15f806b · 3b1a8b3 — “Added Static Identity and Dynamic Instance distinctions”",
        "title":"The state row splits",

          "Two commits, one afternoon, and the row that would not divide divides. <b>IDENTITY</b> keeps the stable reference — entityId, schema, versioning policy, and explicitly no live values. A new <b>INSTANCE</b> takes everything else: identityRef, revisionId, state. “All mutable state lives here” becomes a sentence you can point at a file and check.",
          "WINDOW is renamed <b>WRAPPER</b>. That leaves four rows, eight components, and four contracts that outlive the architecture that produced them: Adapters always return Intents. Actions always return <code>{ delta, effects }</code>. Only the Manager commits state and runs effects. Interfaces are capability maps, not type annotations.",
          "This is the version of <code>The WHAM Architecture.md</code> that is still in the repository — and it is the last one that thinks of itself as MVC with a distinction added."
        ],
        "mode":"poles",
        "rows":[

            "note":"Renamed from WINDOW. Hosts interaction surfaces; contains no business logic." },

            "note":"The new row. Multiple Instances of one Identity may coexist: committed head, optimistic branch, stale cache, undo entry." },

      { "id":"axis-0", "name":"AXIS", "when":"2026-03-17, that evening", "source":"commit 37ae087 — “New AXIS Architecture”",
        "title":"Essence and Expression",
        "claim":"Five axes, ten components, and the poles get their real names.",
        "poleNames":["Immutable Essence","Projected Expression"],
        "body":[
          "Three moves in one document, written the same day as the split above. First the poles are renamed: static and dynamic become <b>Immutable Essence</b> and <b>Projected Expression</b>. Not cosmetic. “Static” already means four things in programming, and it says the wrong one — a Form is not inert, it <i>generates</i>; an Instance is not merely dynamic, it is a <i>projection</i> carrying a formRef, an identityRef and a revision. The new names describe the relationship between the halves, which static and dynamic never did.",
          "Second, Instance changes rows. <b>Being</b> — FORM / INSTANCE — answers “does it exist, and what shape is it?”. <b>Identity</b> — IDENTITY / TOKEN — answers “is it the same thing across time?”. FORM is the schema WHAM had nowhere to put. TOKEN fills the seat Instance vacated: a scoped, expiring projection of an Identity carrying claims. Sessions and scopes had been living inside the Manager.",
          "Third, INTERFACE becomes <b>FACET</b> — the old word was owned by every type system on earth — and “Models” becomes <b>Bridging</b>, which is what a screen, a route and a normalizer actually do."
        ],
        "mode":"poles",
        "rows":[

            "note":"The row WHAM could not build. Forms generate; they do not hold." },
          { "name":"Identity", "e":"identity", "x":"token",

            "note":"Unchanged from January." },

          "Ten cells, five questions, and both halves of every row now belong to the same concern.",

      { "id":"axis-impact", "name":"AXIS + Impacting", "when":"2026-03-18, the next morning", "source":"AXIS-Design.md · commit 767efa6",

      { "id":"axis-relating", "name":"AXIS · seven axes", "when":"2026-05-22", "source":"commit be4c750 — “Added the HAVING axis”",
        "title":"The axis added late",
        "claim":"Seven axes, fourteen components, and the honest asterisk.",
        "poleNames":["Immutable Essence","Projected Expression"],
        "body":[
          "<b>BOND</b> declares ownership, cardinality and cross-entity invariants. <b>LINK</b> traverses them at runtime and hydrates the aggregate <i>before</i> dispatch, so an Action never traverses and stays a pure function of the state it was handed. The same commit renames Impacting to <b>Changing</b>.",
          "This is also where the sharpest objection to AXIS comes from, and the page does not hide it. <i>Principles</i> calls the fourteen “the natural decomposition that follows from the principles”. Two of them were added in May. If the decomposition were natural, how were two of fourteen missed?",
          "The answer worth giving is the small one. Relating slotted in without restructuring the other twelve — new axis, its own Essence/Expression pair, no changes to any existing component. That is evidence the framework extends along its own logic. It is not evidence of closure, which is why 5.12 names the candidates for a fifteenth instead of claiming there is none."
        ],

          "meaning":"Renamed from Seeing six weeks earlier."
        },
        "won":[
          "Aggregate boundaries become declarations the Committer can check, rather than conventions a service remembers.",

        ],
        "left":[

        "question":"Is the grid a discovery, or a heuristic that happens to be productive?",

      { "id":"now", "name":"Now", "when":"2026-08-13 → today", "source":"Communicating AXIS.md · commit 669e09e — “Resolved AXIS inconsistencies”, and this page",
        "title":"Where it stands",
        "claim":"Fourteen components, and a grid that describes itself as a heuristic.",
        "poleNames":["Immutable Essence","Projected Expression"],
        "body":[
          "The last move adds no cell. It changes the claim. The grid stops being offered as an ontological discovery and starts being offered as a <b>design heuristic</b> — one that earns its keep through the question it forces at review time: <i>does this concern have a static half I have left implicit?</i>",
