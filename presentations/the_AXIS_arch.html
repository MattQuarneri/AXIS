  "objections": [
    { "id":"11.1","claim":"This is Redux with more nouns.",
      "answer":"Redux gives you reducer, store and middleware. AXIS separates effect declaration from effect execution — thunks conflate them, which is why testing a thunk means mocking middleware. AXIS also names three axes Redux has no opinion on: Identity/Token, Bond/Link, and Wrapper/Adapter.",
      "concession":"For a small client app with no auth boundary and no aggregates, Redux Toolkit plus RTK Query gets you most of the benefit with far less vocabulary.",
      "where":"5.10","demo":"lineage:flux" },
    { "id":"11.2","claim":"Fourteen components is too much for my team.",
      "answer":"Lite is five, and the escalation triggers are published, so adding a component is a decision with a stated cause rather than a habit.",
      "concession":"If you adopt the vocabulary and never escalate, you have paid a naming cost for nothing. There is an explicit 'when not to adopt AXIS' panel for exactly that case.",
      "where":"5.5","demo":"profile:lite" },
    { "id":"11.3","claim":"'Manager' is a god object with a new name.",
      "answer":"Composer/Conductor split, a five-part boundary contract (owned state, accepted intents, emitted effects, returned outcomes, policy scope), and published split heuristics. AXIS-Lite anticipated this objection before anyone raised it, which is worth saying out loud rather than pretending we thought of it first.",
      "concession":"The rule that saves you is 'if logic can be tested without orchestration, it does not belong in the Manager' — and that is a discipline, not a mechanism. AXIS makes the smell easy to name; it does not prevent it.",
      "where":"5.4","demo":"mistake:manager-two-domains" },
    { "id":"11.4","claim":"Effects-as-data means I lose my stack traces.",
      "answer":"You gain an Intent log, replay, and the ability to assert on failure paths without triggering them. Intent.meta carries correlation IDs by design.",
      "concession":"Real, and worth stating: an async effect pipeline genuinely makes stack traces less informative, and correlation-ID discipline becomes mandatory rather than optional. You are trading one debugging affordance for a different one.",
      "where":"5.15","demo":"replay" },
    { "id":"11.5","claim":"Who runs this in production?",
      "answer":"Nobody. There is no production pedigree to point at, and this audience detects an inflated claim instantly. The evidence on offer is structural, not empirical — so the structural evidence is made checkable: the transport toggle, the shared module hash, the composition audit, the lint over this page's own Actions, and the fact that the page itself is built this way. Check it rather than believe it.",
      "concession":"This is the weakest point on the page and it is stated first on purpose. A page that answers the other five well and dodges this one gets read as marketing.",
      "where":"5.15","demo":"selfview" },
    { "id":"11.6","claim":"Two-pass reads make simple things hard.",
      "answer":"Composition-time hydration is an explicitly sanctioned pattern for exactly this: the Manager may hydrate during bind().",
      "concession":"Yes. For a page that fetches once and never retries, two passes are pure overhead. The payoff arrives only when reads need retry, batching or audit — and if they never will, don't.",
      "where":"5.3","demo":"flow:twopass" }
  ],

  "critiques": [
    { "id":"12.1","title":"Your grid is symmetric because you made it symmetric.","severity":"High","verdict":"Concede","star":true,
      "critique":"AXIS asserts every axis has exactly one Essence and exactly one Expression. Four pairs earn it. Three do not. A Facet is a dispatch table and an Intent is a normalized command — these are not one concern in two states, and the docs' own folder structure gives it away with /intents holding Intent schemas, so Intent has a static form and it is not Facet. An Action is a pure function; a Manager is the runtime itself with four named responsibilities — a Manager is not 'an Action at runtime'. An Adapter is a collaborator of a Wrapper, not its runtime projection. Second tell: the Specification concedes Token is 'a family name' covering session, revision, workflow and scope tokens. That is four concepts sharing one cell because the grid demanded one.",
      "response":"Concede the framing: the grid is a design heuristic, not an ontological discovery, and it should say so. Its value is the question it forces — 'does this concern have a static half I have left implicit?' — which is productive even where the pairing is loose. But there is a better move than conceding: name the asymmetry and encode it. The pairs differ in cardinality, and that difference is real information AXIS currently hides.",
      "changes":"The model gains `cardinality` per axis; the page renders it; the docs state the grid as a heuristic.",
      "demo":"cardinality" },

    { "id":"12.2","title":"The Manager is a god object, and it breaks your own principle #8.","severity":"High","verdict":"Concede","star":true,
      "critique":"Principle #8 says components should own one responsibility. The Manager owns Binder, Router, Workflow and Committer — plus token minting, link resolution, invariant validation and effect dispatch. That is seven. AXIS violates its own principle at exactly one point, and it is the critical one. AXIS-Lite spends two pages worrying about this, which is an admission.",
      "response":"Concede the letter and defend the substance: orchestration is irreducible. Something must know how the parts connect. The choice is not 'one responsibility or seven' — it is 'seven responsibilities in one named, bounded, inspectable place, or seven responsibilities smeared across the codebase where nobody can find them'. The claim AXIS should actually make is: the Manager is the only component permitted more than one responsibility, and therefore the only one you must read carefully. Compare a kernel. Three things make that credible rather than convenient, and all three already exist: the Composer/Conductor split, the recommended file decomposition, and Lite's test — if logic can be tested without orchestration, it does not belong here.",
      "changes":"Principle #8 gains the Manager exception explicitly. A stated exception is a design decision; an unstated one is a hole.",
      "demo":"manager" },

    { "id":"12.3","title":"You have reinvented the effect monad without the enforcement.","severity":"High","verdict":"Concede","star":true,
      "critique":"Haskell's IO monad makes impurity a type error. Elm makes it structurally impossible. AXIS makes it a code-review note. Nothing stops an Action from calling fetch — so you have paid the ceremony of an effect system and received none of its guarantee.",
      "response":"Concede; it is accurate and it is the strongest version of the purity objection. Three answers in ascending order of honesty. (1) Every non-language-enforced architecture shares this — Clean, hexagonal, DDD. Weakest answer, and a critic will correctly call it a tu quoque. (2) Violations are visible: an Action that does IO must become async, and its tests must acquire mocks. Both are detectable in review and in CI diff stats. (3) The real answer: the model makes a linter buildable, and it should be built. axis.model.json plus the role map gives a lint rule everything it needs — which files claim to be Actions, and what an Action is forbidden to touch. The honest ceiling, stated plainly: AXIS offers checkable purity, not proven purity.",
      "changes":"Roadmap: `axis-lint`. Naming it converts a defence into a commitment — and the button below runs a first cut of it over this page's own Actions.",
      "demo":"lint" },

    { "id":"12.4","title":"A theory that explains every existing pattern predicts nothing.","severity":"High","verdict":"Reject","star":true,
      "critique":"The Popper objection, and intellectually the sharpest one here. AXIS claims to explain why MVC, Flux, CQRS, Event Sourcing, DDD and Clean Architecture all work. A framework compatible with everything forbids nothing. What would falsify AXIS? What does AXIS say is wrong that the field currently thinks is right?",
      "response":"Reject — but only by answering the question, which the docs currently do not. AXIS does forbid things, and stating them is how it shows it is not vacuous: Active Record, service locators resolved at call time, exceptions as business control flow, fat controllers, ORM lazy loading inside domain logic, and middleware that both declares and performs effects. It also makes claims that are measurable, which is the actual Popper answer: mocks required per business-rule test; diff size when adding a role to a role-heavy domain; whether a failure path can be asserted without triggering it. Those measurements can come out against us.",
      "changes":"A new page panel and a new doc section: What AXIS Says Is Wrong — including the entry that indicts AXIS's own stringly-typed dispatch.",
      "demo":"goto:5.13" },

    { "id":"12.5","title":"Your Action is Redux's action, except it isn't.","severity":"Medium","verdict":"Concede",
      "critique":"The vocabulary collides with established terms, and one collision is actively dangerous: a React developer will map AXIS Action onto Redux action — and Redux's action is AXIS's Intent. They will misread the entire model and conclude it is incoherent. Add Manager (the canonical discouraged suffix), Token (means auth token to everyone), Instance, and Facet.",
      "response":"Concede entirely. It is real and it is the cheapest fix on the list. Renaming is not on the table this late, so disambiguating loudly is the whole mitigation: a prominent false-friends table, not a footnote.",
      "changes":"False friends table in 5.10.",
      "demo":"goto:5.10" },

    { "id":"12.6","title":"Where's the cost? And where is 'don't use this here'?","severity":"Medium","verdict":"Concede",
      "critique":"Every Intent allocates. Every Action returns a fresh delta. Every commit spreads state. Every Effect is a structure dispatched through a string-keyed handler map. In a game loop, a high-throughput ingest path or an embedded target, that is real allocation pressure — and AXIS never once says 'don't use this here'.",
      "response":"Concede, and note this is a genuine gap in the doc set, not just the page: there is no 'When Not To Use AXIS' section anywhere in roughly 190KB of documentation. That absence is itself read as a credibility signal by this audience. The answer 'this is the ideal, your system may not need it' is exactly right here — but it has to be stated with a threshold, not a shrug.",
      "changes":"New doc section, drafted: When AXIS Is Too Much, built on the ensemble metaphor AXIS's own Composer/Conductor vocabulary already implies.",
      "demo":"goto:5.14" },

    { "id":"12.7","title":"You optimized for the architect, not the maintainer.","severity":"Medium","verdict":"Partly concede",
      "critique":"The person who gains most from the vocabulary is the one designing the system. The person who pays is the junior who now must learn what a Facet is to add a button.",
      "response":"Partly concede — the tax is real and lands unevenly. Two counters. First, the newcomer's real question is 'where does my code go?', and conventional codebases answer it with tribal knowledge, which is a per-person permanent tax; AXIS answers it with a lookup table, which is front-loaded and paid once. Second, the 2026 argument that was not available to Clean Architecture: agents do not pay onboarding tax the way humans do, and a machine-readable model makes conventions checkable rather than remembered. A codebase whose structure is explicit is one an agent can navigate without having absorbed the team's history.",
      "changes":"Page framing, and the generation units in 5.9.",
      "demo":"goto:5.9" },

    { "id":"12.8","title":"How do I nest one of these inside another?","severity":"Medium","verdict":"Gap","star":true,
      "critique":"For a meta-architecture about composing software, there is no composition story. Can an AXIS component contain an AXIS system? How does a reusable AXIS widget embed in a host AXIS app? How do you ship an AXIS component library? The docs are silent, and this is the first question anyone building a component suite will hit.",
      "response":"No defence — it is a gap. But the answer is latent in the model and worth stating as a direction: a nested subsystem is a Wrapper from the outside and a full AXIS composition inside. The Manager boundary contract already specifies exactly what an embedding interface needs — owned state, accepted intents, emitted effects, returned outcomes, policy scope. Those five fields are a component manifest. This page does one instance of it: the invoice subsystem is a Wrapper in the client composition and a complete AXIS system inside, with its own Manager, and its Effects surface to the parent as follow-up Intents.",
      "changes":"Roadmap: an AXIS composition profile covering nesting, packaging, and how a child Manager's Effects surface to a parent.",
      "demo":"nesting" },

    { "id":"12.9","title":"You moved IO into a stringly-typed dispatch table.","severity":"Medium","verdict":"Concede","star":true,
      "critique":"Effect.kind is a string. Impact holds a handler map and throws 'No impact handler for: ${effect.kind}' — at runtime, in an architecture whose selling point is explicitness. Same for Facet capability keys versus Intent capabilities: nothing checks they line up until dispatch misses.",
      "response":"Concede, and note the fix is cheap and lands in a component AXIS already has. The Composer runs at setup time and already knows every registered Facet, so it can assert that every Effect kind declarable by any reachable Action has a registered handler, and that every capability referenced by a Facet resolves. Composition-time validation is exactly the Composer's job description; it just was not specified. Name it the audition: no composer lets a player join the orchestra without hearing them first. Find out who is off key before the audience arrives, not during the performance. The Conductor should never discover mid-piece that the horn section does not exist.",
      "changes":"Specify Composer.audition() → { missingHandlers[], unresolvedCapabilities[], orphanedFacets[] }, failing at bind() rather than dispatch(). This page implements it; the button below unbinds a handler and re-runs it.",
      "demo":"audition" },

    { "id":"12.10","title":"Two-pass reads, then an escape hatch that skips the audit.","severity":"Low","verdict":"Reject",
      "critique":"The docs sanction composition-time hydration as a shortcut. So there is a second, un-audited data path — which undermines the auditability that justified two passes.",
      "response":"Reject, but concede it is stated badly. The distinction is lifecycle phase, not convenience: composition-time hydration happens before the pipeline is live, when there is no Intent stream to audit. The rule is 'once the pipeline is live, every read goes through it'. That is coherent, but as written it reads like a loophole and should be restated as a phase boundary with an explicit end: hydration is permitted until bind() returns.",
      "changes":"Sharpen the docs: hydration ends when bind() returns.",
      "demo":"flow:composition" },

    { "id":"12.11","title":"You missed two of fourteen. What's the fifteenth?","severity":"Low","verdict":"Partly concede",
      "critique":"Principles calls the components 'the natural decomposition that follows from the principles'. Bond and Link were added later. If the decomposition were natural, how were two of fourteen missed?",

          "code": "export class Manager {\n  private instance: Instance<any>;\n  private facets = new Map<string, any>();\n  private impacts = new Map<string, (eff: any) => Promise<any>>();\n\n  constructor(initialInstance: Instance<any>) {\n    this.instance = initialInstance;\n  }\n\n  async dispatch(intent: Intent): Promise<void> {\n    const facet = this.selectFacet(intent);\n    const actionKey = facet.delegates[intent.capability];\n    if (!actionKey) throw new Error(`Capability ${intent.capability} not in active facet`);\n\n    const action = Registry.get(actionKey);\n    const { delta, effects } = action(this.instance.state, intent);\n\n    // Committer: validate invariants before updating state\n    if (Object.keys(delta).length > 0) {\n      const candidate = { ...this.instance.state, ...delta };\n      this.validateInvariants(candidate);\n      this.instance = applyDelta(this.instance, delta);\n    }\n\n    // Hand effects to Impact executor\n    for (const eff of effects) {\n      const handler = this.impacts.get(eff.kind);\n      if (handler) await handler(eff);\n    }\n  }\n}",

<script id="axis-kernel">
'use strict';
/* ══════════════════════════════════════════════════════════════════════════════
   THE AXIS KERNEL
   ------------------------------------------------------------------------------
   ~300 lines. This is the whole runtime: a registry keyed "component.name",
   a Manager (Composer · Conductor · Committer · Policy), and an Impact executor.
   Nothing below imports anything from anything. Every connection in this file is
   a STRING KEY resolved in the registry — which is the point of movement 5.9,
   and the reason a model can drive the composition.
   ══════════════════════════════════════════════════════════════════════════════ */

const AX = {};

/* — small helpers ─────────────────────────────────────────────────────────── */
AX.hash = (s) => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
AX.freeze = function deepFreeze(o) {
  if (o && typeof o === 'object' && !Object.isFrozen(o)) {
    Object.freeze(o);
    for (const k of Object.keys(o)) deepFreeze(o[k]);
  }
  return o;
};
AX.clone = (o) => (typeof structuredClone === 'function' ? structuredClone(o) : JSON.parse(JSON.stringify(o)));
AX.uid = (p) => p + '-' + Math.random().toString(36).slice(2, 8);

/* ── REGISTRY ───────────────────────────────────────────────────────────────
   One flat key space. "form.tutorial", "action.invoice.send", "impact.RENDER".
   The first segment is the AXIS component; the rest is the name. That is the
   entire addressing scheme, and it is why composition is data.
   ──────────────────────────────────────────────────────────────────────────── */
AX.Registry = (() => {
  const map = new Map();
  const listeners = new Set();
  const api = {
    define(key, value, meta) {
      if (!/^[a-z]+\.[A-Za-z0-9_.\-*]+$/.test(key)) throw new Error('registry key must be "component.name": ' + key);
      map.set(key, { key, component: key.slice(0, key.indexOf('.')), name: key.slice(key.indexOf('.') + 1), value, meta: meta || {} });
      listeners.forEach(f => f('define', key));
      return key;
    },
    get: (key) => (map.has(key) ? map.get(key).value : undefined),
    entry: (key) => map.get(key),
    has: (key) => map.has(key),
    remove(key) { const had = map.delete(key); listeners.forEach(f => f('remove', key)); return had; },
    byComponent: (c) => [...map.values()].filter(e => e.component === c),
    keys: () => [...map.keys()].sort(),
    all: () => [...map.values()],
    onChange: (f) => listeners.add(f),
    size: () => map.size
  };
  return api;
})();
const R = AX.Registry;

/* Typed definers. Each one is a thin wrapper that records the metadata the
   Composer needs at audition time — nothing more. */
AX.form     = (key, def)          => R.define(key, def, { kind: 'form' });
AX.identity = (key, def)          => R.define(key, def, { kind: 'identity' });
AX.bond     = (key, def)          => R.define(key, def, { kind: 'bond' });
AX.link     = (key, def)          => R.define(key, def, { kind: 'link' });
AX.facet    = (key, def)          => R.define(key, def, { kind: 'facet' });
AX.adapter  = (key, fn)           => R.define(key, fn, { kind: 'adapter' });
AX.wrapper  = (key, def)          => R.define(key, def, { kind: 'wrapper' });
AX.impact   = (kind, fn, meta)    => R.define('impact.' + kind, fn, Object.assign({ kind: 'impact', effectKind: kind }, meta));
AX.action   = (key, fn, meta)     => R.define(key, fn, Object.assign({ kind: 'action', declares: [], needs: [] }, meta));

/* ── MANAGER ────────────────────────────────────────────────────────────────
   Boundary-scoped. Owns exactly one Instance, one commit path, one policy.
   Split into the four named halves AXIS-Lite recommends, in one object so you
   can see the seams: composer (setup only) · conductor (runtime only) ·
   committer (delta + invariants) · policy (facet selection).
   ──────────────────────────────────────────────────────────────────────────── */
AX.createManager = function createManager(cfg) {
  const M = {
    id: cfg.id, context: cfg.context, formKey: cfg.formKey, identityKey: cfg.identityKey,
    instance: null, committed: null, tokens: new Map(), bonds: [], facets: [], wrappers: [],
    impacts: new Map(), trace: [], seq: 0, recording: [], flags: cfg.flags || {}, live: false,
    boundary: cfg.boundary || {}, onTrace: cfg.onTrace || null, quiet: !!cfg.quiet
  };

  /* — Composer: setup only ─────────────────────────────────────────────── */
  M.composer = {
    registerFacet(key) { if (!M.facets.includes(key)) M.facets.push(key); return M.composer; },
    registerBond(key) { if (!M.bonds.includes(key)) M.bonds.push(key); return M.composer; },
    bindWrapper(key) { if (!M.wrappers.includes(key)) M.wrappers.push(key); return M.composer; },
    registerImpact(kind, key) { M.impacts.set(kind, key || ('impact.' + kind)); return M.composer; },

    /* THE AUDITION (critique 12.9). Every Effect kind any reachable Action can
       declare must have a handler. Every capability a Facet delegates to must
       resolve. No Facet may be unreachable. Fails at bind(), not at dispatch(). */
    audition() {
      const missingHandlers = [], unresolvedCapabilities = [], orphanedFacets = [], danglingLinks = [];
      const reachableActions = new Set();
      for (const fk of M.facets) {
        const facet = R.get(fk);
        if (!facet) { unresolvedCapabilities.push({ facet: fk, capability: '(facet missing)', target: fk }); continue; }
        for (const [cap, actionKey] of Object.entries(facet.delegates || {})) {
          if (!R.has(actionKey)) unresolvedCapabilities.push({ facet: fk, capability: cap, target: actionKey });
          else reachableActions.add(actionKey);
        }
      }
      for (const actionKey of reachableActions) {
        const e = R.entry(actionKey);
        for (const kind of (e.meta.declares || [])) if (!M.impacts.has(kind)) missingHandlers.push({ action: actionKey, kind });
        for (const lk of (e.meta.needs || [])) if (!R.has(lk)) danglingLinks.push({ action: actionKey, link: lk });
      }
      const covered = new Set(M.policy.covers());
      for (const fk of M.facets) if (!covered.has(fk)) orphanedFacets.push(fk);
      const ok = !missingHandlers.length && !unresolvedCapabilities.length && !orphanedFacets.length && !danglingLinks.length;
      return { ok, missingHandlers, unresolvedCapabilities, orphanedFacets, danglingLinks,
               checked: { facets: M.facets.length, actions: reachableActions.size, handlers: M.impacts.size } };
    },

    /* bind() ends the composition phase. Hydration is permitted until it
       returns and not one instruction after (critique 12.10). */
    bind(initialState) {
      const form = R.get(M.formKey);
      // Kept so a replay can start from the same place: a session is only
      // reproducible from its Intents if you also know what it was bound with.
      M.initial = initialState || {};
      const state = Object.assign({}, form.defaults, initialState || {});
      M.instance = AX.freeze({ formRef: M.formKey, identityRef: M.identityKey, revisionId: 1, state: state });
      M.committed = M.instance;
      const report = M.composer.audition();
      M.live = true;
      return report;
    }
  };

  /* — Policy: which Facet, given Intent + Token + lifecycle ─────────────── */
  M.policy = cfg.policy(M);

  /* — Committer: the only writer of state ──────────────────────────────── */
  M.committer = {
    applyDelta(state, delta) {
      const form = R.get(M.formKey);
      const next = Object.assign({}, state);
      const rejected = [];
      for (const [k, v] of Object.entries(delta)) {
        // A delta carries state, never control instructions (rule: no-magic-deltas).
        const declared = Object.prototype.hasOwnProperty.call(form.shape, k);
        if (!declared && !M.flags.allowMagicDeltas) { rejected.push(k); continue; }
        next[k] = v;
      }
      return { next, rejected };
    },
    commit(delta, intent) {
      const form = R.get(M.formKey);
      const { next, rejected } = M.committer.applyDelta(M.instance.state, delta);
      const violations = [];
      for (const inv of (form.invariants || [])) { const v = inv(next); if (v) violations.push({ from: M.formKey, msg: v }); }
      for (const bk of M.bonds) {
        const bond = R.get(bk);
        for (const inv of (bond.invariants || [])) { const v = inv(next, bond); if (v) violations.push({ from: bk, msg: v }); }
      }
      if (rejected.length) violations.push({ from: M.formKey, msg: 'undeclared delta key(s): ' + rejected.join(', ') });
      if (violations.length) return { ok: false, violations };
      const changed = Object.keys(delta).filter(k => M.instance.state[k] !== next[k]);
      M.instance = AX.freeze({ formRef: M.formKey, identityRef: M.identityKey, revisionId: M.instance.revisionId + 1, state: next });
      return { ok: true, changed, instance: M.instance };
    }
  };

  /* — Token minting. The Manager does this. Never the Adapter. ──────────── */
  M.issueToken = function (scope, rawAuth, claims) {
    const t = AX.freeze({
      identityRef: M.identityKey, scope, expiry: (cfg.now ? cfg.now() : Date.now()) + (cfg.tokenTtl || 30 * 60000),
      claims: claims || {}, tokenId: AX.uid('tok')
    });
    M.tokens.set(scope, t);
    return t;
  };
  M.tokenFor = (scope) => M.tokens.get(scope);

  /* — Link resolution: hydrate BEFORE dispatch, so Actions never traverse ─ */
  M.resolveLink = function (linkKey, state, intent) {
    const link = R.get(linkKey);
    return link ? link.resolve(state, intent, R) : {};
  };

  /* — Impact executor: the only site of IO in this context ──────────────── */
  M.execute = async function (effects, intent) {
    const outcomes = [];
    for (const eff of effects) {
      const handlerKey = M.impacts.get(eff.kind);
      if (!handlerKey || !R.has(handlerKey)) {
        // The failure critique 12.9 is about — kept, visibly, so the audition has something to prevent.
        outcomes.push({ kind: eff.kind, ok: false, error: 'No impact handler for: ' + eff.kind, unhandled: true });
        continue;
      }
      const handler = R.get(handlerKey);
      const policy = eff.retryPolicy || { maxRetries: 0 };
      let attempt = 0, done = false, last = null;
      while (!done) {
        try { last = await handler(eff, { manager: M, intent }); done = true; }
        catch (err) {
          last = { ok: false, error: String(err && err.message || err) };
          if (attempt++ < (policy.maxRetries || 0)) {
            const wait = policy.backoff === 'exponential' ? 60 * Math.pow(2, attempt) : 60;
            await new Promise(r => setTimeout(r, M.flags.fastRetry ? 1 : wait));
          } else done = true;
        }
      }
      const outcome = Object.assign({ kind: eff.kind, ok: true, attempts: attempt + 1 }, last || {});
      if (!outcome.ok && eff.compensatingEffect) {
        outcome.compensated = true;
        const comp = await M.execute([eff.compensatingEffect], intent);
        outcome.compensation = comp[0];
      }
      outcomes.push(outcome);
      if (outcome.followUp) M.conductor.dispatch(outcome.followUp);
    }
    return outcomes;
  };

  /* — Conductor: runtime only. The whole pipeline, in one readable page. ── */
  M.conductor = {
    async dispatch(intent) {
      if (!M.live) throw new Error(M.id + ': dispatch before bind()');
      const t0 = (cfg.now ? cfg.now() : Date.now());
      const rec = { seq: ++M.seq, t: t0, kind: intent.kind, capability: intent.capability, ctx: M.context };
      M.recording.push(intent);

      // 1. Manager mints the Token from raw auth. The Adapter was not allowed to.
      const token = M.policy.token(intent);
      rec.token = token ? token.scope + ':' + JSON.stringify(token.claims) : null;

      // 2. Route: Token claims + lifecycle select a Facet. A lookup, not a branch.
      const facetKey = M.policy.select(intent, token, M.instance);
      rec.facet = facetKey;
      const facet = R.get(facetKey);

      // 3. Facet resolves capability → Action.
      const actionKey = facet && facet.delegates ? facet.delegates[intent.capability] : undefined;
      if (!actionKey || !R.has(actionKey)) {
        rec.action = null; rec.rejected = 'no delegate for ' + intent.capability + ' in ' + facetKey;
        M.trace.push(rec); if (M.onTrace) M.onTrace(rec);
        await M.execute([{ kind: 'REJECTED', target: intent.kind, payload: { reason: rec.rejected } }], intent);
        return { ok: false, reason: rec.rejected };
      }
      rec.action = actionKey;

      // 4. Hydrate declared Links first, so the Action receives complete state.
      const meta = R.entry(actionKey).meta;
      let state = M.instance.state;
      if (meta.needs && meta.needs.length) {
        const extra = {};
        for (const lk of meta.needs) Object.assign(extra, M.resolveLink(lk, state, intent));
        state = Object.assign({}, state, { $linked: extra });
      }

      // 5. The Action. Pure. Frozen input — a mutation attempt throws here.
      const out = R.get(actionKey)(AX.freeze(state), AX.freeze(intent)) || { delta: {}, effects: [] };
      const delta = out.delta || {}, declared = out.effects || [];
      rec.delta = Object.keys(delta);
      rec.effects = declared.map(e => e.kind);

      // 6. Commit. Only here. Form and Bond invariants checked; bad deltas rejected.
      const res = M.committer.commit(delta, intent);
      rec.rev = M.instance.revisionId;
      if (!res.ok) rec.violations = res.violations.map(v => v.from + ': ' + v.msg);

      // 7. Effects go to Impact. Rendering is one of them — the DOM is IO.
      const effects = declared.slice();
      if (!res.ok) effects.push({ kind: 'REJECTED', target: intent.kind, payload: { violations: res.violations } });
      else if (res.changed.length && !intent.meta.silent) effects.push({ kind: 'RENDER', target: '*', payload: { changed: res.changed } });
      M.trace.push(rec); if (M.onTrace) M.onTrace(rec);
      const outcomes = await M.execute(effects, intent);
      return { ok: res.ok, outcomes, rec };
    }
  };

  M.dispatch = (intent) => M.conductor.dispatch(intent);
  return M;
};

/* ── INTENT constructor. Adapters produce these and nothing else. ──────────
   Note what it carries: rawAuth (material, not identity) and meta.ts (the
   clock enters through the Intent, which is what keeps Actions deterministic
   and the session replayable).                                              */
AX.intent = function (kind, capability, payload, opts) {
  const o = opts || {};
  return {
    kind, capability, payload: payload || {},
    identityRef: o.identityRef || null,
    rawAuth: o.rawAuth || null,
    wrapperCtx: o.wrapperCtx || 'unknown',
    meta: { correlationId: o.correlationId || AX.uid('cid'), ts: o.ts != null ? o.ts : Date.now(), silent: !!o.silent, source: o.source || 'user' }
  };
};

/* ── axis-lint (critique 12.3, roadmap item, first cut) ────────────────────
   Static text analysis over everything registered as an Action. It cannot
   prove purity — it reads source text. It can only make violations visible,
   which is exactly the honest ceiling AXIS claims.                          */
AX.lint = function () {
  const banned = [
    [/\bfetch\s*\(/, 'calls fetch'],
    [/\blocalStorage\b|\bsessionStorage\b/, 'touches web storage'],
    [/\bdocument\b\s*\./, 'touches the DOM'],
    [/\bwindow\b\s*\./, 'touches window'],
    [/\bDate\.now\s*\(|new Date\s*\(/, 'reads the clock (the clock belongs in intent.meta.ts)'],
    [/\bMath\.random\s*\(/, 'is non-deterministic'],
    [/\bawait\b|\basync\b/, 'is asynchronous — an Action must be synchronous'],
    [/\bconsole\s*\./, 'writes to the console (an IO effect, however small)'],
    [/\bXMLHttpRequest\b|\bWebSocket\b/, 'opens a connection']
  ];
  const results = [];
  for (const e of R.byComponent('action')) {
    const src = String(e.value);
    const findings = banned.filter(([re]) => re.test(src)).map(([, msg]) => msg);
    results.push({ key: e.key, findings, lines: src.split('\n').length, declares: e.meta.declares || [] });
  }
  return {
    total: results.length,
    clean: results.filter(r => !r.findings.length).length,
    violations: results.filter(r => r.findings.length),
    results,
    ceiling: 'This reads source text. It proves nothing about a function it cannot see, and an Action that calls a helper that calls fetch passes. AXIS offers checkable purity, not proven purity.'
  };
};
</script>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════════════════
   THE CLIENT CONTEXT — this page, as an AXIS composition.
   forms · identity · bonds · links · facets · actions
   Every Action below is a pure synchronous function of (state, intent).
   Movement 5.15 lints them and tells you if that is a lie.
   ══════════════════════════════════════════════════════════════════════════════ */

const MODEL = AX.freeze(Object.assign(
  JSON.parse(document.getElementById('axis-model').textContent),
  JSON.parse(document.getElementById('axis-narrative').textContent),
  document.getElementById('axis-code-samples') ? JSON.parse(document.getElementById('axis-code-samples').textContent) : {}
));
AX.MODEL = MODEL;

/* Indexes — derived once, frozen, supplied to Actions as a constant value.
   (Principle #9 is about services, not values: nothing here can be swapped
   out at call time, and nothing here can change.) */
const IX = AX.freeze({
  comp: Object.fromEntries(MODEL.components.map(c => [c.id, c])),
  axis: Object.fromEntries(MODEL.axes.map(a => [a.id, a])),
  flow: Object.fromEntries(MODEL.flows.map(f => [f.id, f])),
  mv: Object.fromEntries(MODEL.movements.map(m => [m.id, m])),
  mistake: Object.fromEntries(MODEL.mistakes.map(m => [m.id, m])),
  baseline: Object.fromEntries(MODEL.baselines.map(b => [b.id, b])),
  rule: Object.fromEntries(MODEL.rules.map(r => [r.id, r])),
  profile: Object.fromEntries(MODEL.profiles.map(p => [p.id, p])),
  role: Object.fromEntries(MODEL.roles.map(r => [r.id, r])),
  codeSample: (MODEL.codeSamples || {}),
  acts: [['I', 'The Vocabulary'], ['II', 'The Machine'], ['III', 'The System'], ['IV', 'The Case'], ['V', 'The Cross-Examination']],

  /* Two derivations the guided walk in the right-hand panel needs, both read
     out of model.lineage.mvc — the same rows movement 5.10 renders. The panel
     therefore cannot claim a descent the lineage table denies. */
  mvcRow: Object.fromEntries((((MODEL.lineage || []).find(x => x.id === 'mvc') || {}).rows || []).map(r => [r.theirs, r])),
  mvcOf: (() => {
    const rows = (((MODEL.lineage || []).find(x => x.id === 'mvc') || {}).rows) || [];
    const o = {};
    MODEL.components.forEach(c => { o[c.id] = ''; });           // '' = a cell MVC never had
    rows.forEach(r => { if (r.essence) o[r.essence] = r.theirs; if (r.expression) o[r.expression] = r.theirs; });
    return o;
  })()
});

/* ── FORM (Being · Essence) ─────────────────────────────────────────────────
   Shape, defaults, invariants. It holds nothing. Every key the Instance is
   allowed to carry is declared here — a delta with any other key is rejected
   at commit, which is how the "magic delta key" mistake is caught.
   ──────────────────────────────────────────────────────────────────────────── */
AX.form('form.tutorial', {
  shape: {
    movement: 'string', role: 'string|null', profile: 'string', scenario: 'string|null',
    flow: 'string', step: 'number', playing: 'boolean', mistakes: 'string[]',
    selected: 'string|null', drawer: 'boolean', look: 'string', layout: 'string',
    lineage: 'string', ladder: 'number', splitStep: 'number', cardinality: 'boolean',
    showKeys: 'boolean', transport: 'string', invoice: 'object', serverLog: 'object[]',
    studio: 'object', audit: 'object|null', lint: 'object|null', replay: 'object|null',
    ensemble: 'string[]', roleMap: 'object|null', limits: 'boolean', gravatar: 'boolean',
    toast: 'string|null', linked: 'object|null', critique: 'string|null', managerOpen: 'boolean',
    fifteenth: 'boolean', nesting: 'boolean',
    walk: 'boolean', walkStep: 'number', walkLens: 'string',
    codeModal: 'boolean', codeLang: 'string', codeTopic: 'string', codeCopied: 'boolean'
  },
  defaults: {
    movement: '5.0', role: null, profile: 'full', scenario: null,
    flow: 'canonical', step: 0, playing: false, mistakes: [],
    selected: null, drawer: false, look: 'dark', layout: 'columnar',
    lineage: 'mvc', ladder: 0, splitStep: 0, cardinality: false,
    showKeys: false, transport: 'worker',
    invoice: { id: 'inv-4471', status: 'draft', customer: 'cust-19', total: 1250,
               lineItems: [{ id: 'li-1', label: 'Design sprint', amount: 900 },
                           { id: 'li-2', label: 'Revisions', amount: 350 }],
               discount: 0, attempts: 0, lastOutcome: null },
    serverLog: [], studio: { capability: 'invoice.discount', facet: 'facet.invoice.draft',
                             action: 'action.invoice.discount', effect: 'EMAIL_SEND',
                             wired: false, handlerBound: true },
    audit: null, lint: null, replay: null, ensemble: [], roleMap: null,
    limits: false, gravatar: false, toast: null, linked: null, critique: null,
    managerOpen: false, fifteenth: false, nesting: false,
    walk: false, walkStep: 0, walkLens: '',
    codeModal: false, codeLang: 'typescript', codeTopic: 'action', codeCopied: false
  },
  invariants: [
    (s) => IX.mv[s.movement] ? null : 'unknown movement: ' + s.movement,
    (s) => IX.profile[s.profile] ? null : 'unknown profile: ' + s.profile,
    (s) => IX.flow[s.flow] ? null : 'unknown flow: ' + s.flow,
    (s) => (s.step >= 0 && s.step <= IX.flow[s.flow].steps.length) ? null
         : 'step ' + s.step + ' is outside flow "' + s.flow + '" (0…' + IX.flow[s.flow].steps.length + ')',
    (s) => (s.role === null || IX.role[s.role]) ? null : 'unknown reader role: ' + s.role,
    (s) => ['dark', 'light', 'blueprint'].indexOf(s.look) >= 0 ? null : 'unknown look facet: ' + s.look,
    (s) => (s.walkStep >= 0 && s.walkStep < MODEL.evolution.stages.length) ? null
         : 'walk stage ' + s.walkStep + ' is outside model.evolution.stages (0…' + (MODEL.evolution.stages.length - 1) + ')',
    (s) => (s.walkLens === '' || s.walkLens === 'none' || IX.mvcRow[s.walkLens]) ? null
         : 'unknown walk lens: ' + s.walkLens + ' — it must name a row of lineage.mvc'
  ]
});

/* ── IDENTITY (Identity · Essence) ──────────────────────────────────────────
   You. One stable id. Choosing a reader role does NOT change it — a role is a
   claim on a Token, which is the entire point of the Identity axis.
   ──────────────────────────────────────────────────────────────────────────── */
AX.identity('identity.reader', { entityId: 'reader@this-page', formRef: 'form.tutorial', versioningPolicy: 'revision-counter' });

/* ── BOND (Relating · Essence) ──────────────────────────────────────────────
   A cross-entity invariant, checked by the Committer on every commit. Try
   putting #m=9.9 in the address bar: the commit is rejected and the page tells
   you which rule refused it, instead of rendering an empty section.
   ──────────────────────────────────────────────────────────────────────────── */
AX.bond('bond.movement.act', {
  ownerRef: 'form.tutorial', targetRef: 'model.movements', cardinality: 'one-to-many',
  describe: 'the committed movement must resolve to a movement in the model, and its act must exist',
  invariants: [
    (s) => { const m = IX.mv[s.movement]; if (!m) return 'movement ' + s.movement + ' is not in the model';
             return IX.acts.some(a => a[0] === m.act) ? null : 'movement ' + s.movement + ' claims act ' + m.act + ', which does not exist'; }
  ]
});
AX.bond('bond.axis.components', {
  ownerRef: 'model.axes', targetRef: 'model.components', cardinality: 'one-to-two',
  describe: 'every axis owns exactly two components, one per pole — the grid symmetry, as an enforceable rule rather than a claim',
  invariants: [],
  checkModel() {
    const bad = [];
    for (const a of MODEL.axes) {
      const mine = MODEL.components.filter(c => c.axis === a.id);
      if (mine.length !== 2) bad.push(a.id + ' owns ' + mine.length + ' components');
      if (!mine.some(c => c.pole === 'essence')) bad.push(a.id + ' has no Essence');
      if (!mine.some(c => c.pole === 'expression')) bad.push(a.id + ' has no Expression');
      if (IX.comp[a.essence] === undefined) bad.push(a.id + '.essence → ' + a.essence + ' does not resolve');
      if (IX.comp[a.expression] === undefined) bad.push(a.id + '.expression → ' + a.expression + ' does not resolve');
    }
    return bad;
  }
});
AX.bond('bond.component.zone', {
  ownerRef: 'model.components', targetRef: 'model.encoding.zones', cardinality: 'many-to-one',
  describe: 'a component drawn on the canvas must sit inside the band its own zone declares, and its height must be its altitude — so the diagram cannot contradict the model',
  invariants: [],
  checkModel() {
    const bad = [];
    for (const c of MODEL.components) {
      const z = MODEL.encoding.zones.find(z => z.id === c.zone);
      if (!z) { bad.push(c.id + ' has unknown zone ' + c.zone); continue; }
      if (c.pos.x < z.x0 - 0.02 || c.pos.x > z.x1 + 0.02) bad.push(c.id + ' is drawn at x=' + c.pos.x + ', outside its ' + z.id + ' band');
      if ('y' in c.pos) bad.push(c.id + ' carries a hand-placed y; vertical position must be derived from altitude');
    }
    return bad;
  }
});

/* ── LINK (Relating · Expression) ───────────────────────────────────────────
   Resolves the traversal BEFORE dispatch, so the Action receives complete
   state and stays a pure function of it. Actions never traverse.
   ──────────────────────────────────────────────────────────────────────────── */
AX.link('link.axis.components', {
  bondRef: 'bond.axis.components', scope: 'drawer',
  resolve(state, intent) {
    const id = intent.payload.id;
    const c = IX.comp[id];
    if (!c) return { axis: null, pair: [] };
    const a = IX.axis[c.axis];
    return { axis: a, pair: [IX.comp[a.essence], IX.comp[a.expression]],
             rules: (c.rules || []).map(r => IX.rule[r]).filter(Boolean),
             mistakes: (c.mistakes || []).map(m => IX.mistake[m]).filter(Boolean) };
  }
});

/* ── FACET (Meaning · Essence) ──────────────────────────────────────────────
   Capability maps. capability key → 'action.name'. No conditionals anywhere.
   Note what is happening structurally: three surfaces built by composition
   from one base map — a capability overlay, per Specification §6.
   ──────────────────────────────────────────────────────────────────────────── */
const readingDelegates = {
  'tutorial.goto': 'action.tutorial.goto',
  'tutorial.roleSet': 'action.tutorial.roleSet',
  'grid.select': 'action.grid.select',
  'grid.close': 'action.grid.close',
  'grid.cardinality': 'action.grid.cardinality',

/* ── ACTIONS (Doing · Essence) ──────────────────────────────────────────────
   (state, intent) → { delta, effects[] }. Pure, synchronous, deterministic.
   The clock is not read here — it arrives on intent.meta.ts. That is what
   makes the replay in 5.15 able to reproduce a session exactly.
   `declares` is composition-time metadata: the Effect kinds this Action may
   emit. The audition checks every one of them has a handler.
   ──────────────────────────────────────────────────────────────────────────── */
const persist = (s) => ({ kind: 'PERSIST', target: 'axis.tutorial',
  payload: { movement: s.movement, role: s.role, profile: s.profile, look: s.look, layout: s.layout,
             walk: s.walk, walkStep: s.walkStep } });
const url = (s) => ({ kind: 'URL_SET', target: 'hash',
  payload: { m: s.movement, flow: s.flow, step: s.step, profile: s.profile, role: s.role || '' } });

AX.action('action.tutorial.goto', (s, i) => {
  const m = i.payload.id;
  const next = Object.assign({}, s, { movement: m });
  return { delta: { movement: m, playing: false }, effects: [persist(next), url(next), { kind: 'FOCUS', target: 'mv-' + m }] };
}, { declares: ['PERSIST', 'URL_SET', 'FOCUS'] });

AX.action('action.tutorial.roleSet', (s, i) => {
  // The role arrives as raw auth material on the Intent. The Manager already
  // minted the Token from it before this Action ran; the Action never sees a
  // claim it has to interpret, and contains no role conditional.
  const r = i.payload.id || null;
  return { delta: { role: r }, effects: [persist(Object.assign({}, s, { role: r })), { kind: 'TOAST', target: 'role', payload: { text: r ? 'Token minted: claims ' + JSON.stringify(IX.role[r].depth ? { role: r, depth: IX.role[r].depth } : { role: r }) : 'Token revoked' } }] };
}, { declares: ['PERSIST', 'TOAST'] });

AX.action('action.grid.select', (s, i) => ({
  delta: { selected: i.payload.id, drawer: true, linked: (s.$linked || null) },
  effects: []
}), { needs: ['link.axis.components'], declares: [] });

AX.action('action.grid.close', (s) => ({ delta: { drawer: false, selected: null, linked: null }, effects: [] }), { declares: [] });
AX.action('action.grid.cardinality', (s) => ({ delta: { cardinality: !s.cardinality }, effects: [] }), { declares: [] });
AX.action('action.split.step', (s, i) => ({ delta: { splitStep: Number(i.payload.v) }, effects: [] }), { declares: [] });
AX.action('action.ladder.set', (s, i) => ({ delta: { ladder: Number(i.payload.v) }, effects: [] }), { declares: [] });

AX.action('action.flow.select', (s, i) => {
  const f = i.payload.id;
  return { delta: { flow: f, step: 0, playing: false }, effects: [url(Object.assign({}, s, { flow: f, step: 0 }))] };
}, { declares: ['URL_SET'] });

AX.action('action.flow.step', (s, i) => {
  const len = IX.flow[s.flow].steps.length;
  const dir = i.payload.dir === 'back' ? -1 : 1;
  const raw = s.step + dir;
  const next = raw > len ? 0 : (raw < 0 ? len : raw);
  const keepPlaying = s.playing && !(dir > 0 && raw > len);
  const effects = [url(Object.assign({}, s, { step: next }))];
  if (keepPlaying) effects.push({ kind: 'TICK', target: 'flow', payload: { ms: 1500, capability: 'flow.step', dir: 'fwd' } });
  return { delta: { step: next, playing: keepPlaying }, effects };
}, { declares: ['URL_SET', 'TICK'] });

AX.action('action.flow.play', (s) => {
  const playing = !s.playing;
  return { delta: { playing }, effects: playing ? [{ kind: 'TICK', target: 'flow', payload: { ms: 900, capability: 'flow.step', dir: 'fwd' } }] : [] };
}, { declares: ['TICK'] });

AX.action('action.flow.scrub', (s, i) => ({ delta: { step: Number(i.payload.v), playing: false }, effects: [] }), { declares: [] });

AX.action('action.mistake.toggle', (s, i) => {
  const id = i.payload.id;
  const on = s.mistakes.indexOf(id) >= 0;
  const mistakes = on ? s.mistakes.filter(m => m !== id) : s.mistakes.concat([id]);
  return { delta: { mistakes }, effects: [] };
}, { declares: [] });

AX.action('action.profile.set', (s, i) => {
  const p = i.payload.id;
  return { delta: { profile: p, scenario: null }, effects: [persist(Object.assign({}, s, { profile: p }))] };
}, { declares: ['PERSIST'] });

AX.action('action.scenario.set', (s, i) => {
  const sc = MODEL.scenarios.find(x => x.id === i.payload.id);
  return { delta: { scenario: sc ? sc.id : null, profile: sc ? sc.profile : s.profile }, effects: [] };
}, { declares: [] });

AX.action('action.look.set', (s, i) => {

  return { delta: { look }, effects: [{ kind: 'FACET_SWAP', target: 'look', payload: { name: look } }, persist(Object.assign({}, s, { look }))] };

AX.action('action.layout.set', (s, i) => {

AX.action('action.lineage.set', (s, i) => ({ delta: { lineage: i.payload.id }, effects: [] }), { declares: [] });

AX.action('action.transport.set', (s, i) => ({

  effects: [{ kind: 'TOAST', target: 'transport', payload: { text: 'Transport is now ' + i.payload.id + '. The diagram did not change.' } }]
}), { declares: ['TOAST'] });

/* The client half of the cross-context operation. Note what it does NOT do:
   it does not call the server, it does not know the transport, and it does not
   know whether the far side is a Worker, an endpoint, or a function call. */
AX.action('action.invoice.dispatch', (s, i) => ({
  delta: { invoice: Object.assign({}, s.invoice, { pending: i.payload.capability }) },
  effects: [{
    kind: 'SEND_TO_SERVER', target: 'manager.server',
    payload: { capability: i.payload.capability, invoiceId: s.invoice.id,
               amount: i.payload.amount, failMail: !!i.payload.failMail,
               breakBond: !!i.payload.breakBond, correlationId: i.meta.correlationId },
    rawAuth: { authHeader: 'Bearer demo.' + (s.role || 'anon') },
    retryPolicy: { maxRetries: 2, backoff: 'exponential' }
  }]
}), { declares: ['SEND_TO_SERVER'] });

/* Not part of the domain: a fixture. The invoice lifecycle is deliberately
   one-way — paid and void have empty capability maps, which is the whole point
   of the Facet demo — so resetting the aggregate has to be a harness operation,
   and it is labelled as one rather than smuggled in as a domain capability. */
AX.action('action.invoice.reset', (s, i) => ({
  delta: { invoice: Object.assign({}, s.invoice, { status: 'draft', total: 1250, discount: 0, pending: null, lastOutcome: null, history: [] }), serverLog: [] },
  effects: [{ kind: 'SERVER_RESET', target: 'manager.server' },
            { kind: 'TOAST', target: 'reset', payload: { text: 'Server context rebuilt. This is a test fixture, not a domain capability — the lifecycle itself has no way back from paid.' } }]
}), { declares: ['SERVER_RESET', 'TOAST'] });

/* Pass 2. The far side's outcome re-enters as meaning, not as a callback. */
AX.action('action.invoice.applyOutcome', (s, i) => {
  const o = i.payload;
  const inv = Object.assign({}, s.invoice, o.invoice || {}, { pending: null, lastOutcome: o.summary });
  const log = s.serverLog.concat([{ t: i.meta.ts, ok: !!o.ok, summary: o.summary, trace: o.trace || [] }]).slice(-12);
  return { delta: { invoice: inv, serverLog: log }, effects: [] };
}, { declares: [] });

/* — the composition studio: composing a running system by key — */
AX.action('action.studio.set', (s, i) => ({
  delta: { studio: Object.assign({}, s.studio, { [i.payload.field]: i.payload.v }) }, effects: []
}), { declares: [] });

AX.action('action.studio.wire', (s) => ({
  delta: { studio: Object.assign({}, s.studio, { wired: true }) },
  effects: [{ kind: 'COMPOSE', target: 'wire', payload: s.studio }, { kind: 'AUDIT', target: 'manager.server' }]
}), { declares: ['COMPOSE', 'AUDIT'] });

AX.action('action.studio.unwire', (s) => ({
  delta: { studio: Object.assign({}, s.studio, { wired: false }) },
  effects: [{ kind: 'COMPOSE', target: 'unwire', payload: s.studio }, { kind: 'AUDIT', target: 'manager.server' }]
}), { declares: ['COMPOSE', 'AUDIT'] });

AX.action('action.studio.unbindHandler', (s) => ({
  delta: { studio: Object.assign({}, s.studio, { handlerBound: !s.studio.handlerBound }) },
  effects: [{ kind: 'COMPOSE', target: s.studio.handlerBound ? 'unbindHandler' : 'bindHandler', payload: s.studio },
            { kind: 'AUDIT', target: 'manager.server' }]
}), { declares: ['COMPOSE', 'AUDIT'] });

/* — three two-pass reads over the page's own runtime — */
AX.action('action.audit.run', () => ({ delta: {}, effects: [{ kind: 'AUDIT', target: 'manager.server' }] }), { declares: ['AUDIT'] });
AX.action('action.audit.apply', (s, i) => ({ delta: { audit: i.payload }, effects: [] }), { declares: [] });
AX.action('action.lint.run', () => ({ delta: {}, effects: [{ kind: 'LINT', target: 'action.*' }] }), { declares: ['LINT'] });
AX.action('action.lint.apply', (s, i) => ({ delta: { lint: i.payload }, effects: [] }), { declares: [] });
AX.action('action.replay.run', () => ({ delta: {}, effects: [{ kind: 'REPLAY', target: 'manager.client' }] }), { declares: ['REPLAY'] });
AX.action('action.replay.apply', (s, i) => ({ delta: { replay: i.payload }, effects: [] }), { declares: [] });

AX.action('action.ensemble.toggle', (s, i) => {
  const id = i.payload.id;
  const on = s.ensemble.indexOf(id) >= 0;
  return { delta: { ensemble: on ? s.ensemble.filter(x => x !== id) : s.ensemble.concat([id]) }, effects: [] };
}, { declares: [] });

AX.action('action.rolemap.load', (s, i) => {
  // Parsing is pure: same text in, same object out. It is the Adapter's raw
  // string arriving as payload, turned into meaning exactly once.
  let map = null;
  try { map = JSON.parse(i.payload.v || 'null'); } catch (e) { map = null; }
  return { delta: { roleMap: map }, effects: map ? [] : [{ kind: 'TOAST', target: 'rolemap', payload: { text: 'That is not valid JSON — nothing was committed.' } }] };
}, { declares: ['TOAST'] });
AX.action('action.critique.open', (s, i) => ({ delta: { critique: s.critique === i.payload.id ? null : i.payload.id }, effects: [] }), { declares: [] });
AX.action('action.manager.open', (s) => ({ delta: { managerOpen: !s.managerOpen }, effects: [] }), { declares: [] });
AX.action('action.fifteenth.toggle', (s) => ({ delta: { fifteenth: !s.fifteenth }, effects: [] }), { declares: [] });
AX.action('action.nesting.toggle', (s) => ({ delta: { nesting: !s.nesting }, effects: [] }), { declares: [] });
AX.action('action.limits.toggle', (s) => ({ delta: { limits: !s.limits }, effects: [] }), { declares: [] });
AX.action('action.gravatar.toggle', (s) => ({ delta: { gravatar: !s.gravatar }, effects: [] }), { declares: [] });
AX.action('action.keys.toggle', (s) => ({ delta: { showKeys: !s.showKeys }, effects: [] }), { declares: [] });
AX.action('action.toast.set', (s, i) => ({ delta: { toast: i.payload.text || null }, effects: [] }), { declares: [] });

/* — the guided walk (Doing · Essence) —
   Four Actions, no conditionals about content: every stage, note and date is
   in model.evolution, and the panel's position in it is three numbers here. */
AX.action('action.walk.toggle', (s) => {
  const walk = !s.walk;
  return { delta: { walk }, effects: [persist(Object.assign({}, s, { walk }))] };
}, { declares: ['PERSIST'] });

AX.action('action.walk.step', (s, i) => {
  const last = MODEL.evolution.stages.length - 1;
  const raw = s.walkStep + (i.payload.dir === 'back' ? -1 : 1);
  const walkStep = raw < 0 ? 0 : (raw > last ? last : raw);
  return { delta: { walkStep, walk: true }, effects: [persist(Object.assign({}, s, { walkStep, walk: true }))] };
}, { declares: ['PERSIST'] });

AX.action('action.walk.goto', (s, i) => {
  const last = MODEL.evolution.stages.length - 1;
  const n = Number(i.payload.i);
  const walkStep = !isFinite(n) ? s.walkStep : (n < 0 ? 0 : (n > last ? last : Math.round(n)));
  return { delta: { walkStep, walk: true }, effects: [persist(Object.assign({}, s, { walkStep, walk: true }))] };
}, { declares: ['PERSIST'] });

AX.action('action.walk.lens', (s, i) => {
  const id = i.payload.id || '';
  return { delta: { walkLens: s.walkLens === id ? '' : id }, effects: [] };
}, { declares: [] });

AX.action('action.code.open', (s, i) => ({
  delta: {
    codeModal: true,
    codeTopic: (i.payload && i.payload.topic) || s.codeTopic || (s.selected || 'action'),
    codeLang: (i.payload && i.payload.lang) || s.codeLang || 'typescript',
    codeCopied: false
  },
  effects: []
}), { declares: [] });

AX.action('action.code.close', () => ({ delta: { codeModal: false, codeCopied: false }, effects: [] }), { declares: [] });

AX.action('action.code.toggle', (s) => ({ delta: { codeModal: !s.codeModal, codeCopied: false }, effects: [] }), { declares: [] });

AX.action('action.code.setLang', (s, i) => ({ delta: { codeLang: i.payload.lang, codeCopied: false }, effects: [] }), { declares: [] });

AX.action('action.code.setTopic', (s, i) => ({ delta: { codeTopic: i.payload.topic, codeCopied: false }, effects: [] }), { declares: [] });

AX.action('action.code.copy', (s, i) => ({
  delta: { codeCopied: true },
  effects: [{ kind: 'CLIPBOARD_COPY', payload: { text: (i.payload && i.payload.text) || '' } }]
}), { declares: ['CLIPBOARD_COPY'] });

/* Three Actions for one capability. The Facet decides which one runs, and the
   decision is a lookup in a map — there is no `if (role === …)` in this file. */
AX.action('action.detail.expandPlain', (s, i) => ({ delta: {}, effects: [{ kind: 'TOAST', target: 'detail', payload: { text: 'No role selected, so facet.tutorial.reading handled that.' } }] }), { declares: ['TOAST'] });
AX.action('action.detail.expandTechnical', (s, i) => ({ delta: {}, effects: [{ kind: 'TOAST', target: 'detail', payload: { text: 'facet.tutorial.technical → action.detail.expandTechnical. Contracts and keys shown.' } }] }), { declares: ['TOAST'] });
AX.action('action.detail.expandGentle', (s, i) => ({ delta: {}, effects: [{ kind: 'TOAST', target: 'detail', payload: { text: 'facet.tutorial.gentle → action.detail.expandGentle. Plain language first.' } }] }), { declares: ['TOAST'] });

/* — the "break it" Action, deliberately impure. It is registered so that the
     lint in 5.15 has something true to find. It is never routed by any Facet,
     so the audition correctly reports it as unreachable rather than clean. — */
AX.action('action.demo.impure', function loadUserBadly(state, intent) {
  /* WRONG on purpose — see mistake io-in-action */
  return fetch('/api/users/' + intent.identityRef).then(r => ({ delta: r, effects: [] }));
}, { declares: [], unreachable: true, demo: true });
