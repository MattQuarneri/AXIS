    '<div>brought to you by ' + btn('gravatar.toggle', {}, '<b>M@Q</b>', { cls: 'btn-sm' }) + '</div>' +
    '</div>' +
    (s.gravatar ? '<div class="gv" style="position:relative;margin-top:12px;max-width:360px">' +
      '<div class="spread"><b>Matthew Quarneri</b>' + btn('gravatar.toggle', {}, '✕', { cls: 'btn-sm' }) + '</div>' +
      '<div class="fine" style="margin:6px 0">MENTIC Cognitive Systems · matt@mentic.com</div>' +
      '<a href="https://gravatar.com/mattmikeq.card" target="_blank" rel="noopener" class="u-mono" style="font-size:12px">gravatar.com/mattmikeq.card ↗</a>' +
      '</div>' : '') +
    '<div class="fine" style="margin-top:14px">AXIS, formulated by Matthew Quarneri — MENTIC Cognitive Systems. © 2026 MENTIC LLC. Originally published at <a href="https://mentic.com/AXIS">mentic.com/AXIS</a>. Licensed under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.<br>If you found these ideas useful you could <a href="https://buymeacoffee.com/mattq4">Buy Me a Coffee</a> to show your support.</div>' +
    '<div class="fine" style="margin-top:6px">Sources: ' + MODEL.meta.sources.map(esc).join(' · ') + '. ' + esc(MODEL.meta.status) + '</div>' +
    '</div>';
});
</script>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════════════════
   VIEWS — ACT I and ACT II
   Each is a Wrapper: a mount point, a watch list, and a pure render function.
   The watch list is why typing in the studio does not repaint the grid.
   ══════════════════════════════════════════════════════════════════════════════ */

/* ── 5.0 The Premise ─────────────────────────────────────────────────────── */
AX.defineWrapper('wrapper.view.premise', '#view-premise', ['ladder'], (s) => {
  const L = MODEL.encoding.altitude.ladder, i = s.ladder;
  const alt = i / (L.length - 1);
  const near = MODEL.components.filter(c => Math.abs(c.altitude - alt) < 0.11).sort((a, b) => a.altitude - b.altitude);
  const rungs = L.map((r, k) => {
    const on = k === i;
    return '<div style="display:flex;gap:12px;align-items:center;padding:3px 0;opacity:' + (on ? 1 : .42) + '">' +
      '<div style="width:110px;text-align:right;font-weight:' + (on ? 700 : 400) + ';color:' + (on ? 'var(--ink)' : 'var(--ink-2)') + '">' + r + '</div>' +
      '<div style="flex:1;height:' + (on ? 3 : 1) + 'px;background:' + (on ? 'hsl(' + Math.round(25 + (215 * (1 - k / 8))) + ' var(--sat) var(--lum))' : 'var(--rule)') + '"></div>' +
      '<div class="fine" style="width:52px">' + (k / 8).toFixed(2) + '</div></div>';
  }).join('');
  return '<div class="cols-2" data-wrapper="premise">' +
    panel('The Cognitive Flow of Change', rungs +
      '<div class="spread" style="margin-top:12px;margin-bottom:4px"><span class="fine">Language references:</span>' + btn('code.open', { topic: 'action' }, '⟨/⟩ Polyglot Code Examples', { cls: 'btn-sm' }) + '</div>' +
      '<input type="range" min="0" max="8" value="' + i + '" data-i="ladder.set" data-keep="ladder" style="margin-top:14px" aria-label="descend the ladder">' +
      '<div class="note" style="margin-top:8px">Each layer constrains and gives meaning to the layers beneath it. The closer a component is to Values, the more it expresses purpose; the closer to Change, the more it expresses execution.</div>') +
    panel('At altitude ' + alt.toFixed(2) + ' — “' + L[i] + '”',
      (near.length ? '<div class="stack">' + near.map(c => '<div class="row" ' + hstyle(c) + '><span class="chip" data-pole="' + c.pole + '" style="border-color:' + col(c) + ';color:' + col(c) + '">' + esc(c.name) + '</span><span class="fine">' + esc(c.oneLiner) + '</span></div>').join('') + '</div>'
        : '<div class="note">Nothing sits here. Values and Goals are above the software; AXIS starts where they become structure — which is itself an argument about what architecture is for.</div>') +
      '<div class="note" style="margin-top:12px">' + esc(MODEL.encoding.altitude.note) + '</div>' +
      '<div class="note" style="margin-top:8px;color:var(--warn)">⚠ ' + esc(MODEL.encoding.altitude.caveat) + '</div>') +
    '</div>';
});

/* ── 5.1 The Grid ────────────────────────────────────────────────────────── */
AX.defineWrapper('wrapper.view.grid', '#view-grid', ['cardinality', 'showKeys', 'selected', 'profile'], (s) => {
  const rows = MODEL.axes.slice().sort((a, b) => a.order - b.order).map(a => {
    const e = IX.comp[a.essence], x = IX.comp[a.expression];
    return '<div class="axis-row" style="--h:' + a.hue + '">' +
      '<div class="axis-label"><b>' + esc(a.name) + '</b><span>' + esc(a.question) + '</span>' +
      (s.cardinality ? '<span class="chip" style="margin-top:4px">' + esc(a.cardinality) + '</span>' : '') + '</div>' +
      cellHTML(e, s) + cellHTML(x, s) + '</div>';
  }).join('');
  const legend = '<div class="cols">' + MODEL.encoding.poles.map(p =>
    '<div><div class="row" style="margin-bottom:6px"><span class="cell" style="--h:200;min-height:0;width:auto;padding:4px 12px;pointer-events:none" data-pole="' + p.id + '">' + p.name + '</span></div>' +
    '<div class="fine">' + esc(p.shape) + ' · ' + esc(p.fill) + '</div>' +
    '<div class="note" style="margin-top:5px">' + esc(p.rationale) + '</div></div>').join('') + '</div>';
  const altScale = '<svg viewBox="0 0 620 150" style="width:100%;max-width:640px">' +
    MODEL.encoding.altitude.ladder.map((r, k) => '<text x="' + (2 + k * 77) + '" y="142" font-size="8.5" fill="var(--ink-3)">' + r + '</text>').join('') +
    '<line x1="0" y1="126" x2="620" y2="126" stroke="var(--rule)"/>' +
    MODEL.components.map(c => {
      const x = 10 + c.altitude * 600, y = 20 + (c.pole === 'essence' ? 0 : 44);
      return '<g transform="translate(' + x + ',' + y + ')"><rect x="-26" y="-8" width="52" height="16" rx="' + (c.pole === 'essence' ? 1.5 : 8) + '" fill="' + (c.pole === 'essence' ? 'none' : softCol(c)) + '" stroke="' + col(c) + '" stroke-width="1.2"/>' +
        '<text x="0" y="3.5" text-anchor="middle" font-size="8" fill="' + col(c) + '">' + esc(c.name.toLowerCase()) + '</text>' +
        '<line x1="0" y1="8" x2="0" y2="' + (106 - y) + '" stroke="' + col(c) + '" stroke-width=".6" opacity=".45"/></g>';
    }).join('') + '</svg>';
  return '<div class="stack" data-wrapper="grid">' +
    '<div class="row">' + btn('grid.cardinality', {}, 'pairing cardinality', { pressed: s.cardinality, title: 'critique 12.1 — the pairs are not all the same strength' }) +
    btn('keys.toggle', {}, 'registry keys', { pressed: s.showKeys }) +
    btn('code.open', { topic: s.selected || 'action' }, '⟨/⟩ show code', { title: 'Open polyglot code modal' }) +
    '<span class="fine">click any cell for its contract · <span class="kbd">esc</span> closes</span></div>' +
    '<div class="grid-14">' + rows + '</div>' +
    (s.cardinality ? panel('Named asymmetry (critique 12.1)', '<div class="scroll-x"><table><tr><th>pairing</th><th>cardinality</th><th>what it means</th></tr>' +
      MODEL.axes.map(a => '<tr><td class="k">' + esc(IX.comp[a.essence].name) + ' → ' + esc(IX.comp[a.expression].name) + '</td><td class="k">' + esc(a.cardinality) + '</td><td>' + esc(a.cardinalityNote) + '</td></tr>').join('') + '</table></div>' +
      '<div class="note" style="margin-top:9px">Three of the seven pairs are strained, and the model now says which. The reason there is one Manager and many Actions <b>is</b> the many:1 pairing — which is why Manager boundaries are a design decision and Action boundaries are just decomposition.</div>') : '') +
    panel('The legend, generated from encoding', legend) +
    panel('Altitude — the same fourteen, on the ladder from 5.0', altScale +
      '<div class="note">Hollow rectangles above the line, filled capsules below. This is <i>the same data</i> as the grid, plotted against <code>altitude</code> instead of against the axis — which is what makes Principles and the Specification one picture.</div>') +
    '</div>';
});

/* ── 5.2 The Split ───────────────────────────────────────────────────────── */
AX.defineWrapper('wrapper.view.split', '#view-split', ['splitStep'], (s) => {
  const axes = MODEL.axes.slice().sort((a, b) => a.order - b.order);
  const a = axes[Math.min(s.splitStep, axes.length - 1)];
  const e = IX.comp[a.essence], x = IX.comp[a.expression];
  const sentence = {
    being: 'Forms generate; Instances hold.',
    identity: 'Identity endures; Tokens expire.',
    meaning: 'Facets permit; Intents mean.',
    relating: 'Bonds declare; Links traverse.',
    doing: 'Actions decide; Managers arrange.',
    changing: 'Effects describe; Impacts do.',
    bridging: 'Wrappers host; Adapters translate.'
  }[a.id];
  const dur = reduced() ? '0.001s' : '1.1s';
  return '<div class="stack" data-wrapper="split">' +
    '<div class="row"><input type="range" min="0" max="6" value="' + s.splitStep + '" data-i="split.step" data-keep="split" style="max-width:330px" aria-label="step through the seven splits">' +
    '<span class="chip" style="border-color:hsl(' + a.hue + ' var(--sat) var(--lum));color:hsl(' + a.hue + ' var(--sat) var(--lum))">' + esc(a.name) + '</span>' +
    '<span class="fine">' + esc(a.question) + '</span></div>' +
    '<div class="canvas-wrap"><svg viewBox="0 0 640 150" style="width:100%;--h:' + a.hue + '">' +
    '<text x="20" y="24" font-size="10" fill="var(--ink-3)">IMMUTABLE ESSENCE</text>' +
    '<text x="400" y="24" font-size="10" fill="var(--ink-3)">PROJECTED EXPRESSION</text>' +
    '<g><rect x="20" y="52" width="150" height="46" rx="2" fill="none" stroke="hsl(' + a.hue + ' var(--sat) var(--lum))" stroke-width="2"/>' +
    '<text x="95" y="80" text-anchor="middle" font-size="14" fill="hsl(' + a.hue + ' var(--sat) var(--lum))">' + esc(e.name) + '</text></g>' +
    '<g><rect x="20" y="52" width="150" height="46" rx="2" fill="none" stroke="hsl(' + a.hue + ' var(--sat) var(--lum))" stroke-width="2">' +
    '<animate attributeName="x" from="20" to="430" dur="' + dur + '" fill="freeze"/>' +
    '<animate attributeName="rx" from="2" to="23" dur="' + dur + '" fill="freeze"/>' +
    '<animate attributeName="fill" from="hsl(' + a.hue + ' var(--sat-soft) var(--lum-soft) / 0)" to="hsl(' + a.hue + ' var(--sat-soft) var(--lum-soft))" dur="' + dur + '" fill="freeze"/>' +
    '<animate attributeName="stroke-opacity" from="1" to="0" dur="' + dur + '" fill="freeze"/></rect>' +
    '<text x="95" y="80" text-anchor="middle" font-size="14" fill="hsl(' + a.hue + ' var(--sat) var(--lum))" opacity="0">' + esc(x.name) +
    '<animate attributeName="x" from="95" to="505" dur="' + dur + '" fill="freeze"/>' +
    '<animate attributeName="opacity" from="0" to="1" dur="' + dur + '" fill="freeze"/></text></g>' +
    '<text x="320" y="128" text-anchor="middle" font-size="13" fill="var(--ink-2)">' + esc(sentence) + '</text>' +
    '</svg></div>' +
    '<div class="cols">' +
    panel(esc(e.name) + ' · Essence', '<div class="fine">“' + esc(e.says) + '”</div>' + code(e.contract)) +
    panel(esc(x.name) + ' · Expression', '<div class="fine">“' + esc(x.says) + '”</div>' + code(x.contract)) +
    '</div>' +
    '<div class="note">Sharp and hollow is a definition. Round and filled is a live thing with contents, a lifetime and a scope. That single rule is also the accessibility floor: it survives greyscale and every form of colour-vision deficiency, so nothing critical on this page is carried by colour alone.</div>' +
    '</div>';
});

/* ── 5.3 The Flow ────────────────────────────────────────────────────────── */
AX.defineWrapper('wrapper.view.flow', '#view-flow', ['flow', 'step', 'playing', 'mistakes'], (s) => {
  const flow = IX.flow[s.flow];
  return '<div class="stack" data-wrapper="flow">' +
    '<div class="canvas-wrap">' + flowControls(s) + flowSVG(s) + flowCaption(s) + '</div>' +
    '<div class="cols-2">' +
    panel('Steps · ' + esc(flow.title), '<div class="spread" style="margin-bottom:8px"><span class="fine">Pipeline code:</span>' + btn('code.open', { topic: 'full_pipeline' }, '⟨/⟩ View Pipeline Code', { cls: 'btn-sm' }) + '</div>' + stepList(s) + '<div class="note" style="margin-top:8px">' + esc(flow.blurb) + '</div>') +
    panel('Reading the motion', '<table>' + MODEL.encoding.motion.map(m => '<tr><td class="k">' + esc(m.signal) + '</td><td>' + esc(m.means) + '</td></tr>').join('') + '</table>' +
      '<div class="note" style="margin-top:9px">Motion is an enhancement, never the content: <code>prefers-reduced-motion</code> collapses every flow to step-through with the same captions, and the step list beside it says the same thing in words.</div>') +
    '</div></div>';
});

/* ── 5.4 Break It ────────────────────────────────────────────────────────── */
AX.defineWrapper('wrapper.view.break', '#view-break', ['mistakes', 'step', 'flow', 'playing'], (s) => {
  const active = s.mistakes.map(m => IX.mistake[m]).filter(Boolean);
  const shown = active[active.length - 1];
  const toggles = MODEL.mistakes.map(m => {
    const on = s.mistakes.indexOf(m.id) >= 0;
    return '<label class="ck"><input type="checkbox" data-i="mistake.toggle" ' + P({ id: m.id }) + (on ? ' checked' : '') + '>' +
      '<span><b>' + esc(m.title) + '</b><div class="fine">breaks <span class="u-mono">' + esc(m.violates) + '</span> · corrupts <span class="u-mono">' + esc(m.corrupts) + '</span></div></span></label>';
  }).join('');
  const testPanel = shown ? panel('What happened to the test',
    '<div class="cols"><div><div class="bl-h" style="color:var(--ok)">before</div><div style="font-size:14px">' + esc(shown.testBefore) + '</div></div>' +
    '<div><div class="bl-h" style="color:var(--bad)">after</div><div style="font-size:14px">' + esc(shown.testAfter) + '</div></div></div>') : '';
  return '<div class="stack" data-wrapper="break">' +
    '<div class="cols-2">' +
    panel('Break a rule', toggles + '<div class="note" style="margin-top:10px">Each toggle is a <code>flowDiff</code> in the model — a patch on the canonical flow, not a second diagram. The pipeline stays; one edge changes.</div>') +
    panel('The same pipeline, patched', '<div class="canvas-wrap">' + flowSVG(s, { flowId: 'canonical' }) + '</div>') +
    '</div>' +
    (shown ? '<div class="panel" style="border-color:var(--bad)">' +
      '<div class="spread"><h4 style="margin:0">' + esc(shown.title) + '</h4>' + chip(IX.rule[shown.violates] ? IX.rule[shown.violates].source : '', 'bad') + '</div>' +
      '<p style="margin:8px 0 12px;color:var(--ink-2)">' + esc(shown.consequence) + '</p>' +
      '<div class="cols"><div><div class="bl-h" style="color:var(--bad)">wrong</div>' + code(shown.wrong, 'code-bad') + '</div>' +
      '<div><div class="bl-h" style="color:var(--ok)">right</div>' + code(shown.right, 'code-good') + '</div></div>' +
      '<div class="note" style="margin-top:10px">Rule broken — ' + esc((IX.rule[shown.violates] || {}).text || '') + '</div>' +
      '</div>' + testPanel
      : '<div class="note">Nothing is broken yet. Toggle one and watch the diagram, then the test.</div>') +
    '</div>';
});

/* ── 5.5 Start Small ─────────────────────────────────────────────────────── */
AX.defineWrapper('wrapper.view.profiles', '#view-profiles', ['profile', 'scenario'], (s) => {
  const order = ['lite', 'design', 'full'];
  const prof = IX.profile[s.profile];
  const lit = new Set(prof.components);
  const scenario = s.scenario ? MODEL.scenarios.find(x => x.id === s.scenario) : null;
  const set = scenario ? new Set(scenario.components) : lit;
  const hard = MODEL.rules.filter(r => /Lite Hard Rule/.test(r.source));
  const rows = MODEL.axes.slice().sort((a, b) => a.order - b.order).map(a => {
    const e = IX.comp[a.essence], x = IX.comp[a.expression];
    return '<div class="axis-row" style="--h:' + a.hue + '"><div class="axis-label"><b>' + esc(a.name) + '</b></div>' +
      cellHTML(e, s, { profileSet: set }) + cellHTML(x, s, { profileSet: set }) + '</div>';
  }).join('');
  const newly = MODEL.components.filter(c => set.has(c.id) && c.profile.lite !== 'core');
  return '<div class="stack" data-wrapper="profiles">' +
    '<div class="row"><span class="fine">profile:</span>' + seg('profile.set', order.map(p => [p, IX.profile[p].name]), s.profile) +
    '<span class="fine">or tell it what you are building:</span>' +
    '<select data-i="scenario.set" data-keep="scenario"><option value="">— pick a scenario —</option>' +
    MODEL.scenarios.map(sc => '<option value="' + sc.id + '"' + (s.scenario === sc.id ? ' selected' : '') + '>' + esc(sc.label) + '</option>').join('') + '</select></div>' +
    '<div class="cols-2">' +
    '<div class="grid-14">' + rows + '</div>' +
    '<div class="stack">' +
    panel(esc(prof.name) + ' — ' + esc(prof.tagline), '<div style="font-size:14px">' + esc(prof.blurb) + '</div>' +
      '<div class="bar" style="margin-top:10px"><i style="width:' + Math.round(set.size / 14 * 100) + '%"></i></div>' +
      '<div class="fine" style="margin-top:5px">' + set.size + ' of 14 components lit' + (scenario ? ' · ' + esc(scenario.label) : '') + '</div>' +
      (scenario ? '<div class="note" style="margin-top:8px">' + esc(scenario.note) + '</div>' : '')) +
    panel('The rules never relax', hard.map(r => '<div style="font-size:13.5px;margin-bottom:7px">• ' + esc(r.text) + '</div>').join('') +
      '<div class="note">Every hard rule holds at Lite. That is the trade: the ceremony is optional and the discipline is not.</div>') +
    '</div></div>' +
    (newly.length ? panel('Escalation triggers — why each of these arrived',
      '<div class="scroll-x"><table><tr><th>component</th><th>introduce it when…</th><th>you will feel it as</th></tr>' +
      newly.map(c => '<tr style="--h:' + hue(c) + '"><td class="k" style="color:' + col(c) + '">' + esc(c.name) + '</td><td>' + esc(c.profile.introduceWhen) + '</td><td class="fine">' + esc(c.feelTheAbsence) + '</td></tr>').join('') +
      '</table></div>') : '') +
    '</div>';
});
</script>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════════════════
   VIEWS — ACT III (two contexts) and ACT IV (the case)
   ══════════════════════════════════════════════════════════════════════════════ */

const transportLabel = (t) => t === 'worker' ? 'Web Worker' : t === 'inpage' ? 'in this process' : 'real HTTP';
const invoiceButtons = (s) => {
  // The buttons ARE the delegate keys of the currently selected Facet, printed.
  const facetKey = 'facet.invoice.' + (s.invoice.status || 'draft');
  const facet = R.get(facetKey) || { delegates: {} };
  const caps = Object.keys(facet.delegates);
  return '<div class="row">' + (caps.length ? caps.map(c =>
    btn('invoice.dispatch', { capability: c, amount: 100 }, esc(c), { cls: 'btn-sm' })).join('')
    : '<span class="fine">no capabilities — <span class="u-mono">' + facetKey + '</span> has an empty delegate map, and the empty map <i>is</i> the policy</span>') +
    '</div><div class="fine" style="margin-top:6px">selected Facet: <span class="u-mono">' + facetKey + '</span> · ' + esc(facet.describe || '') + '</div>';
};
const serverTrace = (s) => {
  const last = s.serverLog[s.serverLog.length - 1];
  if (!last) return '<div class="note">Nothing has crossed the boundary yet.</div>';
  return '<div class="trace">' + last.trace.map(t =>
    '<div><span class="t-t">#' + t.seq + '</span><span class="t-k">' + esc(t.kind) + '</span><span>' + esc(t.facet || '') + '</span>' +
    '<span class="t-a">' + esc(t.action || '—') + '</span><span class="t-e">[' + (t.effects || []).join(' ') + ']</span>' +
    '<span class="t-t">rev ' + t.rev + '</span>' + (t.rejected ? '<span style="color:var(--bad)">' + esc(t.rejected) + '</span>' : '') +
    (t.violations ? '<span style="color:var(--bad)">' + esc(t.violations.join(' · ')) + '</span>' : '') + '</div>').join('') +
    '</div><div class="fine" style="margin-top:6px">token minted server-side: <span class="u-mono">' + esc((last.trace[0] || {}).token || '—') + '</span></div>';
};

/* ── 5.6 Cross the Wire ──────────────────────────────────────────────────── */
AX.defineWrapper('wrapper.view.crosswire', '#view-crosswire', ['step', 'playing', 'invoice', 'serverLog', 'transport', 'flow'], (s) => {
  const st = Object.assign({}, s, { flow: 'crosswire' });
  const bnd = (AX.managers.server || {}).boundary || {};
  return '<div class="stack" data-wrapper="crosswire">' +
    '<div class="canvas-wrap">' + flowControls(st, { flowId: 'crosswire', hideSelect: true }) + flowSVG(st, { flowId: 'crosswire' }) + flowCaption(st, { flowId: 'crosswire' }) + '</div>' +
    '<div class="cols-2">' +
    panel('Run it for real', '<div class="fine" style="margin-bottom:8px">This is not the animation. These buttons dispatch a real Intent into the client Manager, which declares an Effect, which one Impact carries to the server context — currently <b>' + esc(transportLabel(s.transport)) + '</b>.</div>' +
      invoiceButtons(s) +
      '<div class="row" style="margin-top:10px">' +
      btn('invoice.dispatch', { capability: 'invoice.send', failMail: true }, 'send, but the mail fails', { cls: 'btn-sm' }) +
      btn('invoice.dispatch', { capability: 'invoice.discount', amount: 200, breakBond: true }, 'discount that breaks the Bond', { cls: 'btn-sm', title: 'needs the capability wired in 5.9 first — until then the Facet has no delegate and the Manager refuses it' }) +
      btn('invoice.reset', {}, '↺ reset the aggregate', { cls: 'btn-sm', title: 'a test fixture, not a domain capability' }) +
      '</div>' +
      '<div class="stack" style="margin-top:12px"><div class="row"><span class="chip">status <b style="margin-left:4px">' + esc(s.invoice.status) + '</b></span>' +
      '<span class="chip">total ' + esc(String(s.invoice.total)) + '</span>' +
      (s.invoice.discount ? '<span class="chip">discount ' + esc(String(s.invoice.discount)) + '</span>' : '') +
      (s.invoice.lastOutcome ? '<span class="chip" data-tone="ok">' + esc(s.invoice.lastOutcome) + '</span>' : '') + '</div></div>') +
    panel('What the far side did', serverTrace(s)) +
    '</div>' +
    '<div class="cols-2">' +
    panel('The server Manager\'s boundary contract', '<table>' +
      Object.entries(bnd).map(([k, v]) => '<tr><td class="k">' + esc(k.replace(/([A-Z])/g, ' $1').toLowerCase()) + '</td><td>' + esc(v) + '</td></tr>').join('') +
      '</table><div class="note" style="margin-top:8px">Five fields. If those five are not clear, the boundary is not clear — and those same five fields are exactly what a nesting/packaging manifest would need (critique 12.8).</div>') +
    panel('The payoff frame', '<div style="font-size:14.5px">Step 5. The <b>server Adapter</b> normalizes the arriving message into a <i>different</i> Intent, in the server\'s own vocabulary — the same semantic operation, normalized twice, at two different edges.</div>' +
      code("// client\nAX.intent('invoice.send','invoice.dispatch',{…})\n\n// server — a different vocabulary, on purpose\nAX.adapter('adapter.server.request', (msg) =>\n  AX.intent('server.' + msg.payload.capability,\n            msg.payload.capability, {…},\n            { rawAuth: msg.rawAuth, wrapperCtx: 'wrapper.server.port' }))") +
      '<div class="note">That is the clearest justification Adapters will ever get, and it is invisible in any single-runtime example.</div>') +
    '</div></div>';
});

/* ── 5.7 The Server's Own Grid ───────────────────────────────────────────── */
AX.defineWrapper('wrapper.view.servergrid', '#view-servergrid', ['transport', 'toast', 'serverLog'], (s) => {
  const w = AX.worker;
  const pageHash = AX.serverCodeHash();
  const match = w.hash && w.hash === pageHash;
  const rows = MODEL.components.map(c =>
    '<tr style="--h:' + hue(c) + (c.id === 'action' ? ';background:color-mix(in oklab,var(--ok) 12%,transparent)' : '') + '">' +
    '<td class="k" style="color:' + col(c) + '">' + esc(c.name) + (c.id === 'action' ? ' ★' : '') + '</td><td>' + esc(c.browser) + '</td><td>' + esc(c.server) + '</td></tr>').join('');
  return '<div class="stack" data-wrapper="servergrid">' +
    '<div class="scroll-x">' + panel('Same fourteen names, different flesh',
      '<table><tr><th>component</th><th>in the browser</th><th>on the server</th></tr>' + rows + '</table>' +
      '<div class="note" style="margin-top:9px">Look at the <b>Action</b> row: <i>identical</i>. Not similar — the same signature, the same purity rule, and in this page literally the same source text, running in two hosts.</div>') + '</div>' +
    '<div class="cols-2">' +
    panel('The transport toggle', '<div class="row">' +
      seg('transport.set', [['worker', 'Web Worker'], ['inpage', 'in-page'], ['http', 'real HTTP — no endpoint', 'this file ships with no server, so the position is disabled rather than faked. Point it at the optional Node host built from the same modules and it lights up.']], s.transport) +
      '</div>' +
      '<div class="note" style="margin-top:10px">Flip it and run 5.6 again. <b>The diagram does not change.</b> Not one node, not one edge, not one label. The only thing that differs is which Impact handler carries the message — which is the meta-architecture claim demonstrated instead of asserted.</div>' +
      '<div class="stack" style="margin-top:10px">' +
      '<div class="row"><span class="chip" data-tone="' + (w.ready ? 'ok' : 'warn') + '">worker ' + (w.ready ? 'up' : (w.error ? 'unavailable' : 'starting…')) + '</span>' +
      (w.error ? '<span class="fine">' + esc(w.error) + ' — degraded to in-page, honestly labelled</span>' : '') +
      '<span class="chip">' + (w.keys || 0) + ' keys in the worker registry</span></div></div>') +
    panel('The evidence: what each host actually loaded',
      '<div class="stack">' +
      '<div class="keyline" style="--h:155"><b>page</b><span>' + esc(pageHash) + '</span></div>' +
      '<div class="keyline" style="--h:155"><b>worker</b><span>' + esc(w.hash || '—') + '</span></div>' +
      '<div class="row">' + (w.hash ? (match ? chip('identical — same Actions, same Bond, same Form, two runtimes', 'ok') : chip('DIFFERENT — the two hosts are not running the same code', 'bad')) : chip('waiting for the worker', 'warn')) + '</div>' +
      '<div class="note">Both numbers are a hash of the <i>source text</i> of <code>action.invoice.send</code>, <code>action.invoice.pay</code>, <code>action.invoice.discount</code>, <code>action.invoice.revert</code>, <code>form.invoice</code>, <code>bond.invoice.lineItems</code> and two Facets, as loaded by that host. The Worker is built from this file\'s own <code>&lt;script id="axis-server-domain"&gt;</code> element plus the kernel — ' + esc(String(w.srcChars || 0)) + ' characters, imported not copied.</div>' +
      '<div class="note">This is the part of the transport claim that can be <i>checked</i> rather than believed, which is why it is here rather than in a paragraph.</div>' +
      '</div>') +
    '</div></div>';
});

/* ── 5.8 When It Fails At Distance ───────────────────────────────────────── */
AX.defineWrapper('wrapper.view.saga', '#view-saga', ['step', 'playing', 'serverLog', 'invoice', 'flow'], (s) => {
  const st = Object.assign({}, s, { flow: 'failure' });
  const last = s.serverLog[s.serverLog.length - 1];
  return '<div class="stack" data-wrapper="saga">' +
    '<div class="canvas-wrap">' + flowControls(st, { flowId: 'failure', hideSelect: true }) + flowSVG(st, { flowId: 'failure' }) + flowCaption(st, { flowId: 'failure' }) + '</div>' +
    '<div class="cols-2">' +
    panel('Fail it for real', '<div class="fine" style="margin-bottom:9px">Send the invoice with a mail server that refuses. Watch three attempts with exponential backoff, then the compensating Effect, then a follow-up Intent routed by the <i>current</i> lifecycle Facet — which by then is <code>facet.invoice.sent</code>, not the one that started it.</div>' +
      '<div class="row">' + btn('invoice.dispatch', { capability: 'invoice.send', failMail: true }, 'send · mail will fail') +
      btn('invoice.dispatch', { capability: 'invoice.send' }, 'send · mail will work', { cls: 'btn-sm' }) +
      btn('invoice.reset', {}, '↺ reset', { cls: 'btn-sm' }) + '</div>' +
      (last ? '<div class="stack" style="margin-top:12px">' +
        '<div class="row">' + (last.ok ? chip('ok', 'ok') : chip('refused', 'bad')) +
        '<span class="fine">' + esc(last.summary) + '</span></div>' +
        '<div class="fine">status is now <b>' + esc(s.invoice.status) + '</b>' + (s.invoice.lastError ? ' · ' + esc(String(s.invoice.lastError)) : '') + '</div>' +
        '<div class="fine">history: ' + esc((s.invoice.history || []).join(' → ') || '—') + '</div></div>' : '') +
      '<div style="margin-top:12px">' + code("effects: [{\n  kind: 'EMAIL_SEND',\n  target: customer.email,\n  retryPolicy: { maxRetries: 2, backoff: 'exponential' },\n  compensatingEffect: { kind: 'REVERT_STATUS', payload: { to: 'draft' } }\n}]", 'code-good') + '</div>') +
    panel('The uncomfortable frames', '<div class="stack">' +
      '<div><b style="font-size:14px">The compensating Effect itself fails.</b><div class="note">Then it dead-letters, and a human is involved. AXIS does not make that case disappear; it makes it a named path with a name you can search for.</div></div>' +
      '<div><b style="font-size:14px">The follow-up Intent arrives twice.</b><div class="note">This is why <code>Intent.meta</code> carries a correlation ID by design — and why idempotency remains a real design obligation that AXIS does not remove.</div></div>' +
      '<div><b style="font-size:14px">Client and server Instances disagree.</b><div class="note">They do, for a window. Committed versus working state is a distinction AXIS names rather than hides: the client\'s Instance is optimistic until the follow-up Intent lands.</div></div>' +
      '<div class="note" style="border-top:1px solid var(--rule);padding-top:9px">And the demo\'s own limits: this Worker has no persistence, no partition, no clock skew. It shows structure, not operational behaviour.</div>' +
      '</div>') +
    '</div></div>';
});

/* ── 5.9 Composition by Key — the studio ─────────────────────────────────── */
AX.defineWrapper('wrapper.view.studio', '#view-studio', ['studio', 'audit', 'invoice', 'serverLog', 'showKeys'], (s) => {
  const st = s.studio;
  const facet = R.get(st.facet) || { delegates: {} };
  const wired = Object.prototype.hasOwnProperty.call(facet.delegates, st.capability);
  const actionKeys = R.byComponent('action').map(e => e.key).filter(k => k.indexOf('action.invoice.') === 0);
  const facetKeys = R.byComponent('facet').map(e => e.key).filter(k => k.indexOf('facet.invoice.') === 0);
  const a = s.audit;
  const keySpace = '<div class="stack">' +
    Object.entries(facet.delegates).map(([cap, act]) => '<div class="keyline" style="--h:275"><b>' + esc(cap) + '</b><span>→</span><span class="u-mono">' + esc(act) + '</span>' +
      '<span class="fine">declares [' + esc(((R.entry(act) || { meta: {} }).meta.declares || []).join(', ')) + ']</span></div>').join('') +
    (Object.keys(facet.delegates).length ? '' : '<div class="fine">empty</div>') + '</div>';
  const auditBlock = a ? (() => {
    const r = a.server;
    const line = (label, arr, fmt) => '<div class="row" style="align-items:flex-start"><span class="chip" data-tone="' + (arr.length ? 'bad' : 'ok') + '">' + label + ' ' + arr.length + '</span>' +
      (arr.length ? '<span class="fine">' + arr.map(fmt).map(esc).join(' · ') + '</span>' : '') + '</div>';
    return '<div class="stack">' +
      '<div class="row">' + (r.ok ? chip('audition passed', 'ok') : chip('audition FAILED — bind() would refuse to complete', 'bad')) +
      '<span class="fine">checked ' + r.checked.facets + ' facets, ' + r.checked.actions + ' reachable actions, ' + r.checked.handlers + ' handlers</span></div>' +
      line('missing handlers', r.missingHandlers, x => x.action + ' declares ' + x.kind) +
      line('unresolved capabilities', r.unresolvedCapabilities, x => x.facet + '[' + x.capability + '] → ' + x.target) +
      line('orphaned facets', r.orphanedFacets, x => x) +
      line('dangling links', r.danglingLinks, x => x.action + ' needs ' + x.link) +
      '<div class="note">Composition-time validation is exactly the Composer\'s job description; it just was not specified. Call it the audition: find out who is off key before the audience arrives, not during the performance.</div>' +
      (a.model && a.model.drift && a.model.drift.length ? '<div class="note" style="color:var(--warn)">model drift: ' + a.model.drift.map(esc).join(' · ') + '</div>' : '<div class="fine">no drift between the model\'s claims about this page and the running registry.</div>') +
      '</div>';
  })() : '<div class="note">Not run yet. The button below is a <b>two-pass read</b> over this page\'s own runtime — Action declares AUDIT, Impact reads the registry, the result re-enters as a follow-up Intent. Watch it in the Intent log in 5.15.</div>';

  return '<div class="stack" data-wrapper="studio">' +
    '<div class="cols-2">' +
    panel('Compose a capability, by key', '<div class="stack">' +
      '<label class="fine">capability<input type="text" value="' + esc(st.capability) + '" data-i="studio.set" ' + P({ field: 'capability' }) + ' data-keep="cap"></label>' +
      '<label class="fine">into Facet<select data-i="studio.set" ' + P({ field: 'facet' }) + '>' + facetKeys.map(k => '<option' + (k === st.facet ? ' selected' : '') + '>' + esc(k) + '</option>').join('') + '</select></label>' +
      '<label class="fine">delegating to Action<select data-i="studio.set" ' + P({ field: 'action' }) + '>' + actionKeys.map(k => '<option' + (k === st.action ? ' selected' : '') + '>' + esc(k) + '</option>').join('') + '</select></label>' +
      '<div class="fine">that Action declares <span class="u-mono">' + esc((((R.entry(st.action) || { meta: {} }).meta.declares) || []).join(', ')) + '</span></div>' +
      '<div class="row">' + btn('studio.wire', {}, wired ? '✓ wired' : 'wire it', { disabled: wired }) + btn('studio.unwire', {}, 'unwire', { disabled: !wired, cls: 'btn-sm' }) +
      btn('studio.unbindHandler', {}, st.handlerBound ? 'unbind the ' + esc(st.effect) + ' handler' : 'rebind the ' + esc(st.effect) + ' handler',
        { cls: 'btn-sm', pressed: !st.handlerBound, title: 'critique 12.9: remove a handler and re-run the audition — it fails at bind(), not at dispatch()' }) + '</div>' +
      '<div class="note">Nothing was imported, compiled or reloaded. A capability is an entry in a key space — which is why a model can write one, and a validator can check it before the first Intent flows.</div>' +
      '<div class="spread" style="margin-top:10px"><span class="fine">Manager architecture:</span>' + btn('code.open', { topic: 'manager' }, '⟨/⟩ View Manager & Composer Code', { cls: 'btn-sm' }) + '</div>' +
      '</div>') +
    panel('The live key space of ' + esc(st.facet), keySpace +
      '<div style="margin-top:12px" class="bl-h">the running system, right now</div>' + invoiceButtons(s) +
      '<div class="note" style="margin-top:8px">Those buttons are generated from the delegate map above. Wire the capability and one appears; unwire it and it is gone — and in both cases the page never learned a new word.</div>') +
    '</div>' +
    '<div class="cols-2">' +
    panel('Composer.audition() — the fix for critique 12.9', auditBlock + '<div class="row" style="margin-top:10px">' + btn('audit.run', {}, 'run the audition') + '</div>') +
    panel('What an agent gets', '<div class="note" style="margin-bottom:9px">' + esc(MODEL.generationUnits.lead) + '</div>' +
      '<table>' + MODEL.generationUnits.units.map(u => '<tr><td class="k">' + esc(u[0]) + '</td><td>' + esc(u[1]) + '</td></tr>').join('') + '</table>' +
      '<div style="margin-top:10px">' + code('// the generation contract for ONE keyed unit\n{\n  "unit":      "axis.action",\n  "key":       "' + st.action + '",\n  "signature": "(state, intent) → { delta, effects[] }",\n  "mayDeclare":' + JSON.stringify(((R.entry(st.action) || { meta: {} }).meta.declares) || []) + ',\n  "mustNot":   ["IO", "traversal", "clock", "randomness"],\n  "boundTo":   { "facet": "' + st.facet + '", "capability": "' + st.capability + '" },\n  "validate":  "Composer.audition() at bind()"\n}') + '</div>' +
      '<div class="note">' + esc(MODEL.generationUnits.split) + '</div>') +
    '</div>' +
    baselineHTML('wiring-by-import') +
    '</div>';
});

/* ── 5.10 You Already Do This ────────────────────────────────────────────── */
AX.defineWrapper('wrapper.view.lineage', '#view-lineage', ['lineage'], (s) => {
  const L = MODEL.lineage.find(x => x.id === s.lineage) || MODEL.lineage[0];
  const gaps = L.gaps.map(g => IX.comp[g]).filter(Boolean);
  return '<div class="stack" data-wrapper="lineage">' +
    '<div class="row">' + seg('lineage.set', MODEL.lineage.map(l => [l.id, l.name]), L.id) + '</div>' +
    '<div class="cols-2">' +
    panel(esc(L.name) + ' → AXIS', '<div class="scroll-x"><table><tr><th>' + esc(L.name) + '</th><th>essence</th><th>expression</th><th>what changed</th></tr>' +
      L.rows.map(r => '<tr><td class="k">' + esc(r.theirs) + '</td>' +
        '<td>' + (r.essence ? '<span class="chip" style="border-color:' + col(IX.comp[r.essence]) + ';color:' + col(IX.comp[r.essence]) + '">' + esc(IX.comp[r.essence].name) + '</span>' : '<span class="fine">—</span>') + '</td>' +
        '<td>' + (r.expression ? '<span class="chip" style="background:' + softCol(IX.comp[r.expression]) + ';color:' + col(IX.comp[r.expression]) + ';border:0">' + esc(IX.comp[r.expression].name) + '</span>' : '<span class="fine">—</span>') + '</td>' +
        '<td>' + esc(r.changed) + '</td></tr>').join('') + '</table></div>' +
      '<div class="note" style="margin-top:9px">' + esc(L.note) + '</div>') +
    panel('The cells ' + esc(L.name) + ' never had', '<div class="grid-14" style="grid-template-columns:1fr 1fr">' +
      gaps.map(c => cellHTML(c, s)).join('') + '</div>' +
      '<div class="note" style="margin-top:9px">' + gaps.length + ' of 14. Those are not missing features — they are seams that pattern leaves to convention, which is another way of saying to memory.</div>') +
    '</div>' +
    panel('False friends — the most dangerous table on this page',
      '<div class="scroll-x"><table><tr><th>you know</th><th>you will think it means</th><th>in AXIS it is actually</th><th>why</th></tr>' +
      MODEL.falseFriends.map(f => '<tr><td class="k">' + esc(f.know) + '</td><td class="fine">' + esc(f.think) + '</td><td class="k" style="color:var(--warn)">' + esc(f.actually) + '</td><td>' + esc(f.why) + '</td></tr>').join('') +
      '</table></div><div class="note" style="margin-top:9px">Renaming is not on the table this late, so disambiguating loudly is the entire mitigation. Critique 12.5 concedes this without argument.</div>') +
    '</div>';
});

/* ── 5.11 Your Code ──────────────────────────────────────────────────────── */
AX.defineWrapper('wrapper.view.rolemap', '#view-rolemap', ['roleMap'], (s) => {
  const maps = s.roleMap ? (Array.isArray(s.roleMap) ? s.roleMap : [s.roleMap]) : [];
  const byComp = {};
  maps.forEach(m => {
    const prim = String(m.primaryAxisRole || '').toLowerCase();
    (byComp[prim] = byComp[prim] || []).push({ m, kind: 'primary' });
    (m.secondaryAxisRoles || []).forEach(r => (byComp[String(r).toLowerCase()] = byComp[String(r).toLowerCase()] || []).push({ m, kind: 'secondary' }));
  });
  const rows = MODEL.axes.slice().sort((a, b) => a.order - b.order).map(a => {
    const cells = [a.essence, a.expression].map(id => {
      const c = IX.comp[id], hits = byComp[id] || [];
      const mixed = hits.some(h => h.kind === 'secondary');
      const low = hits.some(h => h.m.confidence === 'low');
      return '<div class="cell" ' + hstyle(c) + ' data-pole="' + c.pole + '" data-dim="' + (!hits.length) + '"' +
        (hits.length ? ' style="--h:' + hue(c) + ';' + (low ? 'background-image:repeating-linear-gradient(45deg,transparent,transparent 4px,rgba(255,255,255,.08) 4px,rgba(255,255,255,.08) 8px);' : '') +
          (mixed ? 'border-style:dashed;' : '') + '"' : '') + '>' +
        '<span class="cname">' + esc(c.name) + '</span>' +
        (hits.length ? hits.map(h => '<span class="cone u-mono">' + esc(h.m.nativeName) + (h.kind === 'secondary' ? ' (secondary)' : '') + (h.m.confidence === 'low' ? ' · low confidence' : '') + '</span>').join('') : '<span class="cone">—</span>') +
        '</div>';
    }).join('');
    return '<div class="axis-row" style="--h:' + a.hue + '"><div class="axis-label"><b>' + esc(a.name) + '</b></div>' + cells + '</div>';
  }).join('');
  return '<div class="stack" data-wrapper="rolemap">' +
    '<div class="cols-2">' +
    panel('Paste an AXIS role map', '<textarea data-i="rolemap.load" data-keep="rolemap" rows="12" style="width:100%;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--bg-3);color:var(--ink);border:1px solid var(--rule-2);border-radius:8px;padding:10px">' +
      esc(JSON.stringify([MODEL.roleMapSample], null, 2)) + '</textarea>' +
      '<div class="fine" style="margin-top:6px">An object or an array. Produced by <code>CodeMaps/axis-shape.prompt.md</code>; the schema is in <code>AXIS-Code.md</code>. Edit it and the grid below re-reads on blur.</div>' +
      '<div class="note" style="margin-top:8px">Dashed border = the component also holds a secondary role (it is mixed, and the map says so rather than forcing it into one clean category). Hatched = low confidence.</div>') +
    '<div class="grid-14">' + rows + '</div>' +
    '</div>' +
    (maps.length ? panel('What the map says to do about it', maps.map(m => '<div style="margin-bottom:12px"><div class="keyline" style="--h:190"><b>' + esc(m.nativeName) + '</b><span class="fine">' + esc((m.paths || []).join(', ')) + '</span></div>' +
      '<div class="fine" style="margin-top:4px">evidence: ' + esc((m.evidence || []).join(' · ')) + '</div>' +
      (m.boundaryNotes ? '<div class="fine">boundary: ' + esc(m.boundaryNotes.join(' · ')) + '</div>' : '') +
      ((m.recompositionNotes || []).length ? '<ul style="margin:6px 0 0;padding-left:18px">' + m.recompositionNotes.map(r => '<li style="font-size:13.5px;color:var(--ink-2)">' + esc(r) + '</li>').join('') + '</ul>' : '') +
      '</div>').join('')) : '') +
    '</div>';
});
</script>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════════════════
   VIEWS — ACT V: the cross-examination, what AXIS forbids, when it is too much,
   and the page's own AXIS.
   ══════════════════════════════════════════════════════════════════════════════ */

/* ── 5.12 The Cross-Examination ──────────────────────────────────────────── */
const demoLink = (d) => {
  if (!d) return '';
  const [k, v] = d.indexOf(':') > 0 ? [d.slice(0, d.indexOf(':')), d.slice(d.indexOf(':') + 1)] : [d, null];
  const map = {
    lineage: ['lineage.set', { id: v }, 'show it in 5.10'],
    profile: ['profile.set', { id: v }, 'show it in 5.5'],
    mistake: ['mistake.toggle', { id: v }, 'break it in 5.4'],
    flow: ['flow.select', { id: v }, 'run that flow'],
    goto: ['tutorial.goto', { id: v }, 'go to ' + v],
    replay: ['replay.run', {}, 'replay this session'],
    lint: ['lint.run', {}, 'run axis-lint on this page'],
    audition: ['audit.run', {}, 'run the audition'],
    cardinality: ['grid.cardinality', {}, 'show pairing cardinality'],
    manager: ['manager.open', {}, 'open the Manager up'],
    fifteenth: ['fifteenth.toggle', {}, 'name the candidates'],
    nesting: ['nesting.toggle', {}, 'show this page\'s nested subsystem'],
    selfview: ['tutorial.goto', { id: '5.15' }, 'check it in 5.15']
  };
  const m = map[k];
  return m ? btn(m[0], m[1], m[2], { cls: 'btn-sm' }) : '';
};

AX.defineWrapper('wrapper.view.critique', '#view-critique', ['critique', 'managerOpen', 'fifteenth', 'nesting', 'cardinality', 'lint', 'audit', 'replay'], (s) => {
  const card = (o, isObjection) => {
    const open = s.critique === o.id;
    return '<div class="panel" style="border-color:' + (open ? 'var(--rule-2)' : 'var(--rule)') + '">' +
      '<div class="spread" style="cursor:pointer" data-i="critique.open" ' + P({ id: o.id }) + '>' +
      '<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">' +
      '<span class="m-num">' + esc(o.id) + '</span>' +
      '<b style="font-size:15px">“' + esc(o.title || o.claim) + '”</b></div>' +
      '<div class="row">' + (o.severity ? '<span class="sev" data-s="' + o.severity + '">' + o.severity + '</span>' : '') +
      (o.verdict ? '<span class="verdict" data-v="' + o.verdict + '">' + esc(o.verdict === 'Gap' ? 'genuine gap' : o.verdict) + '</span>' : '<span class="verdict" data-v="Concede">answered + conceded</span>') +
      '<span class="fine">' + (open ? '▾' : '▸') + '</span></div></div>' +
      (open ? '<div style="margin-top:12px">' +
        (o.critique ? '<div class="bl-h">the critique</div><p style="color:var(--ink-2);font-size:14.5px">' + esc(o.critique) + '</p>' : '') +
        '<div class="bl-h" style="color:var(--ok)">the response</div><p style="font-size:14.5px">' + esc(o.response || o.answer) + '</p>' +
        (o.concession ? '<div class="panel not" style="background:var(--bg-3)"><div class="bl-h" style="color:var(--warn)">the concession</div><div style="font-size:14px">' + esc(o.concession) + '</div></div>' : '') +
        (o.changes ? '<div class="note" style="margin-top:9px"><b>What changes:</b> ' + esc(o.changes) + '</div>' : '') +
        '<div class="row" style="margin-top:10px">' + demoLink(o.demo) + (o.where ? demoLink('goto:' + o.where) : '') + '</div>' +
        '</div>' : '') +
      '</div>';
  };
  const M = AX.managers.client, SM = AX.managers.server;
  const managerPanel = s.managerOpen ? panel('The Manager, opened up (critique 12.2)',
    '<div class="cols">' +
    '<div><div class="bl-h">seven responsibilities in one named place</div>' +
    (IX.comp.manager.responsibilities || []).map(r => '<div style="font-size:13.5px;margin:3px 0">• ' + esc(r) + '</div>').join('') + '</div>' +
    '<div><div class="bl-h">…decomposed, in code</div>' +
    (IX.comp.manager.decomposition || []).map(r => '<div class="u-mono" style="font-size:12.5px;margin:3px 0">' + esc(r) + '</div>').join('') +
    '<div class="note" style="margin-top:8px">In this page those four are <code>M.composer</code>, <code>M.conductor</code>, <code>M.committer</code> and <code>M.policy</code> — four objects on one Manager, so the seams are visible without pretending they are separate components.</div></div></div>' +
    '<div class="note" style="margin-top:10px">The honest claim is not "one responsibility". It is: <b>the Manager is the only component permitted more than one, and therefore the only one you must read carefully.</b> Compare a kernel. And principle #8 should say so out loud — a stated exception is a design decision; an unstated one is a hole.</div>') : '';
  const fifteenthPanel = s.fifteenth ? panel('The candidate fifteenth axis (critique 12.11)',
    MODEL.fifteenth.map(f => '<div style="margin-bottom:11px"><b style="font-size:14.5px">' + esc(f.name) + '</b>' +
      '<div class="fine" style="margin:3px 0">' + esc(f.case) + '</div>' +
      '<div style="font-size:13.5px;color:var(--ink-2)">→ ' + esc(f.verdict) + '</div></div>').join('') +
    '<div class="note">Relating slotted in without restructuring the other twelve — that is evidence the framework extends along its own logic. But saying “we think the answer is no, and here is why for each” is far more credible than implying the question never came up.</div>') : '';
  const nestingPanel = s.nesting ? panel('The nesting story, such as it is (critique 12.8)',
    '<div style="font-size:14.5px;margin-bottom:9px">A nested subsystem is <b>a Wrapper from the outside and a full AXIS composition inside</b>. This page contains exactly one instance of that, and here it is:</div>' +
    '<div class="scroll-x"><table><tr><th>from the parent</th><th>inside</th></tr>' +
    '<tr><td class="k">wrapper.server.port</td><td>a Manager, a Form, a Bond, a Link, four Facets, five Actions, three Impacts</td></tr>' +
    '<tr><td class="k">SEND_TO_SERVER (an Effect)</td><td>an Intent, normalized by the child\'s own Adapter</td></tr>' +
    '<tr><td class="k">a follow-up Intent</td><td>the child\'s outcome, surfaced to the parent</td></tr></table></div>' +
    '<div class="note" style="margin-top:9px">The Manager boundary contract — owned state, accepted intents, emitted effects, returned outcomes, policy scope — <i>is</i> a component manifest. That is the direction. It is not a specification, and calling it one would be the dishonest version of this panel.</div>') : '';
  return '<div class="stack" data-wrapper="critique">' +
    panel('Six objections to this page (§11)', '<div class="stack">' + MODEL.objections.map(o => card(o, true)).join('') + '</div>') +
    panel('Twelve critiques of the architecture (§12)',
      '<div class="row" style="margin-bottom:10px">' +
      chip(MODEL.critiques.filter(c => c.verdict === 'Gap').length + ' genuine gaps', 'bad') +
      chip(MODEL.critiques.filter(c => c.verdict === 'Concede').length + ' conceded', 'warn') +
      chip(MODEL.critiques.filter(c => c.verdict === 'Partly concede').length + ' partly conceded', 'warn') +
      chip(MODEL.critiques.filter(c => c.verdict === 'Reject').length + ' rejected — with an argument', 'ok') + '</div>' +
      '<div class="stack">' + MODEL.critiques.map(c => card(c, false)).join('') + '</div>') +
    managerPanel + fifteenthPanel + nestingPanel +
    '<div class="note">None of the twelve threaten the core: Essence/Expression, effects-as-data, and one owner per boundary all survive the hardest reading available. A page that publishes this list is more persuasive than one that waits to be handed it.</div>' +
    '</div>';
});

/* ── 5.13 What AXIS Says Is Wrong ────────────────────────────────────────── */
AX.defineWrapper('wrapper.view.forbids', '#view-forbids', ['critique'], (s) => {
  const F = MODEL.forbids;
  const entry = (e) => '<details' + (s.critique === e.id ? ' open' : '') + ' data-keep="fb-' + e.id + '">' +
    '<summary>' + esc(e.name) + ' <span class="chip" data-tone="bad">' + esc(e.violates.map(v => (IX.axis[v] || { name: v }).name).join(' + ')) + '</span></summary>' +
    '<div style="margin-top:10px" class="stack">' +
    '<div><div class="bl-h">what it does</div><div style="font-size:14px">' + esc(e.does) + '</div></div>' +
    '<div><div class="bl-h" style="color:var(--ok)">the strongest case for it</div><div style="font-size:14px;color:var(--ink-2)">' + esc(e.strongestCase) + '</div></div>' +
    (e.conflations ? '<table>' + e.conflations.map(c => '<tr><td class="k">' + esc(c[0]) + '</td><td>' + esc(c[1]) + '</td></tr>').join('') + '</table>' : '') +
    '<div><div class="bl-h">why AXIS says it is wrong</div><div style="font-size:14px">' + esc(e.why) + '</div></div>' +
    (e.limit ? '<div class="panel"><div class="bl-h" style="color:var(--warn)">the important limit</div><div style="font-size:14px">' + esc(e.limit) + '</div></div>' : '') +
    '<div class="panel not"><div class="bl-h" style="color:var(--warn)">the threshold</div><div style="font-size:14px">' + esc(e.threshold) + '</div></div>' +
    (e.instead ? '<div><div class="bl-h" style="color:var(--ok)">instead</div><div style="font-size:14px">' + esc(e.instead) + '</div></div>' : '') +
    (e.notFringe ? '<div class="note">' + esc(e.notFringe) + '</div>' : '') +
    '</div></details>';
  return '<div class="stack" data-wrapper="forbids">' +
    panel('The standard for inclusion', '<ol style="margin:0;padding-left:20px">' + F.standard.map(x => '<li style="font-size:14px;margin:5px 0;color:var(--ink-2)">' + esc(x) + '</li>').join('') + '</ol>' +
      '<div class="note" style="margin-top:9px">Test 3 is what makes this list debatable in good faith: anyone who disagrees can attack the threshold rather than the doctrine, and that is a far more useful argument to have.</div>') +
    '<div class="stack">' + F.entries.map(entry).join('') + '</div>' +
    '<div class="panel" style="border-color:var(--bad)">' +
    '<div class="spread"><h4 style="margin:0;color:var(--bad)">The entry that indicts AXIS</h4>' + chip('published before anyone found it', 'bad') + '</div>' +
    '<div style="font-size:15px;font-weight:600;margin:8px 0 4px">' + esc(F.selfIndictment.name) + '</div>' +
    '<div style="font-size:14px;color:var(--ink-2)">' + esc(F.selfIndictment.does) + '</div>' +
    '<div class="panel" style="margin-top:10px"><div class="bl-h" style="color:var(--bad)">the admission</div><div style="font-size:14px">' + esc(F.selfIndictment.admission) + '</div></div>' +
    '<div class="note" style="margin-top:9px"><b>The fix:</b> ' + esc(F.selfIndictment.fix) + '</div>' +
    '<div class="row" style="margin-top:9px">' + btn('tutorial.goto', { id: '5.9' }, 'go unbind a handler') + btn('audit.run', {}, 'run the audition', { cls: 'btn-sm' }) + '</div>' +
    '<div class="note" style="margin-top:9px">' + esc(F.selfIndictment.why) + '</div>' +
    '</div>' +
    panel('What this section is not', F.notThis.map(x => '<div style="font-size:14px;margin:6px 0;color:var(--ink-2)">• ' + esc(x) + '</div>').join('')) +
    '</div>';
});

/* ── 5.14 When AXIS Is Too Much ──────────────────────────────────────────── */
AX.defineWrapper('wrapper.view.ensemble', '#view-ensemble', ['ensemble', 'profile'], (s) => {
  const E = MODEL.ensemble;
  const n = s.ensemble.length;
  const verdict = n >= 2
    ? { tone: 'ok', text: 'You are already running an ensemble large enough to need a score — and you are almost certainly paying that cost in an unnamed form right now. Start Lite.' }
    : n === 1
      ? { tone: 'warn', text: 'One signal. Watch it. One is the point where people usually add structure too early, and also the point where they add it too late; the difference is whether the second signal is coming.' }
      : { tone: 'bad', text: 'No signals. Then no — do not adopt AXIS. Play the notes.' };
  const rows = E.rows.map((r, i) => '<tr><td class="k">' + esc(r.size) + '</td><td>' + esc(r.eng) + '</td><td><b>' + esc(r.need) + '</b><div class="fine">' + r.components.length + ' components</div></td><td class="fine">' + esc(r.threshold) + '</td></tr>').join('');
  return '<div class="stack" data-wrapper="ensemble">' +
    '<div class="lede" style="font-style:italic;font-size:19px">“' + esc(E.epigraph) + '”</div>' +
    '<div class="scroll-x">' + panel('Ensemble size is the real variable',
      '<table><tr><th>ensemble</th><th>engineering equivalent</th><th>AXIS you need</th><th>the threshold you just crossed</th></tr>' + rows + '</table>') + '</div>' +
    '<div class="cols-2">' +
    panel('The quartet is the instructive case', '<div style="font-size:14.5px">' + esc(E.quartet) + '</div>' +
      '<div class="panel" style="margin-top:11px"><div style="font-size:14.5px">' + esc(E.conductor) + '</div></div>' +
      '<div class="note" style="margin-top:9px">' + esc(E.bothWays) + '</div>') +
    panel('Should you?', '<div class="bl-h" style="color:var(--bad)">do not adopt AXIS at all when</div>' +
      E.dontAdopt.map(x => '<div style="font-size:14px;margin:6px 0;color:var(--ink-2)">• ' + esc(x) + '</div>').join('') +
      '<div class="bl-h" style="margin-top:14px;color:var(--ok)">' + esc(E.inverse.lead) + '</div>' +
      E.inverse.signals.map((sig, i) => '<label class="ck" style="margin:5px 0"><input type="checkbox" data-i="ensemble.toggle" ' + P({ id: 'sig' + i }) + (s.ensemble.indexOf('sig' + i) >= 0 ? ' checked' : '') + '><span>' + esc(sig) + '</span></label>').join('') +
      '<div class="panel" style="margin-top:11px;border-color:var(--' + (verdict.tone === 'ok' ? 'ok' : verdict.tone === 'warn' ? 'warn' : 'bad') + ')">' +
      '<div class="row"><span class="chip" data-tone="' + verdict.tone + '">' + n + ' of 4 signals</span></div>' +
      '<div style="font-size:14.5px;margin-top:7px">' + esc(verdict.text) + '</div>' +
      (n >= 2 ? '<div class="row" style="margin-top:9px">' + btn('profile.set', { id: 'lite' }, 'show me Lite') + btn('tutorial.goto', { id: '5.5' }, 'in 5.5', { cls: 'btn-sm' }) + '</div>' : '') +
      '</div>') +
    '</div>' +
    '<div class="panel" style="text-align:center;font-size:16px;padding:20px"><b>' + esc(E.close) + '</b></div>' +
    '</div>';
});

/* ── 5.15 This Page's Own AXIS ───────────────────────────────────────────── */
AX.defineWrapper('wrapper.view.selfview', '#view-selfview', ['*'], (s) => {
  const M = AX.managers.client, SM = AX.managers.server;
  const byComp = {};
  R.all().forEach(e => (byComp[e.component] = byComp[e.component] || []).push(e.key));
  const order = ['form', 'instance', 'identity', 'token', 'facet', 'intent', 'bond', 'link', 'action', 'manager', 'effect', 'impact', 'wrapper', 'adapter'];
  const registry = '<div class="scroll-x"><table><tr><th>component</th><th>live keys</th><th>what it is in this page</th></tr>' +
    MODEL.components.map(c => {
      const keys = (byComp[c.id] || []);
      const n = c.id === 'instance' ? 1 : c.id === 'intent' ? M.seq : keys.length;
      return '<tr style="--h:' + hue(c) + '"><td class="k" style="color:' + col(c) + '">' + esc(c.name) + '<div class="fine">' + n + '</div></td>' +
        '<td class="u-mono" style="font-size:11.5px">' + (keys.length ? keys.slice(0, 6).map(esc).join('<br>') + (keys.length > 6 ? '<br>+' + (keys.length - 6) + ' more' : '') : '<span class="fine">' + esc(c.runtimeNote || '— not a registry entry') + '</span>') + '</td>' +
        '<td style="font-size:13px">' + esc(c.pageRole) + '</td></tr>';
    }).join('') + '</table></div>';

  const trace = '<div class="trace">' + M.trace.slice(-40).reverse().map(t =>
    '<div><span class="t-t">#' + t.seq + '</span><span class="t-k">' + esc(t.kind) + '</span>' +
    '<span class="t-t">' + esc((t.facet || '').replace('facet.tutorial.', 'f.')) + '</span>' +
    '<span class="t-a">' + esc((t.action || '—').replace('action.', '')) + '</span>' +
    '<span class="t-e">[' + (t.effects || []).join(' ') + ']</span>' +
    '<span class="t-t">rev' + (t.rev || '—') + '</span>' +
    (t.rejected ? '<span style="color:var(--bad)">' + esc(t.rejected) + '</span>' : '') +
    (t.violations ? '<span style="color:var(--bad)">' + esc(t.violations.join(' · ')) + '</span>' : '') + '</div>').join('') + '</div>';

  const lint = s.lint ? '<div class="stack">' +
    '<div class="row">' + (s.lint.violations.length ? chip(s.lint.violations.length + ' of ' + s.lint.total + ' Actions are impure', 'bad') : chip('all ' + s.lint.total + ' Actions clean', 'ok')) +
    chip(s.lint.clean + ' clean', 'ok') + '</div>' +
    (s.lint.violations.length ? '<div class="scroll-x"><table><tr><th>action</th><th>findings</th></tr>' +
      s.lint.violations.map(v => '<tr><td class="k">' + esc(v.key) + '</td><td style="color:var(--bad)">' + esc(v.findings.join(' · ')) + '</td></tr>').join('') + '</table></div>' : '') +
    '<div class="note">' + esc(s.lint.ceiling) + '</div>' +
    '<div class="fine">The one violation above is <code>action.demo.impure</code>, registered on purpose so this panel has something true to find. No Facet routes to it, so the audition also reports it as unreachable — two different checks catching the same thing from two directions.</div>' +
    '</div>' : '<div class="note">Not run. <code>axis-lint</code> is the roadmap item critique 12.3 turns into a commitment; this is a first cut of it, reading the source text of everything registered as an Action.</div>';

  const rep = s.replay ? '<div class="stack">' +
    '<div class="row">' + (s.replay.match ? chip('replayed ' + s.replay.intents + ' Intents · final state identical', 'ok') : chip('replay diverged on: ' + s.replay.diffs.join(', '), 'bad')) + '</div>' +
    '<table><tr><td class="k">live hash</td><td class="u-mono">' + esc(s.replay.hashLive) + '</td></tr>' +
    '<tr><td class="k">replay hash</td><td class="u-mono">' + esc(s.replay.hashReplay) + '</td></tr>' +
    '<tr><td class="k">revisions</td><td>' + s.replay.revLive + ' live · ' + s.replay.revReplay + ' replayed</td></tr>' +
    '<tr><td class="k">time</td><td>' + s.replay.ms + ' ms</td></tr></table>' +
    '<div class="note">A fresh Manager bound with the same initial state, the same Actions and Facets and commit path, every Impact swapped for a recorder — then your whole session re-dispatched into it. That is the counter to critique 12.12: more seams do enlarge the wiring surface, and the Intent stream is what makes the enlarged surface testable.</div>' +
    '<div class="fine">Volatile slices are excluded from the comparison and named here rather than hidden: audit, lint, replay, toast, serverLog, invoice, linked. They depend on the other context or on this panel itself, so including them would be comparing the measurement to itself.</div>' +
    '</div>' : '<div class="note">Not run. Click through a few movements first, then replay: the recorded Intents are re-dispatched into a fresh Manager with stubbed Impacts, and the two final states are compared.</div>';

  const audit = s.audit ? '<div class="stack">' +
    '<div class="row">' + (s.audit.client.ok ? chip('client composition ok', 'ok') : chip('client composition FAILED', 'bad')) +
    (s.audit.server.ok ? chip('server composition ok', 'ok') : chip('server composition FAILED', 'bad')) + '</div>' +
    (s.audit.model.bonds || []).map(b => '<div class="row"><span class="chip" data-tone="' + (b.problems.length ? 'bad' : 'ok') + '">' + esc(b.key) + '</span><span class="fine">' + esc(b.describe) + '</span></div>' +
      (b.problems.length ? '<div class="fine" style="color:var(--bad)">' + b.problems.map(esc).join(' · ') + '</div>' : '')).join('') +
    (s.audit.model.drift.length ? '<div class="panel" style="border-color:var(--warn)"><div class="bl-h" style="color:var(--warn)">drift between the model and the runtime</div>' +
      s.audit.model.drift.map(d => '<div class="fine">' + esc(d) + '</div>').join('') + '</div>'
      : '<div class="row">' + chip('no drift: every key the model claims this page implements is live in the registry', 'ok') + '</div>') +
    '</div>' : '<div class="note">Not run.</div>';

  return '<div class="stack" data-wrapper="selfview">' +
    '<div class="row">' + btn('audit.run', {}, 'audit the composition') + btn('lint.run', {}, 'run axis-lint') + btn('replay.run', {}, 'replay my session') +
    '<span class="fine">each of these is a two-pass read: an Action declares it, an Impact performs it, the result re-enters as a follow-up Intent. Watch the log.</span></div>' +
    '<div class="cols-2">' +
    panel('The registry, keyed component.name', registry) +
    '<div class="stack">' +
    panel('Intent log · ' + M.seq + ' intents, revision ' + (M.instance ? M.instance.revisionId : 0), trace +
      '<div class="fine" style="margin-top:6px">kind · facet · action · [effects] · revision. This is an event source; it is what makes the replay possible.</div>') +
    panel('Replay', rep) +
    '</div></div>' +
    '<div class="cols-2">' +
    panel('Composition audit + model integrity', audit) +
    panel('axis-lint over this page\'s own Actions', lint) +
    '</div>' +
    panel('Honest limits of this demonstration',
      MODEL.limits.map(l => '<div style="font-size:14px;margin:7px 0;color:var(--ink-2)">• ' + esc(l) + '</div>').join('') +
      '<div class="note" style="margin-top:10px">Volunteering these is what makes the rest credible. A page that answers five objections well and dodges the sixth gets read as marketing.</div>') +
    '</div>';
});

/* ── THE STAGE — the skeleton, rendered once ─────────────────────────────── */
AX.defineWrapper('wrapper.stage', 'axis-stage', ['$boot'], (s) => {
  const head = '<header style="padding:clamp(30px,6vw,72px) 0 10px;max-width:1180px">' +
    '<div class="eyebrow">' + esc(MODEL.meta.author) + ' · model ' + esc(MODEL.meta.version) + '</div>' +
    '<h1 style="font-size:clamp(30px,5.4vw,52px);margin:10px 0 6px">' + esc(MODEL.meta.title.split(' — ')[0]) + '<span style="color:var(--ink-3)"> — Agentically eXtensible Instruction Structures</span></h1>' +
    '<p class="lede" style="font-size:18px">' + esc(MODEL.meta.subtitle) + '. This page is a tutorial about AXIS that is <b>itself an AXIS application</b>: one machine-readable model, rendered by a composition of the fourteen components it describes — and it will show you both, including the parts that do not work.</p>' +
    '<div class="panel" style="margin-top:18px;max-width:820px"><div class="bl-h">Who is reading?</div>' +
    '<div class="row" id="role-row">' + MODEL.roles.map(r => btn('tutorial.roleSet', { id: r.id }, esc(r.name), { auth: { role: r.id } })).join('') +
    btn('tutorial.roleSet', { id: '' }, 'skip', { cls: 'btn-sm', auth: { role: '' } }) + '</div>' +
    '<div class="note" style="margin-top:8px">This mints a Token whose claims select a Facet. It changes emphasis and depth — it does not hide anything, because gating a tutorial would be a bad product decision, and Facets are equally happy expressing either.</div>' +
    '</div></header>';
  const sections = MODEL.movements.map(m => {
    const act = IX.acts.find(a => a[0] === m.act);
    return '<section class="movement" id="mv-' + m.id + '" data-wrapper="mv-' + m.id + '">' +
      '<div class="m-head"><span class="m-num">' + m.id + '</span><h2 class="m-title">' + esc(m.title) + '</h2>' +
      (m.star ? '<span class="chip" data-tone="warn">★ critical</span>' : '') +
      '<span class="chip">Act ' + m.act + ' · ' + esc(act ? act[1] : '') + '</span></div>' +
      '<div class="takeaway"><b>Takeaway</b> — ' + esc(m.takeaway) + '</div>' +
      '<p class="lede" style="margin-top:12px">' + m.lede + '</p>' +
      '<div class="m-body"><div id="view-' + m.view + '"></div>' +
      (m.baseline ? baselineHTML(m.baseline) : '') +
      '</div>' +
      '<p class="note" style="margin-top:18px;font-size:14px">' + m.close + '</p>' +
      '</section>';
  }).join('');
  return head + sections + '<axis-footer></axis-footer>';
});
</script>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════════════════
   COMPOSITION TIME
   ------------------------------------------------------------------------------
   Everything below runs once, before the first Intent. Register, audition, bind.
   After bind() returns, the composition phase is over: no more hydration, no
   more wiring except through the studio in 5.9 — which does it as data, and
   re-auditions afterwards.
   ══════════════════════════════════════════════════════════════════════════════ */

/* The encoding block generates the CSS custom properties. The legend, the grid,
   the canvas and the stylesheet therefore cannot disagree about a hue. */
(function encodingFacet() {
  const vars = MODEL.axes.map(a => '--h-' + a.id + ':' + a.hue).join(';');
  const st = document.createElement('style');
  st.id = 'encoding.generated.look.css';
  st.setAttribute('data-facet', 'encoding.generated.look.css');
  st.textContent = ':root{' + vars + ';--h:' + MODEL.axes[0].hue + '}';
  document.head.appendChild(st);
})();

AX.managers = AX.managers || {};

const CLIENT = AX.createManager({
  id: 'manager.client', context: 'client', formKey: 'form.tutorial', identityKey: 'identity.reader',
  policy: AX.clientPolicy, tokenTtl: 45 * 60000,
  boundary: {
    ownedState: 'form.tutorial — reading position, role, profile, flow, selections',
    acceptedIntents: 'the delegate keys of facet.tutorial.*',
    emittedEffects: 'RENDER · PERSIST · URL_SET · FOCUS · TICK · TOAST · COMPOSE · AUDIT · LINT · REPLAY · SEND_TO_SERVER · FACET_SWAP',
    returnedOutcomes: 'rendered DOM, a persisted preference, a follow-up Intent',
    policyScope: 'claims minted from the reader-role selection; scope "reader"'
  }
});
AX.managers.client = CLIENT;

/* — Composer: register, in one place, by key — */
['facet.tutorial.reading', 'facet.tutorial.technical', 'facet.tutorial.gentle'].forEach(k => CLIENT.composer.registerFacet(k));
['bond.movement.act'].forEach(k => CLIENT.composer.registerBond(k));
['RENDER', 'PERSIST', 'URL_SET', 'FOCUS', 'TICK', 'TOAST', 'REJECTED', 'FACET_SWAP', 'COMPOSE', 'AUDIT', 'LINT', 'REPLAY', 'SEND_TO_SERVER', 'SERVER_RESET', 'CLIPBOARD_COPY']
  .forEach(k => CLIENT.composer.registerImpact(k));

/* Wrapper order matters exactly once: the stage builds the mount points the
   view wrappers render into. */
CLIENT.composer.bindWrapper('wrapper.stage');
CLIENT.composer.bindWrapper('wrapper.rail');
CLIENT.composer.bindWrapper('wrapper.walk');
MODEL.movements.forEach(m => { const k = 'wrapper.view.' + m.view; if (R.has(k)) CLIENT.composer.bindWrapper(k); });
CLIENT.composer.bindWrapper('wrapper.drawer');
CLIENT.composer.bindWrapper('wrapper.codeModal');
CLIENT.composer.bindWrapper('wrapper.footer');

/* — the server context — */
AX.buildServerManager();

/* — restore preferences (composition-time hydration: permitted until bind()
     returns, and not one instruction after — critique 12.10) — */
let restored = {};
try { restored = JSON.parse(localStorage.getItem('axis.tutorial') || '{}') || {}; } catch (e) { restored = {}; }
const fromHash = (() => {
  const p = new URLSearchParams(location.hash.replace(/^#/, ''));
  const o = {};
  if (p.get('m') && IX.mv[p.get('m')]) o.movement = p.get('m');
  if (p.get('flow') && IX.flow[p.get('flow')]) o.flow = p.get('flow');
  if (p.get('step')) o.step = Math.max(0, Number(p.get('step')) || 0);
  if (p.get('profile') && IX.profile[p.get('profile')]) o.profile = p.get('profile');
  if (p.get('role') && IX.role[p.get('role')]) o.role = p.get('role');
  return o;
})();
const initial = {};
['movement', 'role', 'profile', 'look', 'layout', 'walk', 'walkStep'].forEach(k => { if (restored[k] != null && restored[k] !== undefined) initial[k] = restored[k]; });
Object.assign(initial, fromHash);
if (initial.movement && !IX.mv[initial.movement]) delete initial.movement;
if (initial.role && !IX.role[initial.role]) delete initial.role;
if (initial.walkStep != null && !(initial.walkStep >= 0 && initial.walkStep < MODEL.evolution.stages.length)) initial.walkStep = 0;
if (initial.step != null && initial.flow && initial.step > IX.flow[initial.flow].steps.length) initial.step = 0;

const REPORT = CLIENT.composer.bind(initial);

/* ── ADAPTERS — the only four event listeners in the file ─────────────────── */
const feed = (adapterKey, raw) => {
  const intent = R.get(adapterKey)(raw);
  if (intent) CLIENT.dispatch(intent);
};
document.addEventListener('click', (ev) => feed('adapter.dom.click', ev));
document.addEventListener('change', (ev) => feed('adapter.dom.change', ev));
document.addEventListener('keydown', (ev) => feed('adapter.keyboard', ev));
window.addEventListener('hashchange', () => feed('adapter.hash', location.hash));
document.addEventListener('input', (ev) => { if (ev.target && ev.target.matches && ev.target.matches('input[type=range]')) feed('adapter.dom.change', ev); });

/* ── first paint ───────────────────────────────────────────────────────────
   Composition time ends with one Impact: render everything once. Note that
   even the first paint is an Effect executed by Impact — there is no path in
   this file that writes the DOM outside impact.RENDER. */
CLIENT.execute([
  { kind: 'FACET_SWAP', target: 'look', payload: { name: CLIENT.instance.state.look } },
  { kind: 'FACET_SWAP', target: 'layout', payload: { name: CLIENT.instance.state.layout } },
  { kind: 'RENDER', target: '*', payload: { changed: ['*'] } }
], AX.intent('boot', 'boot', {}, { source: 'system', silent: true }));

AX.startWorker();

/* An honest note in the console for anyone who opens it. */
if (!REPORT.ok) {
  const lines = ['AXIS composition audit FAILED at bind():'].concat(
    REPORT.missingHandlers.map(m => '  missing handler: ' + m.action + ' declares ' + m.kind),
    REPORT.unresolvedCapabilities.map(m => '  unresolved: ' + m.facet + '[' + m.capability + '] → ' + m.target),
    REPORT.orphanedFacets.map(f => '  orphaned facet: ' + f),
    REPORT.danglingLinks.map(l => '  dangling link: ' + l.action + ' needs ' + l.link));
  console.warn(lines.join('\n'));
} else {
  console.info('AXIS · composition audited and bound · ' + R.size() + ' keys · ' +
    REPORT.checked.actions + ' reachable actions · ' + REPORT.checked.handlers + ' impact handlers');
}
console.info('The model this page renders is in <script id="axis-model"> and <script id="axis-narrative">. Everything else is a renderer.');
</script>
